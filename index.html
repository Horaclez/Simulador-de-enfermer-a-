ambia con la postura; la disección da diferencia de PA entre brazos.", 3], ["Fármacos", "Se decide dar un antiagregante.", "¿Cuál es la conducta correcta con el ácido acetilsalicílico?", ["Preguntar por alergia y sangrado reciente, y darlo masticado", "Preguntar por alergia y darlo entero con agua para cuidar el estómago", "Darlo solo si la troponina sale elevada", "Darlo junto con un anticoagulante sin avisar al médico"], "Se da lo antes posible, masticado para acelerar la absorción, previa verificación de alergia y sangrado; no se espera la troponina ni se agregan otros antitrombóticos sin indicación.", 1], ["Decisión", "Dolor 8/10. PA 96/58. Un colega propone tratar el dolor de inmediato.", "¿Qué haces?", ["Retener el nitrato y consultar otra analgesia, por la hipotensión", "Dar nitroglicerina sublingual a media dosis para evitar la hipotensión", "Dar morfina EV en bolo rápido por ser el analgésico de elección", "Dar nitroglicerina solo si el dolor supera 9/10"], "Con PA sistólica baja y posible compromiso del ventrículo derecho, los nitratos pueden causar un colapso, incluso a media dosis. La morfina también puede bajar la PA y se titula con indicación, nunca en bolo rápido.", 3], ["Laboratorio", "Resultados: K⁺ 3,1 mEq/L y glicemia 280 mg/dL. Troponina pendiente.", "¿Qué haces con estos valores?", ["Aviso y repongo el potasio con monitorización según indicación", "Repongo potasio oral y repito el examen en 24 horas", "Indico insulina para bajar la glicemia antes de tocar el potasio", "Espero la troponina antes de actuar sobre el potasio"], "El potasio bajo aumenta el riesgo de arritmias en el infarto y se repone de forma monitorizada. La insulina lo bajaría aún más.", 2], ["Cálculo de dosis", "Se indica KCl 20 mEq en 100 mL por vía periférica; el límite es 10 mEq/h.", "¿En cuánto tiempo como mínimo se infunde?", ["2 horas (50 mL/h)", "1 hora (100 mL/h)", "4 horas (25 mL/h)", "30 minutos (200 mL/h)"], "20 mEq ÷ 10 mEq/h = 2 horas; 100 mL en 2 horas son 50 mL/h.", 2], ["Ética y derechos", "Cardiología indica una angioplastia urgente. El paciente está lúcido, con dolor.", "¿Cómo procedes con el consentimiento?", ["Explicarle el procedimiento, riesgos y alternativas y obtener su consentimiento", "Pedir el consentimiento a un familiar, porque el dolor limita su capacidad", "Proceder sin consentimiento, porque el riesgo vital justifica la urgencia", "Esperar un documento extenso y firmado antes de preparar la sala"], "Si está lúcido decide él: se le informa y se obtiene su consentimiento sin demorar la reperfusión. El dolor no lo hace incapaz y la excepción por urgencia aplica cuando no puede decidir.", 1], ["Complicación", "Durante la espera pierde la conciencia. Está sin respuesta, sin respirar y el monitor muestra fibrilación ventricular.", "¿Qué haces?", ["Inicio compresiones y desfibrilo apenas esté el equipo", "Verifico el pulso carotídeo 30 segundos antes de comprimir", "Intubo para oxigenar y luego comprimo", "Administro adrenalina y desfibrilo después del segundo ciclo"], "La FV se trata con compresiones inmediatas y desfibrilación lo antes posible. El pulso se evalúa a lo más 10 segundos y la vía aérea avanzada no antecede a las compresiones.", 3], ["Procedimiento: DEA", "Llega el desfibrilador y colocas los parches.", "¿Qué haces durante el análisis y la descarga?", ["Que nadie toque al paciente y reinicio compresiones de inmediato tras el choque", "Descargo y verifico el pulso durante 10 segundos antes de reanudar las compresiones", "Sigo comprimiendo durante el análisis del ritmo para no interrumpir la perfusión", "Aplico tres descargas seguidas sin compresiones entre ellas, según el esquema clásico"], "Nadie toca al paciente durante el análisis y la descarga; después se reanudan las compresiones de inmediato por 2 minutos. Las descargas en serie sin RCP corresponden a esquemas antiguos.", 2], ["Fármacos en el paro", "El ritmo persiste en fibrilación ventricular tras la descarga.", "¿Qué fármacos se anticipan?", ["Adrenalina cada 3 a 5 minutos y amiodarona si persiste el ritmo", "Atropina y adrenalina alternadas cada 3 minutos durante la reanimación", "Lidocaína como primera línea antes de comenzar con la adrenalina", "Bicarbonato de rutina junto con cada dosis de adrenalina"], "En FV persistente se usan adrenalina cada 3 a 5 minutos y amiodarona; la atropina ya no se usa de rutina y el bicarbonato no es de rutina.", 2], ["Registro en ficha", "Recupera la circulación espontánea. Debes dejar el registro.", "¿Qué registras?", ["Horas, ritmos, descargas, fármacos con dosis, respuesta y avisos, con firma", "Horas, ritmos y descargas, dejando los fármacos para el registro de farmacia del servicio", "Un resumen del protocolo aplicado, sin detalle de las horas, para no extender la nota", "El registro completo al final del turno, escrito de memoria con calma"], "El registro es inmediato, objetivo y completo; los fármacos con dosis y las horas son parte del documento legal.", 1], ["Seguimiento", "Pasa a la unidad coronaria tras el paro.", "¿Qué vigilas en las primeras horas?", ["Ritmo, PA, saturación, temperatura, glicemia, diuresis y neurología", "Ritmo y PA de forma continua, dejando glicemia y neurología para el alta", "Temperatura y glicemia solo cuando el paciente refiere síntomas", "Signos vitales cada 8 horas, como en cualquier paciente de sala"], "Los cuidados posparo incluyen monitorización hemodinámica, control de temperatura y glicemia, diuresis y evaluación neurológica frecuente.", 2], ["Educación al alta", "Días después sale de alta con un stent y doble antiagregación.", "¿Qué educas con prioridad?", ["No suspender los antiagregantes, dejar de fumar, rehabilitación y signos de alarma", "Suspender un antiagregante al mes si no hay síntomas, para reducir el riesgo de sangrado", "Retomar de inmediato el ejercicio intenso para fortalecer el corazón", "Usar antiinflamatorios para el dolor muscular que aparezca con el esfuerzo"], "Suspender los antiagregantes en forma prematura causa trombosis del stent; la rehabilitación es progresiva y los AINE aumentan el riesgo cardiovascular y de sangrado.", 2]], "n": "Infarto con SDST (GES) con activación de la red de reperfusión; RCP y desfibrilación según guías AHA, y la Ley 21.156 sobre desfibriladores en lugares públicos; Ley 20.584 (consentimiento informado y ficha clínica); Programa de Salud Cardiovascular y rehabilitación cardiaca.", "d": ["Infarto agudo con supradesnivel del ST con compromiso del ventrículo derecho, complicado con paro por fibrilación ventricular.", "El nitrato se evita con hipotensión y compromiso del ventrículo derecho; las compresiones y la desfibrilación precoz determinan la supervivencia; la educación al alta previene nuevos eventos."]}, {"t": "Sepsis urinaria: un turno completo en medicina", "l": "Urgencia · UCI · sala", "x": "Mujer de 78 años con una sonda Foley instalada hace 7 días llega con fiebre y confusión. Su hija la acompaña.", "s": [["Evaluación inicial", "PA 84/46 · FC 124 · FR 28 · Sat 92% · T 39,1 °C. Confusa, no responde preguntas simples.", "¿Qué haces primero?", ["Evaluar ABCDE, dar O₂, canalizar dos vías y monitorizar", "Tomar hemocultivos y urocultivo completos antes de cualquier otra medida", "Dar paracetamol y un bolo de suero y reevaluar en 30 minutos", "Solicitar un TAC de cráneo por la confusión antes de estabilizar"], "La estabilización inicial va primero; los cultivos se toman sin retrasar el tratamiento y el TAC no antecede a la reanimación.", 2], ["Sospecha clínica", "Piel caliente, sonda Foley instalada hace 7 días, orina turbia, lactato 4,2 mmol/L.", "¿Cuál es tu sospecha clínica principal?", ["Shock séptico de foco urinario", "Golpe de calor clásico", "Meningitis bacteriana", "Shock anafiláctico por un fármaco reciente"], "Fiebre con foco urinario evidente, hipotensión y lactato elevado indican shock séptico. El golpe de calor no explica la orina turbia ni el catéter, y no hay datos de meningitis ni de exposición alérgica.", 3], ["Procedimiento: hemocultivos", "Se indica iniciar el antibiótico.", "¿Cómo tomas los cultivos?", ["Dos sets de sitios distintos y urocultivo, sin retrasar el antibiótico", "Un set desde el catéter venoso antiguo ya instalado, para evitar una nueva punción", "Un solo set de un único sitio, tomado después de iniciar el antibiótico", "Los cultivos solo si no hay mejoría clínica a las 24 horas de tratamiento"], "Se toman dos sets por punción de sitios distintos antes del antibiótico, sin demorarlo; los cultivos de catéteres antiguos se contaminan con más frecuencia.", 2], ["Fármacos", "Tiene anotada alergia a la penicilina con rash leve. Se indica ceftriaxona.", "¿Qué haces?", ["Verifico con el médico y la farmacia el tipo de reacción y administro con vigilancia si es seguro", "Cambio a otro antibiótico betalactámico sin avisar al equipo, para evitar el riesgo de alergia", "Administro la primera dosis fraccionada a la mitad para evaluar la tolerancia antes del resto", "Suspendo el antibiótico hasta que alergología evalúe a la paciente en la policlínica"], "La decisión se toma con el equipo, sin retrasar el antibiótico en un shock séptico. Cambiar de fármaco sin avisar o fraccionar la dosis no son prácticas seguras.", 2], ["Cálculo de dosis", "Se indican 30 mL/kg de cristaloide. La paciente pesa 60 kg.", "¿Cuántos mL corresponden?", ["1.800 mL", "2.400 mL", "900 mL", "1.200 mL"], "30 mL × 60 kg = 1.800 mL. Los otros valores corresponden a 40, 15 y 20 mL/kg.", 2], ["Decisión", "Tras 1,8 L: PA 82/44, lactato 4,0, diuresis 10 mL/h. Pulmones sin crépitos.", "¿Qué haces?", ["Aviso para iniciar un vasopresor sin demora y reevalúo la perfusión", "Administro furosemida EV para restablecer la diuresis", "Doy bicarbonato en bolo para corregir la acidosis y subir la presión", "Suspendo el volumen y espero los cultivos"], "La hipotensión persistente tras el volumen inicial requiere vasopresor. La furosemida agrava la hipovolemia y el bicarbonato no trata la causa.", 3], ["Cálculo de dosis", "Noradrenalina 4 mg en 250 mL (16 µg/mL). Se indican 8 µg/min.", "¿A cuántos mL/h se programa la bomba?", ["30 mL/h", "60 mL/h", "15 mL/h", "480 mL/h"], "8 µg/min × 60 = 480 µg/h; 480 ÷ 16 µg/mL = 30 mL/h. 480 es el valor en µg/h, no en mL/h.", 2], ["Procedimiento: sonda Foley", "El médico decide cambiar la sonda, probable foco infeccioso.", "¿Cómo procedes?", ["Cambio la sonda con técnica estéril y tomo la muestra del puerto, previa desinfección", "Tomo la muestra desde la bolsa colectora y mantengo la sonda actual sin cambiarla", "Irrigo la sonda con suero para descartar una obstrucción y la mantengo instalada", "Retiro la sonda y reutilizo la misma después de lavarla con agua y jabón"], "La sonda de más de 7 días con infección se reemplaza y la muestra se toma del puerto, no de la bolsa. Las sondas no se reutilizan.", 2], ["Laboratorio", "Gasometría: pH 7,28 · pCO₂ 30 mmHg · HCO₃ 13 mEq/L.", "¿Cómo la interpretas?", ["Acidosis metabólica con compensación respiratoria", "Acidosis mixta, respiratoria y metabólica", "Alcalosis respiratoria con compensación metabólica", "Acidosis respiratoria aguda"], "El pH bajo con bicarbonato bajo indica acidosis metabólica; la pCO₂ baja es la compensación por hiperventilación. Una acidosis mixta tendría pCO₂ elevada.", 2], ["Complicación", "En la noche, la paciente confusa intenta levantarse, cae y refiere dolor en la cadera.", "¿Qué haces?", ["La mantengo en el suelo, evalúo cabeza, cuello y cadera y aviso; luego notifico el evento", "La levanto con una persona más mientras evalúo el dolor de la cadera y los signos vitales", "La mantengo en el suelo, tomo la PA y espero la ronda médica de la mañana para evaluarla", "La levanto lentamente y compruebo si logra apoyar el peso en esa pierna antes de avisar"], "No se moviliza hasta evaluar por posible fractura o lesión cervical, se avisa de inmediato y se notifica el evento adverso.", 3], ["Ética y confidencialidad", "Una hija pide información detallada y que no se informe a su hermana.", "¿Qué corresponde?", ["Informar lo autorizado por la paciente o su representante y derivar las dudas al médico", "Informar a la hija que más participa en su cuidado, porque es quien firma los documentos", "Informar solo a la hermana para equilibrar la situación y evitar conflictos familiares", "Preguntar a la hija si autoriza que se informe a la hermana y actuar según su respuesta"], "La información reservada se entrega según la voluntad de la paciente o de su representante, no por el grado de participación familiar (Ley 20.584).", 1], ["IAAS", "El cultivo revela una Klebsiella productora de BLEE.", "¿Qué precauciones aplicas?", ["Contacto: higiene de manos, bata, guantes y equipo exclusivo", "Gotitas con mascarilla quirúrgica", "Solo precauciones estándar, por ser un germen de la comunidad", "Aislamiento protector (inverso)"], "Los gérmenes multirresistentes se manejan con precauciones de contacto además de las estándar.", 2], ["Registro en ficha", "Al final del turno debes registrar la evolución.", "¿Qué registras?", ["Hora, hallazgos, intervenciones, respuesta, avisos y la caída con su notificación, con firma", "Hora, hallazgos y resultados de laboratorio, sin consignar la caída para no preocupar a la familia", "Un resumen de lo realizado durante el turno, sin horas, para no extender demasiado la nota", "El registro completo al día siguiente, escrito de memoria cuando haya más tiempo"], "Todo evento relevante, incluida la caída, se registra de forma objetiva y oportuna.", 1], ["Educación al alta", "Días después, alta con la sonda retirada y un antibiótico oral.", "¿Qué educas con prioridad?", ["Hidratación, completar el antibiótico, higiene perineal y signos de alarma", "Suspender el antibiótico cuando desaparezca la fiebre y se sienta mejor", "Usar antiinflamatorios si siente molestias persistentes al orinar", "Reducir la ingesta de líquidos para evitar las ganas frecuentes de orinar"], "Completar el tratamiento evita recaídas; los antiinflamatorios y la restricción de líquidos empeoran el riesgo.", 2]], "n": "Sepsis y shock séptico (lineamientos Surviving Sepsis adoptados en protocolos locales), Programa de IAAS del MINSAL (infecciones urinarias asociadas a catéter, precauciones de contacto), prevención de caídas y notificación de eventos adversos (estándares de acreditación), Ley 20.584.", "d": ["Shock séptico de foco urinario en un paciente con sonda, complicado con una caída intrahospitalaria y un microorganismo multirresistente.", "El antibiótico y el volumen precoces, el vasopresor oportuno, el cambio de la sonda y la prevención de caídas e infecciones son los pilares del manejo."]}];

HD.push({"t": "Politraumatizado tras un choque", "l": "Urgencia · pabellón · UCI", "x": "Hombre de 32 años, conductor de un auto que chocó de frente a alta velocidad. Llega en ambulancia con collar cervical, quejándose de dolor abdominal y dificultad para respirar.", "s": [["Triage", "PA 88/54 · FC 126 · FR 30 · Sat 90% · Glasgow 14. Abdomen distendido y hematoma en el flanco izquierdo.", "¿Qué categoría de triage asignas?", ["C1 · Reanimación: requiere intervenciones inmediatas por shock e hipoxemia", "C2 · Emergencia: situación de alto riesgo, estable en su vía aérea", "C3 · Urgencia: varios recursos esperados y signos vitales alterados", "C4 · Urgencia menor: evaluación con un estudio de imagen"], "Hay shock con hipoxemia que exigen intervenciones inmediatas que salvan la vida: C1.", 2], ["Evaluación primaria", "Se inicia la evaluación primaria del paciente politraumatizado.", "¿Cuál es el orden de prioridades?", ["Control de hemorragia, vía aérea con control cervical, ventilación, circulación, neurología y exposición", "Neurología con Glasgow primero, antes de revisar la vía aérea y las hemorragias", "Radiografías de tórax y pelvis primero, para definir las lesiones antes de actuar", "Vía aérea, ventilación y circulación, dejando las hemorragias externas para la evaluación secundaria"], "En trauma (X-ABCDE) la hemorragia masiva se controla primero, con la columna cervical protegida; las imágenes no anteceden a la reanimación.", 2], ["Sospecha clínica", "Hemitórax derecho con murmullo abolido e hipersonoridad; yugulares planas; tráquea central. Abdomen distendido, doloroso, con hematoma en el flanco izquierdo. FAST positivo en la fosa esplénica.", "¿Cuáles son tus sospechas principales?", ["Neumotórax derecho y hemorragia intraabdominal por probable lesión esplénica", "Contusión pulmonar bilateral con shock por contusión miocárdica", "Hemotórax masivo derecho con taponamiento cardiaco y shock obstructivo", "Neumotórax a tensión izquierdo con shock neurogénico por lesión medular alta"], "Murmullo abolido con hipersonoridad orienta a neumotórax; con yugulares planas y tráquea central aún no es a tensión. El hematoma en el flanco con FAST positivo indica sangrado esplénico.", 3], ["Procedimiento: acceso venoso", "El médico pide acceso para reanimar al paciente.", "¿Cómo canalizas?", ["Dos vías periféricas de grueso calibre en antebrazos, sin retrasar el traslado a pabellón", "Una vía central femoral izquierda de entrada, para infundir volumen más rápido", "Una vía periférica de pequeño calibre en el dorso de la mano, para evitar el dolor", "Esperar el resultado de la tomografía antes de canalizar, para elegir bien el sitio"], "En el trauma con hemorragia se instalan dos vías periféricas gruesas rápido; las vías centrales o los estudios no deben retrasar la reanimación.", 1], ["Decisión: reposición", "PA 88/54, FC 126. El sangrado intraabdominal no está controlado.", "¿Cómo repones el volumen?", ["Con hemoderivados y volumen limitado de cristaloides, hasta una PA mínima aceptable según indicación", "Con 3 litros de cristaloides rápidos hasta normalizar la PA lo antes posible", "Con coloides en bolo hasta una PA de 120/80, para asegurar la perfusión de los órganos", "Sin reponer volumen hasta que se complete la tomografía, para no aumentar el sangrado"], "En hemorragia no controlada se usa reanimación hemostática con hemoderivados e hipotensión permisiva; el exceso de cristaloides diluye y favorece el sangrado.", 3], ["Fármacos", "El médico indica ácido tranexámico.", "¿Cómo se administra y por qué?", ["1 g EV diluido en 10 minutos, lo antes posible, para reducir la fibrinolisis y el sangrado", "1 g EV en bolo directo en 30 segundos, para que actúe de inmediato sobre el sangrado", "1 g por vía IM profunda, porque no se dispone de otro acceso venoso", "500 mg EV en infusión de 6 horas, porque el efecto es mejor si se administra más lento"], "El ácido tranexámico antifibrinolítico se da precozmente y diluido en 10 minutos; un bolo bal, sin entregar documentos ni resultados"], "La información clínica es reservada; cualquier entrega a la autoridad se evalúa según la ley (Ley 20.584) por la jefatura.", 1], ["IAAS y drenajes", "Se instala un drenaje pleural derecho con sello de agua.", "¿Qué cuidados aplicas?", ["Sistema cerrado bajo el nivel del tórax, sin clampear si hay fuga de aire, y registrar el débito", "Clampear el drenaje durante la movilización para evitar que entre aire al tórax", "Elevar el frasco al nivel del tórax durante el traslado para evitar derrames", "Desconectar el sistema cada turno para vaciar el frasco y reconectar la misma tubuladura"], "El sistema se mantiene cerrado, bajo el tórax y sin clampear con fuga de aire; desconectarlo aumenta el riesgo de infección y de neumotórax.", 2], ["Registro en ficha", "Al término del turno debes dejar el registro.", "¿Qué registras?", ["Hallazgos, intervenciones con hora, fármacos con dosis, la complicación y los avisos, con firma", "Hallazgos e intervenciones principales, sin horas ni dosis para no extender la nota", "Un resumen del manejo y los exámenes, con las horas escritas de memoria al final del turno", "Solo los fármacos y las dosis administradas, dejando los hallazgos para la nota médica"], "Las horas, las dosis, la complicación y las comunicaciones forman parte del documento legal y de la mejora de calidad.", 1], ["Seguimiento", "Tras la cirugía, el paciente queda en UCI.", "¿Qué priorizas en las primeras horas?", ["Signos vitales, hemoglobina, débito del drenaje y abdomen, analgesia y prevención de hipotermia", "Signos vitales cada 4 horas, con foco en el confort y sin medir el débito del drenaje", "Movilización precoz intensiva y alimentación completa desde las primeras horas", "Temperatura y diuresis solamente, porque la hemorragia ya fue operada"], "Tras un trauma grave se vigila el resangrado, el drenaje, el dolor y la hipotermia, que agrava la coagulopatía.", 2], ["Educación al alta", "Semanas después, el paciente se va HD.push({"t": "Hemorragia posparto: del parto al puerperio", "l": "Sala de partos · pabellón · puerperio", "x": "Mujer de 29 años, primípara, tiene un parto vaginal a las 39 semanas sin complicaciones aparentes. Después del alumbramiento, la matrona avisa que el sangrado es abundante.", "s": [["Evaluación inicial", "PA 100/64 · FC 104 · sangrado vaginal activo con coágulos. Útero blando, por sobre el ombligo.", "¿Cuál es tu primera acción?", ["Masaje uterino bimanual, avisar de inmediato y canalizar dos vías gruesas", "Colocar compresas y medir el sangrado cada 30 minutos antes de avisar al equipo", "Dar analgesia y trasladarla a la sala de recuperación para evaluar el sangrado allí", "Hacer un tacto vaginal para buscar restos y esperar el resultado de una ecografía"], "Con un útero blando y sangrado activo se actúa de inmediato sobre el útero y se pide ayuda; esperar o trasladar retrasa el tratamiento.", 3], ["Sospecha clínica", "La placenta salió completa. No hay desgarros visibles en el canal del parto. El útero no se contrae al masajearlo.", "¿Cuál es la causa más probable?", ["Atonía uterina posparto", "Retención de restos placentarios por alumbramiento incompleto", "Desgarro cervical con hemorragia continua", "Coagulopatía por desprendimiento de placenta"], "Un útero blando sin tono, con placenta completa y sin desgarros visibles, orienta a atonía uterina, la causa más frecuente de hemorragia posparto.", 2], ["Fármacos", "El médico indica oxitocina.", "¿Cómo se administra?", ["IM o en infusión EV diluida, nunca en bolo rápido, vigilando PA y frecuencia cardiaca", "En bolo EV rápido de 10 UI para lograr una contracción uterina inmediata", "Por vía sublingual mientras se prepara el acceso venoso adicional", "IM en dosis alta, repetida cada 5 minutos hasta que el útero se contraiga"], "La oxitocina en bolo rápido puede causar hipotensión y taquicardia graves; se usa IM o en infusión diluida.", 2], ["Cálculo de dosis", "Se prepara oxitocina 20 UI en 500 mL de suero, a 125 mL/h.", "¿Cuántas UI por hora recibe la paciente?", ["5 UI/h", "20 UI/h", "2,5 UI/h", "10 UI/h"], "20 UI ÷ 500 mL = 0,04 UI/mL; 0,04 × 125 mL/h = 5 UI por hora.", 2], ["Procedimiento: sonda vesical", "Se decide vaciar la vejiga para favorecer la contracción del útero.", "¿Cómo procedes?", ["Instalar una sonda con técnica estéril y medir la diuresis, porque la vejiga llena impide la contracción", "Esperar a que la paciente orine sola en la cama, para evitar el riesgo de infección", "Aplicar compresión suprapúbica fuerte para obligarla a vaciar la vejiga sin sonda", "Instalar la sonda sin técnica estéril para ahorrar tiempo durante la emergencia"], "Una vejiga llena desplaza el útero y favorece la atonía; se vacía con técnica estéril y se mide la diuresis.", 1], ["Decisión: reposición", "PA 88/50 · FC 128 · pérdida estimada de 1.500 mL.", "¿Cómo continúas?", ["Reponer con cristaloides y hemoderivados según indicación y activar el protocolo de hemorragia masiva", "Reponer solo con cristaloides hasta normalizar la PA y esperar los exámenes antes de otras medidas", "Mantener la oxitocina y esperar 30 minutos antes de activar otras medidas o pedir sangre", "Dar un bolo de coloides y reiniciar una dieta liviana para favorecer la recuperación"], "Con una pérdida de 1.500 mL y shock se activa el protocolo de hemorragia masiva con hemoderivados; los cristaloides solos y la espera empeoran la coagulopatía.", 3], ["Fármacos", "Persiste la atonía. El médico indica un segundo uterotónico: metilergometrina.", "¿Qué verificas antes de administrarla?", ["Que no tenga hipertensión ni preeclampsia, porque produce vasoconstricción y sube la PA", "Que no tenga antecedente de asma, porque produce broncoespasmo", "Que esté en ayunas, porque puede provocar vómitos", "Que tenga la vejiga vacía, porque produce retención urinaria"], "La metilergometrina es vasoconstrictora y está contraindicada en hipertensión y preeclampsia; el broncoespasmo se asocia a otros uterotónicos.", 2], ["Laboratorio", "Hb 6,9 g/dL, fibrinógeno bajo, plaquetas 90.000 e INR 1,6.", "¿Cómo lo interpretas?", ["Coagulopatía por consumo tras la hemorragia: requiere hemoderivados, incluido plasma y fibrinógeno", "Anemia ferropénica crónica del embarazo: se indica hierro oral y control en un mes", "Trombocitopenia gestacional benigna: se mantiene la observación y el control de plaquetas", "Alteración sin importancia por el estrés del parto: se repite el examen al día siguiente"], "La hemorragia masiva consume factores de coagulación; se corrige con hemoderivados dirigidos, no con hierro oral ni esperando.", 2], ["Complicación", "Durante la transfusión aparecen rash, disnea y fiebre.", "¿Qué haces?", ["Detener la transfusión, mantener la vía con suero, avisar y verificar la identidad y la unidad", "Disminuir la velocidad y dar paracetamol, ya que la hemorragia exige continuar transfundiendo", "Continuar la transfusión mientras se espera la evaluación médica, para no perder el efecto", "Cambiar la unidad por otra del mismo grupo sin avisar, para no retrasar la reposición"], "Ante una reacción transfusional se detiene la transfusión, se mantiene la vía, se verifica la identidad y se avisa de inmediato.", 3], ["Ética y derechos", "El esposo pide que no se informe a la paciente de la gravedad para no angustiarla.", "¿Qué corresponde?", ["Informar a la paciente con lenguaje claro y empatía, porque tiene derecho a ser informada, y apoyar a su pareja", "Aceptar el pedido y ocultar la información hasta que esté recuperada, para evitarle angustia", "Informar solo al esposo y que él decida cuánto contarle según su criterio", "Entregar la información por escrito sin explicarla, para que la lea cuando pueda"], "La paciente tiene derecho a ser informada de su estado de salud (Ley 20.584), de forma comprensible y respetuosa.", 1], ["IAAS", "Tras el parto y la manipulación, hay riesgo de endometritis.", "¿Qué medidas aplicas?", ["Higiene de manos, técnica aséptica en curaciones y sonda, y vigilar fiebre y loquios", "Administrar un antibiótico profiláctico a todas las pacientes por iniciativa propia", "Hacer las curaciones perineales con guantes no estériles reutilizando el material", "Evitar la higiene perineal por 24 horas para no romper la cicatriz"], "La prevención se basa en la asepsia y la vigilancia; los antibióticos se indican por protocolo, no por iniciativa propia.", 2], ["Registro en ficha", "Al final del turno debes dejar el registro del evento.", "¿Qué registras?", ["Hora del alumbramiento, pérdida estimada, fármacos con dosis, transfusiones, complicación y avisos, con firma", "Pérdida estimada y fármacos con dosis, sin horas ni transfusiones, para no extender la nota", "Un resumen del parto y el puerperio, con las horas escritas de memoria al final del turno", "Solo los hallazgos al examen y la decisión de traslado, sin el detalle de los fármacos"], "El registro es objetivo y completo: horas, volúmenes, dosis, transfusiones y comunicaciones.", 1], ["Seguimiento", "La paciente se estabiliza y pasa al puerperio.", "¿Qué vigilas en las primeras horas?", ["Tono uterino, sangrado, signos vitales, diuresis y hemoglobina de control, atentos a signos de shock", "Signos vitales cada 8 horas y alimentación libre, porque la hemorragia ya se resolvió", "Solo el dolor y la lactancia, dejando el control del sangrado para la visita médica del día siguiente", "Temperatura cada 2 horas, sin controlar el tono uterino ni la diuresis"], "El riesgo de recaída es alto en el puerperio inmediato: se vigilan el útero, el sangrado y la perfusión.", 2], ["Educación al alta", "Días después, la paciente se va de alta con su bebé.", "¿Qué educas con prioridad?", ["Signos de alarma (sangrado abundante, fiebre, mareo), anticoncepción, lactancia, hierro y control puerperal", "Retomar la actividad física intensa y las relaciones sexuales apenas se sienta mejor, sin control", "Suspender el hierro y la lactancia si siente cansancio, hasta recuperar las fuerzas por completo", "Esperar a que el sangrado sea abundante para consultar, ya que es normal tras una hemorragia"], "Reconocer los signos de alarma, completar el hierro, mantener la lactancia y asistir al control puerperal previenen complicaciones.", 2]], "n": "Hemorragia posparto: Guía Perinatal MINSAL (manejo activo del alumbramiento, uterotónicos y protocolo de hemorragia masiva), medicina transfusional, Ley 20.584 (información al paciente y confidencialidad), Programa de IAAS, control puerperal y registro en ficha.", "d": ["Atonía uterina con hemorragia masiva y coagulopatía por consumo, con una reacción transfusional como complicación.", "El masaje uterino, los uterotónicos (con atención a sus contraindicaciones), el vaciado vesical y la reposición con hemoderivados detienen el sangrado; la transfusión se vigila de cerca."]});

HD.push({"t": "Lactante con bronquiolitis grave", "l": "Urgencia pediátrica · UCI pediátrica · alta", "x": "Lactante de 3 meses, 5 kg, con 4 días de coriza y tos. Su madre lo trae porque rechaza el pecho y respira con dificultad.", "s": [["Triage", "FR 68 · FC 170 · Sat 86% aire ambiente · T 37,8 °C. Quejido y retracción subcostal.", "¿Qué categoría de triage asignas?", ["C2 · Emergencia: dificultad respiratoria con hipoxemia en un lactante pequeño", "C1 · Reanimación: requiere una intervención vital inmediata en este momento", "C3 · Urgencia: estable, con varios estudios por realizar en la sala de espera", "C4 · Urgencia menor: evaluación respiratoria que requiere un solo recurso"], "La hipoxemia con dificultad respiratoria en un lactante pequeño es una situación de alto riesgo (C2); la vía aérea se mantiene permeable, por eso aún no es C1.", 2], ["Oxigenoterapia", "Sat 86% con aire ambiente.", "¿Cómo inicias el oxígeno?", ["Cánula nasal de bajo flujo o halo, titulando según la saturación indicada y reevaluando", "Mascarilla con reservorio a 15 L/min para llevar la saturación hasta 100% de inmediato", "Mascarilla simple a 2 L/min y suspender el oxígeno apenas el lactante deje de llorar", "Cánula nasal a 8 L/min de flujo fijo, sin titular, para asegurar una buena oxigenación"], "En lactantes se usa un dispositivo de bajo flujo y se titula según la meta; flujos altos o fijos no corresponden y la mascarilla simple a flujo bajo reinhala CO₂.", 2], ["Procedimiento: secreciones nasales", "El lactante tiene secreciones que obstruyen la nariz y le dificultan la alimentación.", "¿Cómo procedes?", ["Aspirar suavemente las secreciones nasales con presión baja, en posición semisentada y antes de las tomas", "Aspirar de forma profunda la faringe y repetirlo cada 15 minutos para mantener la vía limpia", "Hacer lavados nasales con abundante suero a presión para arrastrar las secreciones hacia la garganta", "No aspirar las secreciones para evitar irritar la mucosa y provocar más inflamación"], "La desobstrucción nasal suave mejora la alimentación y la respiración; la aspiración profunda y repetida irrita y desatura.", 1], ["Sospecha clínica", "Sibilancias espiratorias difusas y crépitos finos, sin fiebre alta. Hermano mayor con resfrío. Primer episodio.", "¿Cuál es tu sospecha clínica principal?", ["Bronquiolitis aguda viral, probablemente por VRS", "Neumonía bacteriana lobar con derrame pleural asociado", "Primera crisis de asma con broncoespasmo reversible", "Aspiración de cuerpo extraño en el bronquio derecho"], "Lactante pequeño con coriza, sibilancias y crépitos difusos, contacto con resfrío y primer episodio: bronquiolitis viral; la neumonía suele ser focal y con fiebre alta.", 3], ["Decisión", "El residente propone salbutamol nebulizado cada 20 minutos y un corticoide oral.", "¿Qué haces?", ["Consultar la indicación, porque en la bronquiolitis típica no hay beneficio claro, y mantener oxígeno e hidratación", "Administrar salbutamol cada 20 minutos hasta que desaparezcan las sibilancias y reevaluar el efecto", "Dar el corticoide por vía oral y esperar la respuesta antes de otra medida de soporte", "Indicar adrenalina nebulizada de rutina cada hora y suspender la alimentación durante el cuadro"], "El tratamiento es de soporte; los broncodilatadores y corticoides de rutina no tienen beneficio claro y no se indican sin una prueba terapéutica justificada.", 3], ["Cálculo de dosis", "Fiebre de 38,6 °C. Se indica paracetamol a 15 mg/kg. El lactante pesa 5 kg.", "¿Cuántos mg corresponden?", ["75 mg", "150 mg", "15 mg", "750 mg"], "15 mg × 5 kg = 75 mg. La dosis pediátrica siempre se calcula por peso y se verifica la concentración de la presentación.", 2], ["Cálculo de dosis", "Se indican líquidos de mantención de 100 mL/kg/día para el lactante de 5 kg.", "¿A cuántos mL/h corresponde la infusión?", ["Cerca de 21 mL/h", "50 mL/h", "10 mL/h", "100 mL/h"], "100 mL × 5 kg = 500 mL al día; 500 ÷ 24 horas ≈ 21 mL/h.", 2], ["Procedimiento: alimentación por sonda", "Rechaza el pecho y se indica alimentación por sonda nasogástrica.", "¿Cómo procedes?", ["Confirmar la posición con aspirado y pH según protocolo, fraccionar la leche y administrar semisentado", "Confirmar solo auscultando el aire insuflado y administrar la leche en un solo volumen", "Administrar la leche con el lactante acostado plano para que se canse menos al alimentarse", "Iniciar con un bolo rápido a presión con jeringa para acortar el tiempo de la alimentación"], "La posición se confirma de forma objetiva y la alimentación se fracciona y se da semisentado para evitar la aspiración.", 1], ["Laboratorio", "Gasometría capilar: pH 7,25 · pCO₂ 62 mmHg · HCO₃ 24 mEq/L.", "¿Cómo la interpretas?", ["Acidosis respiratoria aguda por hipoventilación, con riesgo de fatiga respiratoria", "Acidosis metabólica por deshidratación, con compensación respiratoria adecuada", "Alcalosis respiratoria por hiperventilación ansiosa del lactante", "Valores normales para un lactante, que se repiten en 24 horas"], "pH bajo con pCO₂ alta y bicarbonato normal indica acidosis respiratoria aguda: el lactante retiene CO₂ y se está agotando.", 2], ["Complicación", "El lactante presenta pausas respiratorias de 15 segundos, Sat 80% e hipotonía.", "¿Qué haces?", ["Estimular, aspirar, ventilar con bolsa y mascarilla con O₂, avisar urgente y preparar soporte avanzado", "Aumentar el flujo de la cánula y observar unos minutos cómo evoluciona la saturación", "Dar un sedante para disminuir la agitación y que descanse mientras llega el médico", "Colocarlo boca abajo para facilitar la salida de las secreciones y vigilarlo a distancia"], "Las apneas con desaturación e hipotonía anuncian una falla respiratoria: se ventila de inmediato y se escala; sedar o esperar la agrava.", 3], ["Ética y derechos", "Los padres, por sus creencias, rechazan el ingreso a UCI y quieren llevarse al lactante.", "¿Qué corresponde?", ["Escuchar y explicar los riesgos, avisar al médico y al comité de ética para evaluar la situación, y registrar", "Aceptar la decisión de los padres y dar el alta de inmediato, para respetar su autonomía", "Impedir físicamente la salida de la familia con el lactante hasta que llegue la autoridad", "Convencer a los padres con insistencia y registrar que consintieron de forma voluntaria"], "Ante un riesgo vital en un menor, el equipo explica, escala al médico y al comité de ética y registra, sin coaccionar ni aceptar sin evaluar (Ley 20.584).", 1], ["IAAS", "El cultivo viral confirma virus respiratorio sincicial en el lactante.", "¿Qué precauciones aplicas?", ["Contacto y gotitas, higiene de manos y equipo exclusivo, con cohorte de pacientes con VRS", "Aislamiento aéreo con presión negativa y mascarilla N95 para todo el personal", "Solo precauciones estándar, porque el VRS no se transmite entre pacientes hospitalizados", "Aislamiento protector inverso para evitar que el lactante contagie a los demás"], "El VRS se transmite por gotitas y contacto: se aplican precauciones de contacto y gotitas, higiene de manos y cohorte.", 2], ["Registro en ficha", "Al final del turno debes dejar el registro.", "¿Qué registras?", ["Saturación y flujo de O₂ con horas, hallazgos, fármacos con dosis por peso, apneas y avisos, con firma", "Saturación y fármacos con dosis, sin las horas ni las apneas para no extender la nota", "Un resumen del cuadro respiratorio escrito de memoria al final del turno, con la evolución", "Solo los fármacos y los resultados de laboratorio, dejando los hallazgos para la nota médica"], "Los episodios de apnea, el flujo de oxígeno con su hora y las dosis por peso son parte del registro legal.", 1], ["Educación al alta", "Días después, el lactante se va de alta con sus padres.", "¿Qué educas con prioridad?", ["Signos de alarma respiratorios, lavado de manos, evitar el humo de tabaco, lactancia fraccionada y control", "Dar antibiótico y jarabes para la tos a libre demanda para acelerar la mejoría", "Mantenerlo muy abrigado en un ambiente cerrado y caliente para prevenir enfriamientos", "Retomar la sala cuna al día siguiente, porque el cuadro ya está superado"], "Reconocer los signos de alarma, evitar el humo y mantener la higiene previenen reingresos; los antibióticos y jarabes no están indicados.", 2]], "n": "Bronquiolitis: Programa IRA y GES IRA baja en menores de 5 años (MINSAL), criterios de hospitalización y de UCI pediátrica, kinesioterapia respiratoria, precauciones de contacto y gotitas (Programa de IAAS), Ley 20.584 y comité de ética, vacunación al día y registro.", "d": ["Bronquiolitis viral grave por VRS en un lactante pequeño, con hipoxemia, acidosis respiratoria y apneas como complicación.", "El manejo es de soporte con oxígeno titulado, desobstrucción nasal, hidratación y alimentación fraccionada; los fármacos de rutina no aportan, y las apneas obligan a ventilar y escalar de inmediato."]});

HD.push({"t": "Paciente en diálisis con hiperkalemia y fiebre", "l": "Urgencia · UCI · alta", "x": "Hombre de 64 años con enfermedad renal crónica en hemodiálisis por un catéter yugular. Faltó a su última sesión y llega con disnea, debilidad y fiebre.", "s": [["Triage", "PA 168/94 · FC 52 · FR 28 · Sat 90% · T 38,4 °C. Crépitos bilaterales y debilidad muscular.", "¿Qué categoría de triage asignas?", ["C2 · Emergencia: disnea con bradicardia y fiebre en un paciente renal de alto riesgo", "C3 · Urgencia: estable, con varios estudios y procedimientos por realizar", "C1 · Reanimación: requiere una intervención vital inmediata en este momento", "C4 · Urgencia menor: evaluación con un solo examen de laboratorio"], "La disnea con bradicardia y fiebre en un paciente en diálisis es una situación de alto riesgo (C2).", 2], ["Evaluación inicial", "El potasio capilar es 7,3 mEq/L.", "¿Qué haces de inmediato?", ["Monitorizar el ECG, avisar y preparar calcio EV, mientras canalizas una vía periférica", "Repetir el potasio en una hora y mantener el reposo, esperando el resultado del laboratorio", "Dar una dieta baja en potasio y furosemida oral para que elimine el exceso con la orina", "Administrar bicarbonato EV en bolo antes de contar con un ECG de referencia"], "Con hiperkalemia grave se monitoriza, se avisa y se prepara el calcio; esperar o dar medidas lentas deja al paciente en riesgo de arritmia.", 2], ["Sospecha clínica", "ECG con ondas T altas, QRS ancho y bradicardia. Crépitos bilaterales, edema de las extremidades y fiebre. El catéter tiene eritema en el sitio de salida.", "¿Cuáles son tus sospechas principales?", ["Hiperkalemia grave y sobrecarga de volumen, con posible infección del catéter de diálisis", "Hipokalemia con arritmia ventricular y deshidratación por un episodio de vómitos", "Infarto agudo de miocardio con shock cardiogénico por obstrucción coronaria", "Neumonía por aspiración con edema pulmonar no cardiogénico asociado"], "Ondas T altas con QRS ancho tras faltar a la diálisis indican hiperkalemia; los crépitos y el edema, sobrecarga; el eritema del catéter con fiebre, infección.", 3], ["Fármacos", "Se indica gluconato de calcio EV.", "¿Cómo lo administras?", ["Lento, en 5 a 10 minutos con monitor continuo, vigilando el sitio y repitiendo según el ECG", "En bolo rápido de 30 segundos, porque el potasio alto es una emergencia inmediata", "Mezclado con bicarbonato en la misma línea, para ahorrar tiempo y evitar otra punción", "Por vía subcutánea, porque el catéter de diálisis no se puede usar para medicamentos"], "El calcio se pasa lento con monitor; el bolo rápido puede causar bradicardia y paro, y precipita con el bicarbonato.", 2], ["Cálculo de dosis", "Se indican 10 UI de insulina cristalina con 50 mL de dextrosa al 50%.", "¿Cuántos gramos de glucosa se administran?", ["25 g", "50 g", "5 g", "2,5 g"], "50% equivale a 50 g por 100 mL; en 50 mL hay 25 g.", 2], ["Decisión", "Disnea, crépitos, Sat 90% y anuria. Se coordina la diálisis urgente.", "¿Qué haces mientras tanto?", ["Sentarlo, dar O₂ titulado, restringir líquidos y avisar para diálisis urgente", "Dar furosemida oral en dosis alta y esperar la diuresis antes de dializarlo", "Reponer volumen con suero fisiológico por la fiebre y la taquipnea antes de otras medidas", "Acostarlo plano para que descanse y dar un sedante para disminuir la ansiedad"], "En un paciente anúrico la sobrecarga y el potasio solo se corrigen con diálisis; el volumen, el decúbito o los sedantes lo agravan.", 3], ["Procedimiento: hemocultivos", "Se indica tomar hemocultivos antes del antibiótico.", "¿Cómo los tomas?", ["Un set periférico y otro del catéter, antes del antibiótico y con técnica estéril", "Solo del catéter de diálisis, por ser el foco probable, tras la primera dosis de antibiótico", "Dos sets del mismo catéter con minutos de diferencia, para comparar los resultados", "Esperar a que baje la fiebre para tomarlos, y evitar falsos positivos"], "Se toman un set periférico y otro del catéter antes del antibiótico; así se compara el tiempo de positividad sin retrasar el tratamiento.", 2], ["Fármacos", "El médico indica vancomicina.", "¿Qué verificas antes de administrarla?", ["La dosis ajustada a la función renal y a la diálisis, y la infusión lenta por el riesgo de reacción", "Que se administre en bolo rápido, para alcanzar niveles altos y controlar la infección", "Que se dé la dosis habitual de un paciente con función renal normal, por no depender del riñón", "Que se mezcle con el calcio en la misma línea, para disminuir el número de vías"], "La vancomicina se ajusta a la función renal y se infunde lento; el bolo rápido causa el síndrome del hombre rojo.", 2], ["Laboratorio", "Gasometría: pH 7,20 · pCO₂ 28 mmHg · HCO₃ 11 mEq/L.", "¿Cómo la interpretas?", ["Acidosis metabólica por insuficiencia renal, con compensación respiratoria", "Acidosis respiratoria por edema pulmonar, sin compensación metabólica", "Alcalosis metabólica por uso de diuréticos, con hipokalemia asociada", "Gasometría normal para un paciente renal crónico, que no requiere intervención"], "pH y bicarbonato bajos con pCO₂ baja indican acidosis metabólica con compensación respiratoria, típica de la falla renal.", 2], ["Complicación", "Mientras se prepara la diálisis, pierde la conciencia. El monitor muestra actividad eléctrica lenta y no hay pulso.", "¿Qué haces?", ["Inicio RCP, aviso, doy calcio y adrenalina según indicación y trato la hiperkalemia como causa reversible", "Desfibrilo de inmediato, porque hay actividad eléctrica y el potasio alto produce fibrilación", "Administro atropina sola y espero el cambio de la frecuencia antes de comprimir", "Doy un bolo de 1 L de suero para subir la presión y reevalúo el pulso en 5 minutos"], "Es una actividad eléctrica sin pulso: se comprime, se da adrenalina y se trata la causa reversible (hiperkalemia) con calcio; no se desfibrila.", 3], ["Ética y derechos", "Ya recuperado, el paciente dice que está agotado y quiere dejar la diálisis.", "¿Qué corresponde?", ["Explorar su decisión, informar las consecuencias y avisar al equipo, ofreciendo apoyo y registrando", "Convencerlo con insistencia de continuar, porque dejar la diálisis no es una decisión que pueda tomar", "Aceptar su decisión y suspender la diálisis de inmediato sin informar al médico", "Pedir a su familia que decida por él, porque su estado de ánimo no es confiable"], "El paciente informado tiene derecho a decidir sobre su tratamiento: se explora, se informa, se involucra al equipo y se registra (Ley 20.584).", 1], ["IAAS", "El catéter de diálisis tiene un cultivo positivo.", "¿Qué medidas aplicas con el catéter?", ["Higiene de manos, técnica aséptica con clorhexidina, apósito limpio y registro de los cuidados", "Abrir las conexiones cada turno para limpiarlas con agua y jabón y reconectarlas", "Usar el catéter para infundir medicamentos de rutina cuando no haya otra vía disponible", "Aplicar pomada antibiótica en las conexiones con cada sesión, sin otras medidas"], "El catéter de diálisis se manipula solo con técnica aséptica y por personal entrenado; abrirlo o usarlo para otros fines aumenta la infección.", 2], ["Registro en ficha", "Al final del turno debes dejar el registro.", "¿Qué registras?", ["Potasio, ECG, horas de fármacos con dosis, el paro y su manejo, y los avisos, con firma", "Potasio y fármacos con dosis, sin las horas ni el detalle del paro, para no extender la nota", "Un resumen del cuadro y de la diálisis, escrito de memoria al finalizar el turno", "Solo la hora de la diálisis y los resultados, dejando el paro para el equipo médico"], "Las horas, las dosis, el paro y su manejo, y las comunicaciones deben quedar en la ficha.", 1], ["Educación al alta", "Semanas después, el paciente se va de alta con un plan de diálisis.", "¿Qué educas con prioridad?", ["Asistir a todas las sesiones, controlar líquidos y potasio, cuidar el catéter y consultar por fiebre o disnea", "Saltarse una sesión si se siente bien, porque la diálisis solo se necesita con síntomas", "Aumentar los líquidos y las frutas para mantenerse hidratado y nutrido entre las sesiones", "Mojar el catéter en la ducha para mantener la higiene y cambiar el apósito cuando quiera"], "La adherencia a las sesiones, el control de líquidos y potasio y el cuidado del catéter previenen nuevas descompensaciones.", 2]], "n": "Enfermedad renal crónica en diálisis: GES insuficiencia renal crónica terminal (MINSAL), coordinación con el centro de diálisis, protocolo de hiperkalemia, RCP con causas reversibles (guías AHA), Programa de IAAS (infecciones asociadas a catéter), Ley 20.584 (decisiones sobre el tratamiento) y registro en ficha.", "d": ["Hiperkalemia grave con sobrecarga de volumen en un paciente en diálisis, con infección del catéter y un paro por actividad eléctrica sin pulso como complicación.", "El calcio protege el miocardio, la diálisis elimina el potasio y el volumen, el antibiótico se ajusta a la función renal y la hiperkalemia se trata como causa reversible del paro."]});

HD.push({"t": "Cirrótico con hemorragia variceal", "l": "Urgencia · UCI · alta", "x": "Hombre de 55 años con cirrosis alcohólica llega con vómitos de sangre roja abundante y somnolencia. Su pareja dice que bebió alcohol hasta ayer.", "s": [["Triage", "PA 88/54 · FC 124 · FR 24 · Sat 94% · Glasgow 13. Ascitis y telangiectasias.", "¿Qué categoría de triage asignas?", ["C1 · Reanimación: shock hemorrágico con alteración de conciencia", "C2 · Emergencia: hemorragia digestiva con vía aérea protegida y estable", "C3 · Urgencia: estable, con varios recursos esperados, como endoscopía y laboratorio", "C4 · Urgencia menor: evaluación con un solo recurso, como un examen de sangre"], "El shock con alteración de conciencia exige intervenciones inmediatas que salvan la vida (C1).", 2], ["Evaluación inicial", "Continúa vomitando sangre roja.", "¿Cuál es tu prioridad?", ["Proteger la vía aérea en posición lateral, dar O₂, canalizar dos vías gruesas y avisar para endoscopía", "Instalar sonda nasogástrica con lavados de agua helada hasta aclarar el contenido gástrico", "Reponer 3 litros de suero fisiológico rápido hasta normalizar la PA antes de otras medidas", "Dar un antiácido oral y observar la evolución mientras se coordina una endoscopía programada"], "La vía aérea y el acceso venoso son lo primero; el exceso de volumen eleva la presión portal y los lavados fríos no detienen el sangrado.", 2], ["Sospecha clínica", "Vómitos rojos abundantes, ascitis y esplenomegalia. Sin dolor epigástrico previo ni uso de AINE.", "¿Cuál es tu sospecha clínica principal?", ["Hemorragia por várices esofágicas secundaria a hipertensión portal", "Úlcera péptica sangrante por consumo de AINE y Helicobacter pylori", "Síndrome de Mallory-Weiss por vómitos repetidos tras la ingesta de alcohol", "Gastritis erosiva aguda por alcohol con sangrado difuso de la mucosa"], "En un cirrótico con ascitis y esplenomegalia, la hematemesis masiva sin dolor previo orienta a várices esofágicas por hipertensión portal.", 3], ["Fármacos", "Se indica terlipresina EV.", "¿Qué vigilas?", ["Dolor abdominal, isquemia de extremidades, PA, FC y sodio, por riesgo de isquemia e hiponatremia", "Glicemia cada 2 horas, por el riesgo de hipoglucemia grave con el fármaco", "Frecuencia respiratoria y saturación, porque deprime el centro respiratorio como los opioides", "Solo la diuresis horaria, porque su efecto principal es sobre el riñón y la sal"], "La terlipresina es un vasoconstrictor: se vigilan isquemia periférica o intestinal, la PA y el sodio.", 2], ["Decisión: transfusión", "Hb 7,2 g/dL, INR 1,9 y plaquetas 70.000.", "¿Cómo conduces la transfusión?", ["Con meta restrictiva de Hb en torno a 7-8 g/dL, evitando la sobrecarga que eleva la presión portal", "Hasta Hb 12 g/dL, para asegurar un margen amplio frente a un nuevo sangrado", "Con plasma fresco en grandes volúmenes para normalizar el INR antes de la endoscopía", "Posponer la transfusión hasta después de la endoscopía, para localizar primero el sitio"], "La estrategia restrictiva reduce el resangrado y la mortalidad; transfundir de más aumenta la presión portal.", 3], ["Cálculo de dosis", "Un concentrado de glóbulos rojos de 300 mL debe pasar en 3 horas.", "¿A cuántos mL/h se infunde?", ["100 mL/h", "300 mL/h", "50 mL/h", "150 mL/h"], "300 mL ÷ 3 horas = 100 mL/h.", 2], ["Procedimiento: preparación", "Se prepara el traslado a la endoscopía urgente.", "¿Qué haces antes de la sedación?", ["Asegurar la vía aérea según indicación, aspirar secreciones, mantener ayuno y confirmar el consentimiento", "Dar una colación ligera para evitar la hipoglucemia durante la sedación del procedimiento", "Retirar la vía venosa para que no interfiera con el endoscopio durante el examen", "Dar un sedante de forma anticipada en la sala para que llegue tranquilo al procedimiento"], "Antes de la endoscopía se protege la vía aérea, se mantiene el ayuno y se confirma el consentimiento; los sedantes se dan solo bajo supervisión.", 1], ["Laboratorio", "Amonio alto, bilirrubina 5 mg/dL, albúmina 2,3 g/dL, INR 1,9. Glasgow 11 y temblor aleteante.", "¿Cómo lo interpretas?", ["Encefalopatía hepática desencadenada por el sangrado, con insuficiencia hepática avanzada", "Intoxicación aguda por alcohol sin relación con el hígado, que cede con hidratación", "Hipoglucemia aislada por ayuno prolongado, que se corrige con glucosa EV", "Encefalopatía urémica por falla renal aguda, sin compromiso hepático asociado"], "El sangrado digestivo aporta proteínas y amonio: en un hígado insuficiente desencadena encefalopatía; el temblor aleteante la confirma.", 2], ["Fármacos", "Se indica lactulosa por la encefalopatía.", "¿Cómo la administras y cuál es la meta?", ["Por vía oral o sonda según indicación, con meta de 2-3 deposiciones blandas al día y control de electrolitos", "Solo por vía EV en bolo, hasta que cese la somnolencia y el temblor de las manos", "En dosis alta hasta lograr diarrea líquida abundante, para acelerar la eliminación del amoníaco", "Suspenderla durante el sangrado, porque la sangre digestiva no influye en el amoníaco"], "La lactulosa se da por vía oral o sonda con meta de 2-3 deposiciones; la diarrea profusa deshidrata y altera los electrolitos.", 2], ["Complicación", "Resangrado con hematemesis, PA 70/40 y Glasgow 9.", "¿Qué haces?", ["Protejo la vía aérea, aviso de inmediato para intubación y endoscopía urgente, y sostengo la reposición", "Doy lactulosa oral y observo, porque la somnolencia mejora con la limpieza intestinal", "Administro una benzodiacepina para controlar la agitación y que descanse", "Hago lavados gástricos con agua fría y espero a que cese el sangrado por sí solo"], "El resangrado con alteración de conciencia exige proteger la vía aérea, reponer y repetir la endoscopía; los sedantes y la espera empeoran el cuadro.", 3], ["Ética y confidencialidad", "La pareja pide que no se informe a la familia que el paciente tiene cirrosis por alcohol.", "¿Qué corresponde?", ["Respetar la confidencialidad: informar solo a quienes autorice el paciente y derivar las consultas al médico", "Informar a toda la familia, porque la enfermedad por alcohol afecta a todos sus miembros", "Entregar la ficha completa a la pareja, ya que cuida al paciente y conoce su historia", "Informar a los hijos por teléfono sin verificar su identidad, para tranquilizarlos"], "La información clínica es reservada y se entrega según la voluntad del paciente o su representante (Ley 20.584).", 1], ["IAAS y seguridad", "El paciente sangra y tiene riesgo de contacto con fluidos corporales.", "¿Qué precauciones aplicas?", ["Precauciones estándar con guantes, delantal y protección ocular, y eliminación segura de corto-punzantes", "Aislamiento aéreo con N95, porque el paciente tiene una hepatopatía crónica con sangrado", "Solo guantes limpios, ya que el riesgo es bajo si no hay lesiones en la piel del personal", "Aislamiento protector inverso, para evitar infecciones en un paciente inmunosuprimido"], "Ante sangre y fluidos se aplican las precauciones estándar con barreras adecuadas y manejo seguro de los corto-punzantes.", 2], ["Registro en ficha", "Al final del turno debes dejar el registro.", "¿Qué registras?", ["Hora de la hematemesis, volumen estimado, fármacos con dosis, transfusiones, resangrado y avisos, con firma", "Volumen estimado y fármacos con dosis, sin las horas ni el resangrado, para no extender la nota", "Un resumen del cuadro y el diagnóstico, escrito de memoria al finalizar el turno de noche", "Solo la hora de la endoscopía y los resultados, dejando el manejo previo para el médico"], "El registro es objetivo y completo: horas, volúmenes, dosis, transfusiones, el resangrado y las comunicaciones.", 1], ["Educación al alta", "Semanas después, el paciente se va de alta.", "¿Qué educas con prioridad?", ["Abstinencia de alcohol, adherencia a fármacos y controles, dieta baja en sal, y consultar por sangrado o confusión", "Reducir el alcohol a una copa diaria, porque la abstinencia total no es necesaria", "Usar antiinflamatorios libremente para el dolor, ya que no dañan el hígado", "Esperar a que aumente el abdomen para consultar, porque es normal en la cirrosis"], "La abstinencia, los controles y la consulta precoz previenen nuevos sangrados y descompensaciones; los AINE se evitan.", 2]], "n": "Cirrosis con hemorragia variceal: protocolo local de hemorragia digestiva alta, endoscopía precoz, profilaxis antibiótica, medicina transfusional con meta restrictiva, precauciones estándar (Programa de IAAS), Ley 20.584 (confidencialidad), derivación a hepatología y apoyo por consumo problemático de alcohol.", "d": ["Hemorragia por várices esofágicas en un paciente con hipertensión portal, con encefalopatía hepática y un resangrado como complicación.", "El vasoconstrictor y la endoscopía controlan el sangrado, la transfusión es restrictiva, la lactulosa trata la encefalopatía y la abstinencia previene nuevos eventos."]});

HD.push({"t": "Turno completo en medicina: de la entrega a la entrega", "l": "Turno de día · 4 pacientes", "tag": "🕐 Turno completo", "x": "Turno de día (08:00 a 20:00) en una sala de medicina, con 4 pacientes a tu cargo: cama 1, Sr. Pérez (72 años, neumonía con O₂); cama 2, Sra. Soto (80 años, infección urinaria con sonda, alergia a penicilina); cama 3, Sr. Díaz (58 años, diabetes tipo 2); cama 4, Sra. Rojas (65 años, insuficiencia cardiaca con furosemida).", "s": [["Entrega de turno (recepción)", "El equipo saliente se dispone a entregarte el reporte de los 4 pacientes.", "¿Cómo debe hacerse una entrega de turno segura?", ["En formato estructurado (ISBAR), junto a la cama cuando es posible, permitiendo preguntas", "Con un resumen verbal rápido en la estación, priorizando solo a los pacientes graves", "Con notas personales en una hoja suelta que cada profesional guarda para su uso", "Entregando solo la lista de indicaciones, sin los antecedentes ni la evolución del turno"], "ISBAR (identificación, situación, antecedentes, evaluación y recomendaciones) ordena la información, reduce omisiones y permite confirmar lo entendido.", 1], ["Priorización", "Reporte: cama 1 con Sat 91% con O₂ 3 L/min y T 38,2 °C; cama 2 estable, con una caída ayer sin lesión; cama 3 con glicemia 190 en ayunas; cama 4 con disnea leve y edema.", "¿A quién evalúas primero?", ["Cama 1: saturación límite con fiebre en un paciente con neumonía", "Cama 4: disnea leve y edema en una paciente conocida con insuficiencia cardiaca", "Cama 3: glicemia de 190 en ayunas en un paciente con diabetes estable", "Cama 2: caída sin lesión del día anterior, aunque hoy esté estable"], "La hipoxemia límite con fiebre y neumonía puede deteriorarse rápido; las demás situaciones son menos urgentes en este momento.", 3], ["Evaluación", "Cama 1: Sat 88% con O₂ 3 L/min, FR 30, T 38,6 °C y esputo purulento.", "¿Qué haces?", ["Aumentar el O₂ según indicación, sentarlo, avisar al médico y preparar una gasometría", "Disminuir el oxígeno para no depender de él y repetir la saturación en una hora", "Dar paracetamol y esperar a que baje la fiebre antes de avisar al médico", "Acostarlo plano para que descanse y dejarlo con el oxímetro hasta la próxima ronda"], "Hay empeoramiento respiratorio: se mejora la oxigenación, se sienta al paciente y se avisa de inmediato.", 3], ["Fármacos", "Ronda de las 12:00. La cama 2 tiene indicada ceftriaxona y una alergia a penicilina registrada.", "¿Qué haces?", ["Verificar con el médico y la farmacia la alergia antes de administrar, y vigilar si se confirma que es seguro", "Administrar sin consultar, porque la ceftriaxona es otro antibiótico y no produce alergia cruzada", "Omitir el antibiótico y avisar solo en el reporte de la tarde, para no retrasar otras tareas", "Cambiar por un antibiótico similar sin avisar para evitar el riesgo de una reacción alérgica"], "Se evalúa el riesgo con el equipo antes de administrar; omitir o cambiar el fármaco sin avisar no es seguro.", 2], ["Cálculo de dosis", "Cama 3: según la escala, corresponden 6 UI de insulina cristalina. La insulina es de 100 UI/mL.", "¿Cuántos mL se cargan?", ["0,06 mL", "0,6 mL", "0,006 mL", "6 mL"], "6 UI ÷ 100 UI/mL = 0,06 mL; por eso se usa jeringa de insulina graduada en unidades.", 2], ["Cálculo de goteo", "Cama 4: se indican 500 mL de suero fisiológico en 4 horas con macrogoteo de 20 gotas/mL.", "¿A cuántas gotas por minuto se programa?", ["42 gotas/min", "21 gotas/min", "83 gotas/min", "125 gotas/min"], "500 mL × 20 gotas ÷ (4 h × 60 min) = 41,7, es decir unas 42 gotas por minuto.", 2], ["Laboratorio", "Cama 4: potasio de 3,0 mEq/L en una paciente con furosemida.", "¿Qué haces?", ["Aviso al médico para reponer el potasio según indicación y controlar el ritmo", "Suspendo la furosemida por mi cuenta y repito el examen mañana por la mañana", "Doy potasio en bolo rápido por vía EV para corregirlo de inmediato y evitar arritmias", "No hago nada, porque 3,0 es un valor aceptable en la insuficiencia cardiaca"], "La hipokalemia aumenta el riesgo de arritmias: se avisa y se repone con indicación, sin bolo rápido ni suspender fármacos por cuenta propia.", 2], ["Prevención de infecciones", "Cama 2: lleva 7 días con sonda Foley por la infección urinaria.", "¿Qué corresponde?", ["Evaluar con el médico si sigue indicada y, si no, retirarla pronto para prevenir infecciones", "Mantenerla hasta el alta por comodidad y para medir mejor la diuresis", "Cambiarla cada 24 horas por rutina para evitar costras y nuevas infecciones", "Desconectar la bolsa para movilizar a la paciente y reconectarla sin desinfectar"], "La sonda debe tener indicación vigente y retirarse apenas no se necesite; abrir el circuito aumenta el riesgo de infección.", 2], ["Complicación", "Cama 2: la paciente, confusa, se levanta sola, cae y refiere dolor de cadera.", "¿Qué haces?", ["No la muevo, evalúo cabeza, cuello y cadera, aviso y luego notifico el evento adverso", "La levanto entre dos personas y la devuelvo a la cama para evaluar el dolor", "Le pido que camine unos pasos para comprobar si puede apoyar la pierna", "Registro la caída solo si la radiografía posterior confirma una fractura"], "Se evalúa antes de movilizar por riesgo de fractura o lesión cervical y se notifica el evento adverso.", 3], ["Ética y derechos", "La hija de la cama 4 pide que no se informe a su madre del mal pronóstico.", "¿Qué corresponde?", ["Informar a la paciente según su derecho, con apoyo, y derivar el caso al médico", "Aceptar el pedido y ocultar la información hasta que la hija lo autorice formalmente", "Informar solo a la hija, que es quien más se preocupa por la paciente", "Dejar la información escrita en la ficha para que la paciente la lea sola"], "La paciente tiene derecho a ser informada de su estado de salud, de forma comprensible y respetuosa (Ley 20.584).", 1], ["IAAS", "Cama 1: neumonía con tos productiva y esputo purulento.", "¿Qué precauciones aplicas?", ["Precauciones estándar, y de gotitas si hay sospecha de un agente transmisible, con higiene de manos", "Aislamiento aéreo en pieza con presión negativa para toda neumonía con tos", "Ninguna precaución adicional, porque la neumonía de la comunidad no se transmite", "Solo mascarilla para el paciente cuando salga de la pieza, sin otras medidas"], "Se aplican las precauciones estándar y las adicionales según el agente sospechado; no toda neumonía requiere aislamiento aéreo.", 2], ["Registro en ficha", "Se acerca el final del turno y debes dejar tus registros.", "¿Cómo registras?", ["Con hora, hallazgos, intervenciones, fármacos, avisos y la caída, de forma objetiva y con firma", "Dejando todo para el final del turno, escrito de memoria en un resumen general", "Registrando solo los eventos graves y omitiendo las rondas habituales para no extender la ficha", "Anotando los hallazgos en una hoja aparte para el equipo, sin dejarlos en la ficha"], "El registro es oportuno, objetivo y completo; las hojas aparte no forman parte del documento legal.", 1], ["Entrega de turno (salida)", "Es hora de entregar los pacientes al equipo de noche.", "¿Cuál es la entrega más segura de la cama 2?", ["Paciente de 80 años con infección urinaria y sonda; cayó hoy sin fractura confirmada; alergia a penicilina; pendiente la decisión de la sonda; vigilar caídas y confusión", "Sra. Soto, cama 2, sigue con su infección; sin novedades relevantes durante el día", "Paciente estable con antibiótico; el resto está en la ficha para que lo revisen ustedes", "Paciente con riesgo de caídas; se le dio la ceftriaxona sin problemas y está tranquila ahora"], "Una entrega segura incluye identificación, situación actual, antecedentes relevantes (alergia, caída), pendientes y recomendaciones.", 3], ["Pendientes", "Antes de irte, debes dejar claros los pendientes del turno.", "¿Qué haces?", ["Comunicar los pendientes con responsables y horarios: potasio de control, decisión de la sonda, gasometría de la cama 1 y evaluación tras la caída", "Dejarlos a cargo de cualquiera que los vea en la ficha, sin nombrar a nadie", "No mencionarlos para no retrasar la salida, porque el equipo nocturno los verá", "Resolverlos después de la hora de salida, a título personal"], "Los pendientes se entregan con quién, qué y cuándo; así se evita que se pierdan entre turnos.", 2]], "n": "Gestión del turno y seguridad del paciente: entrega estructurada (ISBAR) como práctica de estándares de acreditación (Superintendencia de Salud), priorización por riesgo, prevención de infecciones asociadas a catéteres (Programa de IAAS), notificación de eventos adversos, Ley 20.584 (información y registro) y verificación de medicamentos de alto riesgo.", "d": ["Un turno completo integra la recepción del reporte, la priorización, la ronda de medicamentos con cálculos, las complicaciones, la ética, el registro y la entrega de turno.", "Cada etapa depende de la comunicación: una entrega estructurada y clara previene omisiones, errores de medicación y eventos adversos."]});

var ANAT=[["Focos de auscultación cardiaca", "Aórtico: 2º espacio intercostal derecho, borde esternal. Pulmonar: 2º espacio intercostal izquierdo, borde esternal. Tricuspídeo: 4º espacio intercostal izquierdo, borde esternal. Mitral (ápex): 5º espacio intercostal izquierdo, línea medioclavicular. Punto de Erb: 3º espacio intercostal izquierdo."], ["Auscultación pulmonar", "Se compara lado a lado, de arriba abajo, en las caras anterior, posterior y lateral, con el paciente sentado. Normal: murmullo vesicular. Anormales: sibilancias, crépitos, roncus, ausencia de murmullo o silencio. Las bases se evalúan en la cara posterior."], ["Cuadrantes y regiones del abdomen", "Hipocondrio y fosa ilíaca, derechos e izquierdos. Hígado y vesícula: hipocondrio derecho. Estómago y bazo: hipocondrio izquierdo. Apéndice: fosa ilíaca derecha (McBurney, entre el tercio externo y medio de la línea que une la espina ilíaca con el ombligo). Murphy: dolor bajo el reborde costal derecho que interrumpe la inspiración."], ["Pulsos periféricos", "Carotídeo (junto a la tráquea; nunca ambos a la vez), braquial (cara interna del brazo), radial (cara lateral de la muñeca), femoral (ingle), poplíteo (fosa poplítea), pedio (dorso del pie) y tibial posterior (detrás del maléolo interno). Se evalúan frecuencia, ritmo y amplitud."], ["Sitios de inyección intramuscular", "Ventroglúteo (preferido, lejos del nervio ciático), vasto lateral del muslo (tercio medio de la cara anterolateral) y deltoides (hasta 1-2 mL, a 2-3 traveses de dedo bajo el acromion). El glúteo dorsal exige ubicar bien el cuadrante por el riesgo del nervio ciático."], ["Derivaciones del ECG", "V1: 4º espacio intercostal, borde derecho del esternón. V2: 4º espacio intercostal, borde izquierdo. V3: entre V2 y V4. V4: 5º espacio intercostal, línea medioclavicular. V5: 5º espacio, línea axilar anterior. V6: 5º espacio, línea axilar media."], ["Examen neurológico básico", "Glasgow (ocular 1-4, verbal 1-5, motora 1-6). Pupilas: tamaño, simetría y reacción a la luz. Fuerza muscular: 0 (sin contracción) a 5 (normal). Pares craneales: sonrisa simétrica, movimientos oculares y lengua en la línea media. Signos meníngeos: rigidez de nuca."], ["Accesos vasculares", "Venas del pliegue del codo (mediana cubital, cefálica y basílica) y del antebrazo y dorso de la mano para catéteres periféricos. Se evita el brazo con fístula, mastectomía o lesión. La arteria radial se punciona tras el test de Allen modificado. Los accesos centrales los realiza personal entrenado."]],AQ=[["¿Dónde se ubica el foco mitral?", ["5º espacio intercostal izquierdo, línea medioclavicular", "2º espacio intercostal derecho, borde esternal", "4º espacio intercostal izquierdo, borde esternal", "2º espacio intercostal izquierdo, borde esternal"], "El foco mitral corresponde al ápex cardiaco."], ["¿Dónde se ubica el foco aórtico?", ["2º espacio intercostal derecho, borde esternal", "2º espacio intercostal izquierdo, borde esternal", "5º espacio intercostal izquierdo, línea axilar", "4º espacio intercostal derecho, borde esternal"], "El foco aórtico está a la derecha del esternón, en el segundo espacio."], ["¿Dónde se coloca V1 en el ECG?", ["4º espacio intercostal, borde derecho del esternón", "4º espacio intercostal, borde izquierdo del esternón", "5º espacio intercostal, línea medioclavicular", "2º espacio intercostal, borde derecho del esternón"], "V1 va en el cuarto espacio, a la derecha del esternón; V2 a la izquierda."], ["¿Dónde se ubica el punto de McBurney?", ["Fosa ilíaca derecha, entre el tercio externo y medio de la línea espinoumbilical", "Hipocondrio derecho, bajo el reborde costal, en la línea medioclavicular", "Fosa ilíaca izquierda, sobre el tercio medio del ligamento inguinal", "Mesogastrio, a dos traveses de dedo sobre el ombligo en la línea media"], "El punto de McBurney orienta a apendicitis."], ["¿Qué define el signo de Murphy?", ["Dolor bajo el reborde costal derecho que interrumpe la inspiración al palpar", "Dolor en la fosa ilíaca derecha al descomprimir bruscamente la mano", "Dolor en el flanco que se irradia a la ingle al percutir el ángulo costovertebral", "Dolor epigástrico que mejora al inclinarse hacia adelante, sentado"], "El signo de Murphy orienta a colecistitis."], ["¿Cuál es el sitio de inyección intramuscular preferido en adultos?", ["Ventroglúteo, lejos del nervio ciático y de los grandes vasos", "Glúteo dorsal en el cuadrante superoexterno, por su mayor masa muscular", "Deltoides con un volumen de 5 mL, por ser de fácil acceso", "Cara posterior del muslo, por su gran irrigación muscular"], "El ventroglúteo evita el nervio ciático."], ["¿Dónde se palpa el pulso pedio?", ["Dorso del pie, lateral al tendón del extensor del dedo gordo", "Detrás del maléolo interno del tobillo", "En la fosa poplítea, con la rodilla flexionada", "En la ingle, bajo el ligamento inguinal"], "El pulso pedio se palpa en el dorso del pie."], ["¿Dónde se palpa el pulso tibial posterior?", ["Detrás del maléolo interno del tobillo", "Dorso del pie, lateral al tendón extensor del dedo gordo", "Cara lateral de la muñeca, sobre el radio", "En el cuello, junto a la tráquea"], "El tibial posterior se palpa detrás del maléolo interno."], ["¿Por qué no se palpan ambas carótidas a la vez?", ["Puede disminuir el flujo cerebral y provocar bradicardia o síncope", "Porque el pulso de ambos lados se mezcla y no se distingue su amplitud", "Porque la carótida derecha solo se palpa con la mano derecha del examinador", "Porque la presión sobre ambas eleva la frecuencia cardiaca de forma peligrosa"], "La presión simultánea reduce el flujo cerebral y puede causar síncope."], ["¿Cómo se compara la auscultación pulmonar?", ["Lado a lado, de arriba abajo, en las caras anterior, posterior y lateral", "Solo en la cara anterior, de abajo hacia arriba, comparando con el corazón", "Solo un hemitórax, porque el otro tendrá el mismo ruido pulmonar", "Primero los lados y al final el centro, sin comparar sus ruidos"], "La comparación simétrica permite detectar asimetrías."], ["¿Qué significa un Glasgow de 8 o menos?", ["Compromiso grave de conciencia con riesgo para la vía aérea", "Alteración leve de conciencia que solo requiere observación", "Estado de alerta normal con respuesta verbal confusa", "Coma superficial que no compromete la vía aérea"], "Con 8 o menos hay que proteger la vía aérea."], ["¿Cómo se evalúa la fuerza muscular?", ["Escala de 0 (sin contracción) a 5 (fuerza normal), comparando ambos lados", "Escala de 1 a 10 según el dolor que refiere el paciente al moverse", "Solo observando si el paciente puede caminar sin ayuda", "Escala de 0 a 3 según la rapidez con que responde a las órdenes"], "La fuerza se gradúa de 0 a 5 y se compara con el lado contrario."], ["Un TEC con una pupila dilatada y arreactiva de un solo lado sugiere:", ["Posible hipertensión intracraneal con herniación: avisar de inmediato", "Efecto habitual de la luz de la sala: reevaluar al día siguiente", "Respuesta normal en pacientes con dolor y estrés intenso", "Efecto de la analgesia que no requiere aviso ni nuevos controles"], "Es un signo de gravedad que requiere aviso inmediato."], ["¿Qué extremidad se evita puncionar en un paciente con fístula arteriovenosa?", ["La del brazo con la fístula", "La del brazo sin fístula", "Ambos brazos por igual", "Solo la pierna del lado opuesto"], "El brazo de la fístula se protege."], ["¿Qué se verifica antes de puncionar la arteria radial?", ["La circulación colateral con el test de Allen modificado", "La presión del brazo contrario con un manguito inflado", "La temperatura de la mano con un termómetro cutáneo", "La frecuencia respiratoria en reposo durante un minuto"], "El test de Allen comprueba la perfusión colateral de la mano."], ["¿Dónde se ubican el hígado y la vesícula?", ["Hipocondrio derecho", "Hipocondrio izquierdo", "Fosa ilíaca derecha", "Fosa ilíaca izquierda"], "El hígado y la vesícula están en el hipocondrio derecho."]];
