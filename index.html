<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Enfermería Chile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7285">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sim Enfermería">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f9;--card:#fff;--tx:#14232e;--mu:#5b6b77;--ac:#0b7285;--ok:#2b8a3e;--ko:#c92a2a;--wa:#e67700;--bd:#d5dde3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#18232a;--tx:#e8eef2;--mu:#9aaab5;--ac:#3bc9db;--ok:#69db7c;--ko:#ff8787;--wa:#ffa94d;--bd:#2c3b45}}
:root[data-theme="dark"]{--bg:#10181d;--card:#18232a;--tx:#e8eef2;--mu:#9aaab5;--ac:#3bc9db;--ok:#69db7c;--ko:#ff8787;--wa:#ffa94d;--bd:#2c3b45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:1.2rem;margin:4px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:.85rem}
.v{background:var(--bg);border-radius:8px;padding:8px;font-size:.85rem;color:var(--ac);font-weight:600;margin-top:8px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin:5px 0;width:100%;text-align:left;cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:600}
.s2{border-color:var(--ok)!important}.s1{border-color:var(--wa)!important}.s0{border-color:var(--ko)!important}
.fb{margin-top:8px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;font-size:.92rem}
.tag{display:inline-block;font-size:.72rem;background:var(--ac);color:#fff;border-radius:6px;padding:2px 7px;margin-right:6px}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tb{width:auto;flex:1;text-align:center;margin:0;padding:8px 4px;font-size:.85rem}
.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input#q{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.it{padding:8px 10px;margin:4px 0}.it .mu{font-size:.78rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g2 button{margin:0;padding:8px;font-size:.85rem}
main>div.mu:first-child{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs{display:none}
main{padding-bottom:84px}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
#nv button{flex:1;margin:0 2px;padding:9px 1px;text-align:center;font-size:.68rem}
#nv button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
body{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--ac) 7%,var(--bg)) 100%) fixed}
h1{letter-spacing:-.01em}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(11,114,133,.07);border-radius:16px}
button{transition:transform .08s,box-shadow .15s,border-color .15s;border-radius:12px}
button:hover{border-color:var(--ac);box-shadow:0 2px 10px rgba(11,114,133,.14)}
button:active{transform:scale(.985)}
#o{counter-reset:o}
#o button{position:relative;padding-left:46px;line-height:1.35}
#o button::before{counter-increment:o;content:counter(o,upper-alpha);position:absolute;left:11px;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#1b4965));color:#fff;border-radius:20px;padding:16px;margin:4px 0 10px;box-shadow:0 8px 22px rgba(11,114,133,.28)}
.hero h1{color:#fff;margin:0;font-size:1.25rem}.hero .mu{color:rgba(255,255,255,.88)}.hl{font-size:2.3rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stats span{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.small{font-size:.75rem}
.it{border-left:4px solid var(--ac)}
.tag{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#6741d9))}
.v{border-left:4px solid var(--ac)}
.fb{border-radius:10px}
#nv{border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#nv button{border-radius:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var C=[
{t:"Dolor torácico en domicilio",l:"Extrahospitalario · SAMU",g:"Infarto",n:{
a:{x:"Hombre de 62 años, diabético tipo 2 y fumador. Dolor opresivo retroesternal hace 40 min que irradia a la mandíbula, con sudoración. No refiere alergias.",v:"PA 146/92 · FC 98 · FR 22 · Sat 94% · ECG aún no realizado",q:"¿Qué haces primero?",o:[
["Tomar ECG de 12 derivaciones, monitorizar y canalizar una vía periférica","b",2,"El ECG precoz (antes de 10 min) orienta toda la conducta; lo demás se hace en paralelo."],
["Instalar mascarilla con reservorio y trasladar de inmediato al hospital más cercano","c",0,"Sat 94% no justifica O₂ y el traslado sin ECG impide preavisar al centro adecuado."],
["Dar AAS 300 mg masticable y medir troponina capilar antes de continuar","b",1,"El AAS está bien, pero esperar una troponina retrasa el ECG, que es lo que define la conducta."]]},
b:{x:"El ECG muestra supradesnivel del ST en II, III y aVF. El dolor persiste en 7/10.",v:"PA 138/88 · FC 62 · Sat 95%",q:"¿Cómo continúas?",o:[
["Dar AAS 300 mg masticable, avisar a regulación y derivar a centro con angioplastia, manteniendo el monitor","f1",2,"Corresponde al IAM con SDST (GES): reperfusión precoz y traslado a centro con capacidad."],
["Administrar nitroglicerina 0,4 mg sublingual para aliviar el dolor y reevaluar en 5 min","c",0,"En infarto inferior puede haber compromiso del ventrículo derecho, dependiente de precarga."],
["Administrar morfina EV y esperar a que ceda el dolor antes de iniciar el traslado","c",0,"Se retrasa la reperfusión; el dolor se controla durante el traslado, no antes."]]},
c:{x:"Minutos después el paciente está pálido y mareado. Pulmones limpios, yugulares ingurgitadas.",v:"PA 84/50 · FC 44 · Sat 93%",q:"Hipotensión con bradicardia en un infarto inferior. ¿Qué haces?",o:[
["Administrar nitroglicerina para disminuir la carga cardiaca","d",0,"Con ventrículo derecho comprometido, el vasodilatador reduce la precarga y agrava el shock."],
["Dar un bolo cauteloso de suero fisiológico, avisar al médico por atropina y preparar parches de marcapaso","f2",2,"En infarto del VD se mantiene la precarga; la bradicardia se maneja según indicación y se prepara marcapaso."],
["Administrar furosemida EV por posible congestión pulmonar","d",0,"No hay congestión (pulmones limpios); el diurético reduce más la precarga."]]},
d:{x:"La PA cae a 58/30. El paciente pierde la conciencia y no hay pulso palpable. El monitor muestra fibrilación ventricular.",v:"Sin pulso · FV",q:"¿Cómo actúas?",o:[
["Iniciar compresiones, desfibrilar apenas esté el equipo y retomar RCP de inmediato","f3",2,"FV es ritmo desfibrilable: comprimir y desfibrilar sin demora."],
["Asegurar primero la vía aérea con intubación antes de comprimir","f4",0,"La intubación retrasa las compresiones y el choque, que determinan la supervivencia."],
["Administrar adrenalina y reevaluar el ritmo en 5 minutos","f4",0,"En FV el tratamiento prioritario es la desfibrilación; sin ella la adrenalina no basta."]]},
f1:{e:"g",x:"Llega a hemodinamia a tiempo y se realiza la angioplastia. Evolución favorable."},
f2:{e:"m",x:"La PA sube a 104/66 y la bradicardia cede. Se deriva estable, aunque el retraso pudo evitarse con una conducta más precoz."},
f3:{e:"m",x:"Recupera circulación espontánea tras el choque. Se traslada intubado a UCI coronaria con pronóstico reservado."},
f4:{e:"b",x:"El retraso en compresiones y desfibrilación hace que no se recupere la circulación. El paciente fallece."}}},

{t:"Confusión y fiebre en adulta mayor",l:"Intrahospitalario · Urgencia",g:"Shock séptico",n:{
a:{x:"Mujer de 74 años en tratamiento ambulatorio por infección urinaria. Llega confusa, con escalofríos y piel caliente.",v:"PA 82/44 · FC 124 · FR 28 · Sat 92% · T 39,2 °C",q:"¿Cuál es tu prioridad?",o:[
["Dar O₂, instalar dos vías venosas, tomar hemocultivos y lactato, e iniciar bolo de cristaloides según indicación","b",2,"Se identifica sepsis con hipoperfusión: volumen, cultivos y antibiótico precoz."],
["Administrar paracetamol EV y esperar el descenso de la fiebre antes de nuevos estudios","c",0,"La fiebre no es el problema principal: la hipotensión y la hipoperfusión requieren acción inmediata."],
["Tomar un urocultivo y mantenerla en observación mientras llega el resultado","c",0,"Retrasa el antibiótico y la reanimación en una paciente con hipotensión y alteración de conciencia."]]},
b:{x:"Tras 1,5 L de cristaloides y la primera dosis de antibiótico, la paciente sigue hipotensa. Lactato 4,8 mmol/L. Diuresis 10 mL/h.",v:"PA 88/50 · FC 118 · Sat 94%",q:"¿Qué haces ahora?",o:[
["Avisar por hipotensión persistente, preparar vasopresor según protocolo y controlar diuresis horaria con sonda","f1",2,"Persistir hipotensa tras volumen indica shock séptico: se requiere vasopresor y monitorización de perfusión."],
["Continuar bolos de cristaloides hasta completar 6 L aunque aparezcan crépitos pulmonares","d",0,"La sobrecarga de volumen puede causar edema pulmonar sin mejorar la perfusión."],
["Esperar una hora y repetir signos vitales antes de nuevas medidas","c",0,"En shock séptico cada hora de retraso aumenta la mortalidad."]]},
c:{x:"Una hora después la paciente está somnolienta y peor.",v:"PA 70/38 · FC 138 · FR 32 · Sat 86%",q:"¿Cómo respondes?",o:[
["Activar equipo de UCI, asegurar antibiótico, volumen y vasopresor según indicación y preparar vía aérea","f2",1,"Respuesta correcta aunque tardía: el retraso empeoró el pronóstico."],
["Subir el respaldo a semisentada y observar la tendencia 30 minutos más","f3",0,"Posición sola no revierte un shock refractario."],
["Administrar otro antipirético y explicar a la familia que la evolución es esperable","f3",0,"El deterioro requiere escalamiento, no solo manejo sintomático."]]},
d:{x:"Aparece disnea intensa con crépitos bilaterales.",v:"PA 90/52 · FC 126 · Sat 85%",q:"¿Qué haces?",o:[
["Suspender los bolos, sentarla, aumentar O₂ y avisar para vasopresor y evaluación de ventilación","f2",1,"Se corrige la sobrecarga y se pasa al soporte hemodinámico adecuado."],
["Administrar un bolo adicional para compensar la caída de PA","f3",0,"Más volumen agrava el edema pulmonar."],
["Mantener los bolos y agregar furosemida EV","f3",0,"Se contradicen dos medidas y no se aborda la hipotensión con vasopresor."]]},
f1:{e:"g",x:"Con noradrenalina y antibiótico, la PA se estabiliza y el lactato baja. Ingresa a UCI con buena respuesta."},
f2:{e:"m",x:"Sobrevive con soporte vasopresor y ventilación. El retraso prolonga la estancia en UCI."},
f3:{e:"b",x:"El shock se vuelve refractario y la paciente cae en paro. Fallece."}}},

{t:"Déficit neurológico súbito",l:"Intrahospitalario · Urgencia",g:"ACV isquémico",n:{
a:{x:"Mujer de 68 años con fibrilación auricular sin anticoagulantes. Presenta hemiparesia derecha y dificultad para hablar. La hija la vio normal hace 90 minutos.",v:"PA 196/104 · FC 92 irregular · Sat 96% · Glasgow 14",q:"¿Qué haces primero?",o:[
["Activar código ACV, registrar la hora del último momento normal, medir glicemia capilar, canalizar y mantener en ayunas","b",2,"La hora de inicio y descartar hipoglucemia definen la elegibilidad para reperfusión."],
["Darle un sorbo de agua para evaluar la deglución y luego derivarla a TAC","c",0,"Sin evaluación formal de deglución hay riesgo alto de aspiración."],
["Administrar enalapril sublingual para llevar la PA a cifras normales antes del TAC","d",0,"El descenso brusco de PA reduce la perfusión de la zona en riesgo."]]},
b:{x:"Glicemia 112 mg/dL. El TAC sin contraste no muestra sangrado. Han pasado 2 h 15 min del inicio. El neurólogo evalúa trombolisis.",v:"PA 192/102 · FC 90 · Glasgow 14",q:"¿Qué haces con la presión?",o:[
["Evitar descensos bruscos, preparar trombolisis con control de PA bajo el umbral indicado y evaluación neurológica cada 15 min","f1",2,"La PA se maneja según el umbral indicado para trombolisis, con vigilancia estrecha."],
["Administrar un antihipertensivo en bolo para llegar a 140/90 antes de cualquier otra cosa","d",0,"Un descenso rápido puede ampliar el infarto."],
["Esperar el perfil de laboratorio completo antes de hablar con neurología","f2",1,"Se acorta la ventana terapéutica; los exámenes no deben retrasar la decisión."]]},
c:{x:"Tras el sorbo de agua, la paciente tose con voz húmeda y vomita.",v:"PA 188/100 · FC 100 · Sat 89%",q:"¿Qué haces?",o:[
["Cabecera elevada o posición lateral, aspirar secreciones, O₂, suspender vía oral y avisar al médico","b",1,"Se maneja la aspiración y se retoma el proceso, con tiempo perdido."],
["Continuar el traslado a TAC sin intervenir, porque el tiempo es cerebro","f3",0,"Ignorar la aspiración compromete oxigenación y vía aérea."],
["Ofrecer líquidos por boca para calmar la tos","f3",0,"Aumenta el riesgo de nueva aspiración."]]},
d:{x:"Tras bajar la PA a 118/66, el déficit empeora: ahora está somnolienta y con hemiplejia completa.",v:"PA 118/66 · FC 88 · Glasgow 11",q:"¿Qué haces?",o:[
["Informar de inmediato, suspender antihipertensivos, reevaluar neurológicamente y preparar nuevo estudio de imagen","f2",1,"Se reconoce el error y se actúa; el daño ya ocurrió."],
["Mantener la reducción de PA para evitar sangrado","f3",0,"No hay sangrado en el TAC; sigue faltando perfusión."],
["Observar un rato más antes de avisar, para no alarmar","f3",0,"El empeoramiento neurológico exige aviso inmediato."]]},
f1:{e:"g",x:"Se realiza trombolisis dentro de la ventana. A las 24 h mejora el déficit y evoluciona sin complicaciones."},
f2:{e:"m",x:"Queda con secuelas moderadas: la demora o el descenso de PA redujeron el beneficio del tratamiento."},
f3:{e:"b",x:"Evoluciona a daño extenso con compromiso de conciencia y complicaciones respiratorias. Requiere UCI con mal pronóstico."}}},

{t:"Disnea en paciente crónico",l:"Intrahospitalario · Urgencia",g:"EPOC / pulmonar",n:{
a:{x:"Hombre de 71 años con EPOC. Tres días de disnea progresiva y tos con esputo purulento.",v:"PA 150/90 · FC 112 · FR 30 · Sat 82% aire ambiente · T 37,9 °C",q:"¿Cómo manejas el oxígeno?",o:[
["Administrar O₂ titulado con meta de Sat 88–92%, nebulizar broncodilatador y sentarlo","b",2,"La meta de saturación en EPOC evita tanto la hipoxemia como la hipercapnia inducida por O₂."],
["Administrar O₂ con mascarilla de reservorio hasta alcanzar Sat 100%","c",0,"La hiperoxia puede empeorar la hipercapnia en retenedores de CO₂."],
["Retener el O₂ hasta tener gases arteriales para no suprimir su estímulo respiratorio","d",0,"Con Sat 82% la hipoxemia es el riesgo inmediato; no se retiene oxígeno."]]},
b:{x:"Sat 90% y FR 26. Gases: pH 7,31, pCO₂ 58 mmHg. Mejora parcial.",v:"PA 146/88 · FC 104 · FR 26 · Sat 90%",q:"¿Qué haces ahora?",o:[
["Informar para corticoide y antibiótico, evaluar ventilación no invasiva y reevaluar FR, Sat y sensorio con frecuencia","f1",2,"Acidosis respiratoria leve-moderada: se trata la causa y se considera VNI con monitorización."],
["Administrar un sedante suave para disminuir la ansiedad y la sensación de falta de aire","c",0,"Los sedantes deprimen el impulso respiratorio en un paciente con hipercapnia."],
["Indicar alta con inhalador porque ya mejoró la saturación","f3",0,"Hay acidosis respiratoria y aún no está estable."]]},
c:{x:"Se vuelve somnoliento y tiene temblor aleteante de manos.",v:"PA 140/84 · FC 96 · FR 10 · Sat 97%",q:"Sospechas hipercapnia con depresión respiratoria. ¿Qué haces?",o:[
["Bajar la FiO₂ a la meta de 88–92%, estimularlo y avisar urgente para VNI o UCI","f2",1,"Se corrige la sobreoxigenación y se escala; hubo retraso por la conducta inicial."],
["Aumentar el O₂ porque la saturación podría caer","f3",0,"Empeora la hipercapnia y la somnolencia."],
["Dejarlo dormir y reevaluar en 2 horas","f3",0,"La somnolencia por CO₂ puede progresar a paro respiratorio."]]},
d:{x:"Mientras se esperan los gases, se pone agitado y cianótico.",v:"PA 160/94 · FC 126 · FR 34 · Sat 74%",q:"¿Qué haces?",o:[
["Iniciar O₂ titulado de inmediato, sin esperar los gases, y reevaluar la respuesta","b",1,"La hipoxemia grave mata antes que la hipercapnia; se corrige el error."],
["Seguir esperando el resultado de los gases arteriales","f3",0,"Con Sat 74% el retraso puede provocar un paro."],
["Administrar un sedante para calmar la agitación","f3",0,"La agitación es por hipoxemia; sedar deprime aún más la respiración."]]},
f1:{e:"g",x:"Responde a la VNI, corticoide y antibiótico. Mejora en 48 h y vuelve a sala con buen control."},
f2:{e:"m",x:"Se evita el paro respiratorio gracias a VNI en UCI, aunque requirió estancia prolongada."},
f3:{e:"b",x:"Entra en paro respiratorio. Se inicia reanimación y requiere intubación con evolución grave."}}},

{t:"Debilidad tras faltar a diálisis",l:"Intrahospitalario · Urgencia",g:"Renal / hiperkalemia",n:{
a:{x:"Hombre de 59 años con enfermedad renal crónica en hemodiálisis. Faltó a dos sesiones y consulta por debilidad y palpitaciones.",v:"PA 168/96 · FC 48 · FR 20 · Sat 95% · K⁺ 7,4 mEq/L",q:"¿Qué haces primero?",o:[
["Monitorizar ECG, canalizar vía y avisar de inmediato para iniciar tratamiento","b",2,"Hiperkalemia con bradicardia es emergencia: se monitoriza y se trata sin esperar."],
["Indicar dieta baja en potasio y repetir el examen mañana en el control","c",0,"Hiperkalemia sintomática no se maneja de forma ambulatoria."],
["Administrar furosemida oral y enviarlo a casa con control en 48 horas","c",0,"Con ERC avanzada el diurético es poco eficaz y no hay seguridad ni monitorización."]]},
b:{x:"El ECG muestra ondas T altas y QRS ensanchado. El médico indica tratamiento.",v:"PA 160/92 · FC 46 · K⁺ 7,4",q:"¿Qué administras primero para proteger el miocardio?",o:[
["Gluconato de calcio EV lento con monitor continuo","d",2,"El calcio estabiliza la membrana del miocardio de forma inmediata."],
["Insulina cristalina con glucosa EV con control de glicemia horario","d",1,"Reduce el potasio, pero no protege la membrana; el calcio debe ir primero."],
["Bicarbonato en bolo rápido sin gasometría ni calcio previo","c",0,"El bicarbonato tiene eficacia limitada si no hay acidosis y no protege la membrana."]]},
c:{x:"Se agrava: pulso lento y mareo marcado.",v:"PA 80/40 · FC 36 · QRS muy ancho",q:"¿Cómo respondes?",o:[
["Activar equipo, administrar calcio EV indicado, monitor/desfibrilador y preparar marcapaso transcutáneo","f2",1,"Respuesta de rescate correcta: se protege el miocardio y se prepara estimulación."],
["Administrar atropina sola y observar la respuesta","f3",0,"La atropina suele fallar en hiperkalemia: la causa sigue sin tratarse."],
["Pasar 1 L de suero fisiológico rápido","f3",0,"Es insuficiente y puede sobrecargar a un paciente anúrico."]]},
d:{x:"El QRS se estrecha tras la primera medida, pero el potasio sigue alto.",v:"PA 150/88 · FC 58 · K⁺ 6,9",q:"¿Qué sigue?",o:[
["Agregar insulina con glucosa y salbutamol nebulizado, controlar glicemia y coordinar diálisis urgente","f1",2,"Se reduce el potasio de forma rápida y se prepara su eliminación definitiva."],
["Administrar un resina oral por sí sola y observar durante la noche","f2",1,"La resina es lenta y no reemplaza la diálisis."],
["Repetir calcio cada hora sin otras medidas","f2",1,"El calcio es temporal; no reduce el potasio."]]},
f1:{e:"g",x:"Se dializa de urgencia. El potasio baja a 4,9 y el ECG se normaliza sin arritmias."},
f2:{e:"m",x:"Se estabiliza con demora hasta lograr diálisis. Hubo riesgo arrítmico evitable."},
f3:{e:"b",x:"Evoluciona a asistolia. Pese a la reanimación, no se logra recuperar."}}},

{t:"Vómito con sangre en cirrótico",l:"Intrahospitalario · Urgencia",g:"Hepático / hemorragia",n:{
a:{x:"Hombre de 55 años con cirrosis alcohólica y ascitis. Vomita sangre roja abundante.",v:"PA 92/58 · FC 120 · FR 24 · Sat 94% · Glasgow 14",q:"¿Qué priorizas?",o:[
["Proteger la vía aérea, dar O₂, canalizar dos vías gruesas, tomar muestras con pruebas cruzadas y avisar para endoscopía","b",2,"Se asegura vía aérea, acceso y preparación de hemoderivados antes de la endoscopía."],
["Administrar 3 L de suero fisiológico rápido hasta normalizar la PA","c",0,"El exceso de volumen eleva la presión portal y favorece nuevo sangrado."],
["Instalar sonda nasogástrica y hacer lavados con agua helada hasta aclarar","c",0,"Es una práctica sin evidencia que no controla el sangrado y no es la prioridad."]]},
b:{x:"Hb 7,2 g/dL e INR 1,9. El médico indica vasoactivo, antibiótico profiláctico y transfusión.",v:"PA 94/60 · FC 116 · Hb 7,2",q:"¿Cómo conduces la transfusión?",o:[
["Transfundir con meta restrictiva de Hb en torno a 7–8 g/dL, vigilando signos de sobrecarga","f1",2,"La estrategia restrictiva reduce el riesgo de nuevo sangrado y de complicaciones."],
["Transfundir hasta Hb 12 g/dL para asegurar un margen de seguridad","d",0,"La sobretransfusión aumenta la presión portal y el riesgo de resangrado."],
["Posponer la transfusión hasta después de la endoscopía","d",0,"Hay inestabilidad hemodinámica y Hb baja: el retraso aumenta el riesgo."]]},
c:{x:"Tras el volumen excesivo, la PA sube pero el sangrado continúa. Abdomen más distendido y Sat en descenso.",v:"PA 108/64 · FC 112 · Sat 90%",q:"¿Qué haces?",o:[
["Reducir cristaloides, solicitar hemoderivados y vasoactivo indicado, y pedir endoscopía urgente","f2",1,"Se corrige el error y se orienta el manejo a controlar el sangrado."],
["Continuar con el suero para sostener la PA","f3",0,"Agrava la distensión, la hipoxemia y el sangrado."],
["Administrar sedación fuerte para disminuir la agitación y esperar","f3",0,"Sin protección de vía aérea la sedación aumenta el riesgo de aspiración."]]},
d:{x:"Se produce nuevo sangrado con hematemesis y somnolencia. Signos de encefalopatía.",v:"PA 84/50 · FC 128 · Glasgow 11",q:"¿Qué haces?",o:[
["Posición lateral, avisar urgente para endoscopía y aseguramiento de vía aérea, y mantener hemoderivados y lactulosa según indicación","f2",1,"Se maneja la causa y se protege la vía aérea con la encefalopatía en curso."],
["Dar lactulosa por vía oral y observar su evolución","f3",0,"Con hematemesis y somnolencia hay riesgo de aspiración y no se controla el sangrado."],
["Administrar una benzodiacepina para tranquilizarlo","f3",0,"Empeora la encefalopatía y deprime la conciencia."]]},
f1:{e:"g",x:"La endoscopía permite ligadura de várices. Se estabiliza y pasa a UCI con buena respuesta."},
f2:{e:"m",x:"Se controla el sangrado con retraso. Evoluciona con insuficiencia hepática descompensada y estancia prolongada."},
f3:{e:"b",x:"Shock hemorrágico refractario y falla multiorgánica. El paciente fallece."}}},

{t:"Reacción durante una infusión",l:"Intrahospitalario · Medicina",g:"Shock anafiláctico",n:{
a:{x:"Mujer de 41 años hospitalizada recibe su primera dosis de ceftriaxona EV. A los 5 minutos refiere picazón, aparecen ronchas y siente la garganta cerrada.",v:"PA 78/40 · FC 132 · FR 28 · Sat 90% · estridor leve",q:"¿Qué haces?",o:[
["Suspender la infusión, pedir ayuda, administrar adrenalina IM en muslo según indicación, acostarla con piernas elevadas y dar O₂","b",2,"La adrenalina IM precoz es el tratamiento de primera línea; la posición supina protege la perfusión."],
["Administrar clorfenamina y hidrocortisona EV y reevaluar en 10 minutos","c",0,"Antihistamínicos y corticoides no tratan el shock ni el edema de vía aérea y retrasan la adrenalina."],
["Sentarla para facilitar la respiración y nebulizar salbutamol mientras llega el médico","c",0,"Sentarla con hipotensión puede provocar colapso; el broncodilatador no resuelve el cuadro."]]},
b:{x:"Cinco minutos después mejora parcialmente: persisten algunas sibilancias y está más tranquila.",v:"PA 94/58 · FC 112 · Sat 94%",q:"¿Cómo sigues?",o:[
["Repetir adrenalina IM según indicación si no mejora, administrar volumen EV, mantener O₂ y monitorizar durante varias horas por posible reacción bifásica","f1",2,"Puede requerir dosis repetidas y la observación prolongada es necesaria."],
["Retomar la infusión a menor velocidad para completar el tratamiento antibiótico","f3",0,"Reexponer al agente causal puede desencadenar una reacción mayor."],
["Darle el alta de la unidad de observación a los 30 minutos con un antihistamínico oral","f3",0,"El riesgo de reacción bifásica exige observación mayor."]]},
c:{x:"Empeora con estridor marcado, voz casi ausente y pulso débil.",v:"PA 60/30 · FC 140 · Sat 82%",q:"¿Qué haces ahora?",o:[
["Administrar adrenalina IM de inmediato, repetir según indicación, dar bolos de cristaloides y preparar vía aérea avanzada y adrenalina en infusión","f2",1,"Rescate correcto, aunque el retraso inicial elevó el riesgo."],
["Continuar con antihistamínicos EV y esperar el efecto","f3",0,"No revierten la obstrucción ni el shock."],
["Administrar adrenalina EV en bolo directo sin monitor para ganar tiempo","f3",0,"El bolo EV sin dilución ni monitorización puede causar arritmias graves."]]},
f1:{e:"g",x:"Se estabiliza y permanece en observación 24 h sin recaída. Se registra alergia a betalactámicos y se informa al paciente."},
f2:{e:"m",x:"Se estabiliza tras intubación y UCI breve. El retraso de la adrenalina prolongó la recuperación."},
f3:{e:"b",x:"Presenta paro por obstrucción de vía aérea y shock. No se recupera."}}},

{t:"Disnea súbita nocturna",l:"Intrahospitalario · Urgencia",g:"Cardiogénico / edema pulmonar",n:{
a:{x:"Hombre de 70 años con insuficiencia cardiaca. Despierta con ahogo, tos con espuma rosada y sudoración.",v:"PA 190/110 · FC 118 · FR 34 · Sat 80% · crépitos hasta ápices",q:"¿Cuál es tu primera acción?",o:[
["Sentarlo con las piernas colgando, dar O₂, monitorizar, canalizar y avisar para diurético y vasodilatador","b",2,"La posición sentada y el O₂ mejoran la mecánica respiratoria; el tratamiento farmacológico es precoz."],
["Acostarlo en posición plana para mejorar la perfusión cerebral e iniciar un bolo de cristaloide","c",0,"Acostarlo empeora el ahogo y el volumen agrava el edema."],
["Nebulizar salbutamol e ipratropio por las sibilancias y reevaluar en 20 minutos","c",0,"Es un edema pulmonar cardiogénico, no un broncoespasmo primario; se pierde tiempo."]]},
b:{x:"Tras O₂, furosemida y nitroglicerina indicadas, mejora: diuresis de 400 mL en una hora.",v:"PA 148/90 · FC 100 · Sat 93%",q:"¿Qué priorizas ahora?",o:[
["Balance hídrico estricto, control horario de PA y diuresis, electrolitos, ECG y búsqueda de la causa descompensante","f1",2,"La mejoría debe sostenerse y buscar el desencadenante (isquemia, arritmia, dieta, fármacos)."],
["Trasladarlo a sala común sin monitor y reiniciar dieta libre y agua a voluntad","f2",1,"Se pierde vigilancia y se favorece la sobrecarga."],
["Suspender los controles frecuentes porque ya mejoró","f2",1,"Riesgo de recaída sin detectar."]]},
c:{x:"Empeora: cianosis, extremidades frías y poca orina.",v:"PA 80/50 · FC 130 · Sat 74%",q:"Se sospecha shock cardiogénico. ¿Qué haces?",o:[
["Sentarlo, dar O₂ o CPAP según indicación, avisar urgente por vasopresor o inotrópico y UCI","f2",1,"Corresponde a shock cardiogénico; el retraso complicó el cuadro."],
["Administrar un bolo rápido de 1 L de suero para subir la presión","f3",0,"Sobrecarga un corazón ya claudicante."],
["Administrar morfina en dosis alta para disminuir la ansiedad","f3",0,"Deprime la respiración y empeora la hipotensión."]]},
f1:{e:"g",x:"Se identifica una crisis hipertensiva como desencadenante. Se ajusta el tratamiento y evoluciona estable."},
f2:{e:"m",x:"Se recupera con soporte, aunque requirió ingreso prolongado por el retraso."},
f3:{e:"b",x:"Cae en shock refractario y paro. No hay recuperación."}}},

{t:"Sed intensa y confusión",l:"Intrahospitalario · Urgencia",g:"Diabetes mellitus 2",n:{
a:{x:"Mujer de 66 años con DM2 e infección urinaria reciente. Una semana con poliuria y sed, hoy confusa y con piel seca.",v:"PA 96/58 · FC 116 · FR 22 · Glicemia 780 mg/dL · Na 148 · cetonas negativas",q:"¿Qué haces primero?",o:[
["Canalizar dos vías, monitorizar y avisar para reponer volumen con suero fisiológico","b",2,"La deshidratación severa es el problema principal y precede a la insulina."],
["Administrar un bolo de insulina rápida de inmediato para bajar la glicemia","c",0,"Sin reponer volumen, bajar rápido la glicemia empeora la hipotensión y los cambios osmóticos."],
["Hidratarla con suero glucosado al 5% por ser un suero de mantenimiento común","c",0,"El aporte de glucosa agrava la hiperglicemia."]]},
b:{x:"Tras 2 L de suero, mejora. Glicemia 640 mg/dL, K⁺ 3,1 mEq/L. Se evalúa iniciar insulina.",v:"PA 110/70 · FC 98",q:"¿Cómo continúas?",o:[
["Avisar el K⁺ bajo, reponer potasio antes y luego iniciar insulina en infusión con control horario","f1",2,"La insulina con potasio bajo puede desencadenar arritmias graves."],
["Iniciar insulina en infusión de inmediato porque la glicemia es muy alta","d",0,"Con K⁺ bajo, la insulina lo reduce aún más."],
["Administrar bicarbonato EV para corregir el cuadro metabólico","d",0,"No hay acidosis cetósica marcada; no corresponde."]]},
c:{x:"Empeora con hipotensión y somnolencia marcada.",v:"PA 72/40 · FC 130 · Glasgow 10",q:"¿Qué haces?",o:[
["Suspender el aporte inapropiado, reponer volumen con suero fisiológico, avisar y vigilar neurología y glicemia","b",1,"Se corrige el error y se retoma el manejo adecuado."],
["Aumentar la insulina para bajar la glicemia más rápido","f3",0,"Agrava el shock y el desequilibrio osmolar."],
["Esperar a que mejore con el tratamiento en curso","f3",0,"El deterioro exige corrección inmediata."]]},
d:{x:"Aparece debilidad y arritmia en el monitor.",v:"PA 100/60 · FC 52 irregular · K⁺ 2,6",q:"¿Cómo respondes?",o:[
["Detener la insulina, avisar de inmediato y reponer potasio EV monitorizado según indicación","f2",1,"Se corrige la hipokalemia y se revierte el riesgo."],
["Aumentar la velocidad de la insulina para corregir la glicemia","f3",0,"Agrava la hipokalemia."],
["Observar el ritmo unos minutos antes de intervenir","f3",0,"Ante arritmia con K⁺ muy bajo se actúa de inmediato."]]},
f1:{e:"g",x:"La glicemia desciende de forma gradual y se aclara el sensorio. Se ajusta tratamiento y se trata la infección."},
f2:{e:"m",x:"Se estabiliza con monitorización, pero el episodio prolongó su estancia en UCI."},
f3:{e:"b",x:"Evoluciona a arritmia fatal o shock refractario. No logra recuperarse."}}},

{t:"Cefalea súbita intensa",l:"Intrahospitalario · Urgencia",g:"ACV hemorrágico",n:{
a:{x:"Hombre de 64 años hipertenso. Cefalea explosiva, vómitos y debilidad en brazo y pierna izquierdos hace 50 minutos.",v:"PA 220/120 · FC 70 · Sat 95% · Glasgow 12",q:"¿Qué haces primero?",o:[
["Cabecera a 30°, vigilar vía aérea y nivel de conciencia, canalizar, medir glicemia y avisar para TAC urgente","b",2,"Se estabiliza la vía aérea y se confirma el tipo de ACV antes de tratar."],
["Administrar AAS 300 mg por sospecha de ACV isquémico antes del TAC","c",0,"Si es hemorrágico, el antiagregante agrava el sangrado."],
["Sedarlo con un fármaco suave y esperar a que se calme el dolor","c",0,"La sedación enmascara el examen neurológico y deprime la vía aérea."]]},
b:{x:"El TAC muestra una hemorragia intraparenquimatosa de 30 mL. Neurocirugía fue informada.",v:"PA 214/118 · FC 66 · Glasgow 12",q:"¿Cómo manejas la presión arterial?",o:[
["Iniciar infusión titulable de antihipertensivo según indicación, con objetivo gradual, y control neurológico cada 15 minutos","f1",2,"En hemorragia intracerebral el control gradual de PA reduce la expansión del hematoma."],
["Mantener la PA elevada para asegurar la perfusión cerebral, como en un ACV isquémico","c",0,"Una PA alta favorece el crecimiento del hematoma."],
["Administrar un bolo rápido para llevar la PA a 110/70 en pocos minutos","d",0,"El descenso brusco puede producir isquemia cerebral."]]},
c:{x:"Empeora: se vuelve estuporoso, pupila izquierda dilatada y bradicardia.",v:"PA 230/124 · FC 48 · Glasgow 8",q:"Signos de hipertensión intracraneal. ¿Qué haces?",o:[
["Mantener cabecera a 30°, asegurar vía aérea según indicación, avisar a neurocirugía y preparar osmoterapia","f2",1,"Manejo de rescate del edema e hipertensión intracraneal."],
["Colocarlo en Trendelenburg para mejorar la perfusión cerebral","f3",0,"Aumenta la presión intracraneal."],
["Administrar un sedante en bolo y observar su evolución","f3",0,"Oculta el deterioro neurológico y compromete la vía aérea."]]},
d:{x:"Tras el descenso rápido de presión, empeora el nivel de conciencia.",v:"PA 86/48 · FC 64 · Glasgow 9",q:"¿Qué haces?",o:[
["Suspender el antihipertensivo, avisar de inmediato, mantener decúbito y ajustar la presión con el médico","f2",1,"Se corrige el descenso excesivo y se recupera la perfusión."],
["Continuar el descenso hasta estabilizar el sangrado","f3",0,"Agrava la isquemia."],
["Esperar unos minutos para ver si la presión se recupera sola","f3",0,"Hay compromiso neurológico: se actúa de inmediato."]]},
f1:{e:"g",x:"La PA se controla de forma gradual y el hematoma no crece. Pasa a UCI neurológica con evolución favorable."},
f2:{e:"m",x:"Se estabiliza con intervención neuroquirúrgica o UCI, con secuelas neurológicas."},
f3:{e:"b",x:"Se produce herniación cerebral y muerte encefálica."}}},

{t:"Motociclista con disnea",l:"Extrahospitalario · SAMU",g:"Trauma / neumotórax a tensión",n:{
a:{x:"Hombre de 28 años, choque en moto. Dolor en hemitórax derecho, cada vez más disnea y ansiedad. Ausencia de murmullo pulmonar derecho, yugulares ingurgitadas y tráquea desviada.",v:"PA 78/50 · FC 140 · FR 36 · Sat 82%",q:"¿Qué haces?",o:[
["Dar O₂ a alto flujo, avisar de inmediato y preparar el material para descompresión pleural urgente que realiza el médico","b",2,"El neumotórax a tensión es un diagnóstico clínico y requiere descompresión inmediata."],
["Solicitar una radiografía portátil de tórax y esperar el resultado antes de intervenir","c",0,"Retrasa la descompresión en un cuadro con riesgo vital inminente."],
["Administrar volumen EV y analgésico potente y observar la evolución por unos minutos","c",0,"El volumen y la analgesia no resuelven la obstrucción mecánica."]]},
b:{x:"Tras la descompresión mejora rápidamente.",v:"PA 102/64 · FC 112 · Sat 94%",q:"¿Qué sigue?",o:[
["Preparar toracostomía con drenaje bajo sello de agua, analgesia, control de signos vitales y reevaluación primaria ABCDE","f1",2,"La descompresión es temporal; se requiere drenaje definitivo y reevaluación."],
["Retirar el monitor y el O₂ porque ya se resolvió el cuadro","f2",1,"Puede reacumularse aire sin vigilancia."],
["Clampear el drenaje al ver burbujeo para evitar la entrada de aire","c",0,"Clampear con fuga de aire puede reproducir el neumotórax a tensión."]]},
c:{x:"Se produce pérdida de conciencia y ausencia de pulso con actividad eléctrica en el monitor.",v:"Sin pulso · actividad eléctrica sin pulso",q:"¿Cómo actúas?",o:[
["Iniciar RCP, avisar y facilitar la descompresión pleural inmediata, reanudando compresiones","f2",1,"Se trata la causa reversible junto con la RCP."],
["Realizar solo RCP y adrenalina sin tratar la causa del cuadro","f3",0,"Sin descompresión no se corrige la causa."],
["Intubar y ventilar con presión positiva antes de cualquier otra intervención","f3",0,"La presión positiva empeora el neumotórax a tensión."]]},
f1:{e:"g",x:"Llega estable a centro de trauma con drenaje funcionando y buena evolución."},
f2:{e:"m",x:"Se recupera con intervención tardía y requiere UCI."},
f3:{e:"b",x:"Persiste el paro y no se recupera la circulación."}}},

{t:"Mareo y caída en sala",l:"Intrahospitalario · Medicina",g:"Hipotensión ortostática",n:{
a:{x:"Mujer de 82 años con antihipertensivo nuevo desde hace 3 días. Se levantó sola al baño, se mareó y cae al suelo. Está consciente y refiere dolor en la cadera izquierda.",v:"PA 112/66 · FC 92 · Sat 96% · Glicemia 108",q:"¿Qué haces?",o:[
["No moverla, evaluar cabeza, cuello y cadera, tomar signos vitales y avisar al médico","b",2,"Hay riesgo de fractura o lesión cervical: se evalúa antes de movilizar."],
["Sentarla de inmediato en una silla y tomar la presión sentada","c",0,"Se moviliza sin descartar fractura."],
["Subirla entre dos personas a la cama y luego avisar","c",0,"Movilizar sin evaluar puede agravar una lesión."]]},
b:{x:"No hay lesión craneal. El dolor de cadera es leve y sin deformidad. PA acostada 128/74, de pie 84/50 con mareo. El médico suspende el fármaco nuevo.",v:"Ortostática positiva",q:"¿Qué cuidados indicas?",o:[
["Cambios de posición graduales, asistencia al levantarse, hidratación oral, control de PA ortostática y plan de prevención de caídas","f1",2,"Se aborda la causa y se previenen nuevas caídas."],
["Reiniciar el fármaco al mismo horario para no perder el control de PA y que camine sola","f3",0,"Se repite el riesgo de síncope y caída."],
["Indicar reposo absoluto prolongado en cama sin movilizar","f2",1,"Favorece desacondicionamiento y trombosis."]]},
c:{x:"Ahora refiere dolor intenso en la cadera izquierda y la pierna aparece acortada y rotada hacia afuera.",v:"PA 118/70 · FC 104",q:"¿Qué haces?",o:[
["Inmovilizar, administrar analgesia indicada, avisar para radiografía y evaluación traumatológica","f2",1,"Probable fractura de cadera: se controla el dolor y se evita mayor daño."],
["Pedirle que camine para comprobar si puede apoyar la pierna","f3",0,"Puede agravar la fractura."],
["Aplicar masaje y pomada en la zona y observar","f3",0,"No corresponde ante sospecha de fractura."]]},
f1:{e:"g",x:"No vuelve a caerse y mejora la tolerancia al ortostatismo. Alta con indicaciones al cuidador."},
f2:{e:"m",x:"Se resuelve con complicaciones: reposo prolongado o cirugía de cadera."},
f3:{e:"b",x:"Sufre nueva caída con fractura grave y complicaciones posteriores."}}},

{t:"Control cardiovascular en CESFAM",l:"Extrahospitalario · APS",g:"Hipertensión / dislipidemia",n:{
a:{x:"Hombre de 55 años en el Programa de Salud Cardiovascular, hipertenso y con dislipidemia. Acude a control tras 3 meses con enalapril y atorvastatina. Refiere tos seca molesta desde hace 6 semanas y reconoce que omite el enalapril algunos días. Fuma 10 cigarrillos al día.",v:"PA 152/94 · FC 76 · IMC 31 · LDL previo 168 mg/dL",q:"¿Cómo orientas el control?",o:[
["Explorar la adherencia y las razones de las omisiones, informar la tos al médico por posible efecto del fármaco, reforzar educación y ofrecer apoyo para dejar de fumar","b",2,"La tos por IECA es frecuente y causa abandono; detectarla y derivar mejora la adherencia."],
["Explicarle que la tos es normal con el enalapril y que debe seguir tomándolo todos los días sin cambios","c",0,"Minimiza un efecto adverso que explica la mala adherencia."],
["Explicarle que si la tos le molesta puede suspender el enalapril por su cuenta hasta el próximo control","c",0,"Suspender sin indicación deja la PA sin control."]]},
b:{x:"El médico cambia a un ARA II. A las 4 semanas vuelve sin tos y con PA 138/86. Pregunta qué más debe hacer.",v:"PA 138/86 · FC 72",q:"¿Qué refuerzas?",o:[
["Metas de PA y LDL según su riesgo, toma diaria del tratamiento, alimentación baja en sal y grasas saturadas, actividad física y control de exámenes","f1",2,"Educación integral y centrada en riesgo cardiovascular global."],
["Que si se siente bien puede suspender la estatina y volver al control en 6 meses","d",0,"La dislipidemia es asintomática; suspender eleva el riesgo cardiovascular."],
["Entregar las recetas y agendar el siguiente control sin educación adicional por falta de tiempo en box","f2",1,"Se pierde la oportunidad de reforzar adherencia y estilo de vida."]]},
c:{x:"Dos meses después abandonó el tratamiento. Consulta en SAPU con cefalea y PA alta, sin dolor torácico ni déficit neurológico.",v:"PA 204/118 · FC 88 · Sat 97%",q:"¿Qué haces?",o:[
["Reposo, repetir la PA con técnica correcta, buscar síntomas de daño de órgano blanco, avisar al médico y retomar el tratamiento oral según indicación con control cercano","f2",1,"Hipertensión severa sin daño agudo se maneja con reducción gradual y seguimiento."],
["Administrar nifedipino sublingual para bajar la PA rápidamente","f3",0,"El descenso brusco puede causar isquemia cerebral o cardiaca."],
["Enviarlo a casa con reposo sin evaluar síntomas ni informar al médico","f3",0,"No se descarta daño de órgano blanco."]]},
d:{x:"Meses después presenta dolor torácico opresivo al caminar rápido que cede con el reposo. Su LDL fue 190 mg/dL.",v:"PA 150/92 · FC 80",q:"¿Qué haces?",o:[
["Reposo, ECG si está disponible, avisar al médico, derivar a evaluación cardiológica y educar sobre signos de alarma","f2",1,"Sospecha de angina: se estudia y deriva para prevenir un infarto."],
["Indicarle que es un dolor muscular por la estatina y repetir el control en 3 meses","f3",0,"Se atribuye a un efecto adverso sin descartar isquemia."],
["Aconsejarle ejercicio más intenso para mejorar su estado físico","f3",0,"Con angina sospechada, el esfuerzo intenso sin evaluación es riesgoso."]]},
f1:{e:"g",x:"PA y LDL llegan a la meta en 3 meses. Deja de fumar con apoyo y mantiene buena adherencia."},
f2:{e:"m",x:"Se controla con retraso y mayor riesgo cardiovascular, con necesidad de estudios y seguimiento intensivo."},
f3:{e:"b",x:"Sufre un evento cardiovascular mayor (ACV o infarto) por el mal control previo."}}},

{t:"Vómitos y respiración profunda",l:"Intrahospitalario · Urgencia",g:"Diabetes mellitus 1",n:{
a:{x:"Joven de 19 años con DM1, 2 días con vómitos y malestar tras omitir insulina. Respiración rápida y profunda, aliento afrutado, deshidratada.",v:"PA 92/56 · FC 124 · FR 30 · Glicemia 520 mg/dL · cetonas ++++ · pH 7,12 · K⁺ 4,1",q:"¿Qué haces primero?",o:[
["Canalizar dos vías, monitorizar y avisar para reposición de volumen con suero fisiológico antes de iniciar la insulina","b",2,"En cetoacidosis la reposición de volumen es la primera medida, con insulina en infusión posterior."],
["Administrar un bolo de insulina rápida EV para bajar la glicemia de inmediato","c",0,"Sin volumen previo, la insulina agrava la hipotensión y baja el potasio."],
["Administrar bicarbonato EV en bolo para corregir el pH de 7,12","c",0,"No es rutinario y puede empeorar la hipokalemia."]]},
b:{x:"Tras 2 horas de volumen e insulina en infusión según indicación: glicemia 240 mg/dL, pH 7,20 y cetonas aún positivas.",v:"PA 108/66 · FC 100 · K⁺ 3,8",q:"¿Cómo continúas?",o:[
["Mantener la insulina en infusión y agregar suero con glucosa, controlando glicemia horaria, potasio y gases hasta resolver la cetosis","f1",2,"La acidosis se corrige con insulina; se agrega glucosa para evitar hipoglucemia."],
["Suspender la insulina porque la glicemia ya bajó de 250 mg/dL","d",0,"La cetoacidosis persiste y reaparece sin insulina."],
["Cambiar a insulina subcutánea y reiniciar alimentación oral ahora","f2",1,"Se pasa de fase antes de corregir la acidosis."]]},
c:{x:"Empeora tras el bolo: debilidad intensa y arritmias.",v:"PA 76/40 · FC 138 · K⁺ 3,0",q:"¿Qué haces?",o:[
["Detener la insulina, avisar de inmediato, reponer volumen y potasio EV monitorizado según indicación","b",1,"Se corrige el error y se vuelve a la secuencia adecuada."],
["Continuar la insulina y observar la evolución","f3",0,"Agrava la hipokalemia y el shock."],
["Administrar más bicarbonato para corregir la acidosis","f3",0,"No corrige el potasio ni la hipovolemia."]]},
d:{x:"La acidosis reaparece: pH 7,05, vómitos y somnolencia.",v:"PA 98/60 · FC 118 · FR 32 · Glasgow 11",q:"¿Qué haces?",o:[
["Reiniciar la infusión de insulina con glucosa según indicación y reevaluar causa y gases","f2",1,"Se retoma el tratamiento tras el error."],
["Mantener sin insulina y observar","f3",0,"La cetosis sigue sin control."],
["Administrar bicarbonato en bolo y esperar","f3",0,"No reemplaza la insulina."]]},
f1:{e:"g",x:"Se resuelve la cetoacidosis y pasa a insulina subcutánea. Se educa sobre días de enfermedad y manejo de insulina."},
f2:{e:"m",x:"Se resuelve con retraso y estancia prolongada en UCI."},
f3:{e:"b",x:"Evoluciona a edema cerebral o arritmia fatal. Fallece."}}},

{t:"Úlcera en el pie",l:"Extrahospitalario · APS",g:"Curación / pie diabético",n:{
a:{x:"Mujer de 60 años con DM2 hace 15 años. Úlcera plantar de 2 cm en antepié derecho desde hace 2 semanas, con exudado y mal olor leve.",v:"PA 138/82 · FC 88 · T 37,4 °C · Glicemia 262 mg/dL · pulsos pedios débiles",q:"¿Qué haces?",o:[
["Valorar la herida (tamaño, profundidad, exudado, tejido y signos de infección), medir signos vitales, limpiar con suero fisiológico, aplicar apósito según valoración y avisar para desbridamiento y descarga","b",2,"Valoración sistemática, técnica aseptica y derivación para desbridamiento."],
["Sumergir el pie en agua tibia con sal 20 minutos y cubrir con gasa seca","c",0,"El remojo macera la piel y favorece infección."],
["Aplicar povidona yodada y agua oxigenada a diario y cubrir con apósito oclusivo sin otra valoración","c",0,"Son citotóxicos y el oclusivo sin valorar infección es riesgoso."]]},
b:{x:"A los 7 días: úlcera de 2,5 cm con esfacelos y eritema de 1 cm, sin fiebre. La paciente sigue caminando sin descarga.",v:"T 37,2 °C · Glicemia 210 mg/dL",q:"¿Qué refuerzas?",o:[
["Descarga de presión con dispositivo indicado, control glicémico, revisión diaria de los pies, curación según protocolo y control seriado de la herida","f1",2,"La descarga de presión es clave para cicatrizar."],
["Mantener la curación y control en 1 mes, sin otras indicaciones","f2",1,"Intervalo largo y falta de descarga."],
["Indicar zapatos cerrados y continuar su rutina para no perder movilidad","c",0,"Sin descarga no cicatriza y puede infectarse."]]},
c:{x:"Empeora: eritema de 6 cm que asciende por el pie, secreción purulenta y fiebre.",v:"PA 118/70 · FC 108 · T 38,6 °C · Glicemia 340 mg/dL",q:"¿Qué haces?",o:[
["Informar de inmediato al médico por posible infección profunda y derivar a urgencia, tomar cultivo según indicación y controlar signos vitales","f2",1,"Se reconoce la infección profunda; el retraso ya generó complicación."],
["Aplicar un antibiótico tópico y revisar en 3 días","f3",0,"Es insuficiente para una infección con signos sistémicos."],
["Aumentar la frecuencia del remojo para limpiar mejor","f3",0,"Agrava la maceración y la infección."]]},
f1:{e:"g",x:"Cicatrización progresiva con descarga y control; se evita infección."},
f2:{e:"m",x:"Requiere hospitalización y antibióticos EV; se evita la amputación."},
f3:{e:"b",x:"Progresa a osteomielitis y sepsis; requiere amputación."}}},

{t:"Caída de altura",l:"Extrahospitalario · SAMU",g:"Shock neurogénico",n:{
a:{x:"Hombre de 35 años cae desde 3 metros. Dolor cervical, no mueve las piernas y refiere hormigueo. Piel caliente y seca.",v:"PA 80/50 · FC 52 · FR 20 · Sat 96% · Glasgow 15",q:"¿Qué haces?",o:[
["Mantener inmovilización espinal con collar y tabla, asegurar vía aérea, dar O₂, canalizar y avisar para trasladar a centro con neurocirugía","b",2,"Hipotensión con bradicardia y piel caliente sugiere shock neurogénico; se protege la columna."],
["Sentarlo para evaluar mejor la movilidad y la sensibilidad de las piernas","c",0,"Se moviliza sin descartar lesión medular inestable."],
["Administrar 3 L de cristaloides rápidos hasta normalizar la PA, tratándolo como shock hipovolémico","c",0,"El exceso de volumen no corrige la vasoplejía y causa edema pulmonar."]]},
b:{x:"Durante el traslado sigue hipotenso y bradicárdico. No hay sangrado evidente.",v:"PA 84/52 · FC 48",q:"¿Cómo continúas?",o:[
["Reposición cuidadosa de volumen, avisar por vasopresor y atropina para la bradicardia según indicación y mantener normotermia","f1",2,"Se combina volumen limitado y vasopresor, con prevención de hipotermia."],
["Aumentar el volumen sin límite hasta que la PA suba","d",0,"Riesgo de sobrecarga y edema pulmonar."],
["Mantener solo la vigilancia del monitor hasta llegar al hospital","f2",1,"No se trata la hipotensión sostenida."]]},
c:{x:"Al movilizarlo grita de dolor, pierde sensibilidad hasta el pecho y respira superficialmente.",v:"PA 78/46 · FC 44 · FR 10 · Sat 88%",q:"¿Qué haces?",o:[
["Volver a inmovilizar la columna, asistir la ventilación con O₂ y avisar urgente para vía aérea avanzada","f2",1,"Se corrige la movilización y se maneja la insuficiencia ventilatoria."],
["Continuar movilizándolo para completar la evaluación","f3",0,"Agrava la lesión medular."],
["Dar analgesia potente y observar la respiración","f3",0,"Puede empeorar la hipoventilación."]]},
d:{x:"Aparece disnea con crépitos pulmonares tras el exceso de volumen.",v:"PA 92/54 · FC 60 · Sat 85%",q:"¿Qué haces?",o:[
["Suspender el volumen, elevar la cabecera con columna alineada, dar O₂ y avisar para vasopresor","f2",1,"Se corrige la sobrecarga y se orienta a soporte vasopresor."],
["Continuar el volumen para mantener la presión","f3",0,"Agrava el edema pulmonar."],
["Administrar furosemida y seguir con el volumen","f3",0,"Es contradictorio y no resuelve la hipotensión."]]},
f1:{e:"g",x:"Se estabiliza con vasopresor y llega a un centro especializado con buen manejo de la lesión medular."},
f2:{e:"m",x:"Sobrevive con lesión medular y soporte ventilatorio prolongado."},
f3:{e:"b",x:"Insuficiencia respiratoria y paro por lesión alta agravada. No se recupera."}}},

{t:"Somnolencia en cirrótico",l:"Intrahospitalario · Medicina",g:"Hepático / encefalopatía",n:{
a:{x:"Hombre de 58 años con cirrosis alcohólica. Cuatro días de estreñimiento; hoy somnoliento, desorientado y con temblor aleteante.",v:"PA 108/64 · FC 92 · T 37,4 °C · Glicemia 96 · Glasgow 12",q:"¿Qué haces primero?",o:[
["Posición segura con cabecera elevada, vigilar vía aérea, glicemia y signos vitales, y avisar para lactulosa y búsqueda del desencadenante","b",2,"Se protege la vía aérea y se busca la causa de la encefalopatía."],
["Administrar un sedante suave para controlar la inquietud y que descanse","c",0,"Los sedantes precipitan o agravan la encefalopatía."],
["Indicar ayuno de proteínas estricto y no administrar medicamentos hasta que despierte","c",0,"No corrige el desencadenante y retrasa el tratamiento."]]},
b:{x:"Se indica lactulosa y estudio. La causa: infección urinaria y estreñimiento. Hay mejoría parcial.",v:"Glasgow 14 · T 37,8 °C",q:"¿Cómo continúas?",o:[
["Cumplir lactulosa con meta de 2–3 deposiciones al día, registrar la evolución neurológica y el balance hídrico, controlar electrolitos y tratar la infección según indicación","f1",2,"Se trata la causa y se vigila la respuesta."],
["Suspender la lactulosa por diarrea y esperar sin otra medida","f2",1,"Se interrumpe el tratamiento sin ajuste adecuado."],
["Indicar dieta sin proteínas por varios días para disminuir el amoníaco","f2",1,"La restricción proteica estricta empeora el estado nutricional."]]},
c:{x:"Tras el sedante no despierta con estímulos y respira lento.",v:"PA 96/58 · FC 70 · FR 8 · Sat 88% · Glasgow 7",q:"¿Qué haces?",o:[
["Asegurar la vía aérea según indicación, avisar a UCI, evitar nuevos sedantes y administrar el tratamiento indicado","f2",1,"Se maneja la depresión respiratoria inducida."],
["Dejarlo dormir para que se recupere y controlarlo en 4 horas","f3",0,"El deterioro requiere intervención inmediata."],
["Repetir el sedante por si persiste la inquietud","f3",0,"Agrava la depresión de conciencia."]]},
f1:{e:"g",x:"Mejora neurológicamente en 48 horas, se corrige el desencadenante y se educa sobre lactulosa."},
f2:{e:"m",x:"Mejora con retraso o ingreso a UCI."},
f3:{e:"b",x:"Cae en coma profundo, aspira y fallece."}}},

{t:"Cefalea y visión borrosa en el embarazo",l:"Intrahospitalario · Urgencia obstétrica",g:"Preeclampsia severa",n:{
a:{x:"Embarazada de 34 semanas con cefalea intensa, visión borrosa y dolor epigástrico. Edema en manos y cara.",v:"PA 168/112 · FC 96 · FR 20 · Sat 97% · proteinuria ++ · reflejos aumentados · LCF 148",q:"¿Qué haces?",o:[
["Reposo en decúbito lateral izquierdo, monitoreo materno y fetal continuo, vía venosa y aviso inmediato al equipo para sulfato de magnesio y antihipertensivo","b",2,"Preeclampsia con criterios de gravedad: se previene la eclampsia y se controla la PA."],
["Indicar reposo domiciliario con control en 48 horas por tratarse de 34 semanas","c",0,"Es una urgencia obstétrica; no corresponde manejo ambulatorio."],
["Administrar furosemida EV para disminuir el edema y la presión","c",0,"Los diuréticos no tratan la enfermedad y pueden reducir la perfusión útero-placentaria."]]},
b:{x:"Se indica sulfato de magnesio EV (carga y mantención) y antihipertensivo. PA 152/98. Se prepara traslado a centro de mayor complejidad.",v:"PA 152/98 · FC 88",q:"¿Qué vigilas del sulfato de magnesio?",o:[
["Reflejo patelar, frecuencia respiratoria, diuresis horaria y saturación, con gluconato de calcio disponible","f1",2,"Son los signos de toxicidad por magnesio."],
["Solo la presión arterial, ya que es el objetivo del tratamiento","d",0,"No se detecta la toxicidad por magnesio."],
["Signos vitales y diuresis cada 6 horas para no interrumpir el descanso","d",0,"El intervalo es demasiado largo para detectar toxicidad."]]},
c:{x:"Horas después presenta una convulsión tónico-clónica.",v:"PA 178/116 · FC 124 · Sat 86%",q:"¿Qué haces?",o:[
["Proteger la vía aérea en posición lateral, dar O₂, avisar de inmediato, administrar magnesio según indicación y controlar PA y bienestar fetal","f2",1,"Eclampsia: se maneja la convulsión con magnesio y se vigila a la madre y al feto."],
["Administrar diazepam como primera línea y observar","f3",0,"El magnesio es el fármaco de elección; el diazepam no previene recurrencias."],
["Contener físicamente a la paciente y esperar que termine","f3",0,"Puede causar lesiones y no resuelve el cuadro."]]},
d:{x:"Pierde reflejos, FR de 9 y está somnolienta.",v:"FR 9 · Sat 90% · diuresis 20 mL/h",q:"¿Qué haces?",o:[
["Suspender la infusión de magnesio, avisar de inmediato, administrar gluconato de calcio según indicación y apoyar la ventilación","f2",1,"Se trata la toxicidad por magnesio."],
["Aumentar la velocidad para evitar una convulsión","f3",0,"Agrava la toxicidad y deprime la respiración."],
["Mantener la infusión y observar una hora más","f3",0,"La depresión respiratoria progresa."]]},
f1:{e:"g",x:"PA controlada y traslado estable. Nacimiento oportuno con buen resultado materno-fetal."},
f2:{e:"m",x:"Se estabiliza con intervención de urgencia; riesgo materno-fetal elevado."},
f3:{e:"b",x:"Eclampsia complicada con desprendimiento o paro. Mal pronóstico materno-fetal."}}},

{t:"Lactante con tos y respiración rápida",l:"Extrahospitalario · SAPU pediátrico",g:"Pediatría / bronquiolitis",n:{
a:{x:"Lactante de 4 meses con 3 días de coriza y tos. Hoy rechaza la mamadera y respira rápido, con retracción subcostal y sibilancias difusas. Un hermano está resfriado.",v:"FC 168 · FR 64 · Sat 90% aire ambiente · T 37,8 °C",q:"¿Qué haces?",o:[
["Aspirar suavemente las secreciones nasales, posición semisentada, dar O₂ con la meta de saturación indicada, fraccionar la alimentación y avisar al médico","b",2,"El manejo es de soporte: desobstrucción nasal, oxígeno, hidratación y alimentación fraccionada."],
["Nebulizar salbutamol cada 20 minutos y dar un corticoide oral de rutina","c",0,"En bronquiolitis típica no hay beneficio claro de broncodilatadores ni corticoides de rutina."],
["Dar la mamadera completa de una vez para evitar la deshidratación y enviarlo a casa con control en 48 horas","c",0,"Con Sat 90% y dificultad respiratoria requiere observación y oxígeno; la ingesta grande aumenta el riesgo de vómito y aspiración."]]},
b:{x:"Cuatro horas después está más tranquilo y tolera tomas pequeñas. Los padres preguntan cuándo podrá irse.",v:"Sat 95% con O₂ · FR 48 · FC 140",q:"¿Cómo continúas?",o:[
["Evaluar retirar el O₂ con control de saturación, vigilar hidratación y alimentación, e instruir en signos de alarma, lavado de manos y evitar humo de tabaco","f1",2,"El retiro progresivo con vigilancia y la educación previenen reconsultas."],
["Retirar el O₂ y el monitor de inmediato para que duerma sin interrupciones","d",0,"Puede haber desaturación al dormir sin vigilancia."],
["Solicitar antibiótico porque la fiebre persiste","f2",1,"No está indicado en un cuadro viral típico; expone a efectos adversos."]]},
c:{x:"Empeora con quejido, aleteo nasal y cianosis perioral.",v:"Sat 84% · FC 185 · FR 78",q:"¿Qué haces?",o:[
["Aumentar el O₂, aspirar, posicionar, avisar urgente para traslado a UCI pediátrica y preparar soporte respiratorio","f2",1,"Falla respiratoria inminente: se escala sin demora."],
["Nebulizar de nuevo y esperar 30 minutos para reevaluar","f3",0,"Se pierde tiempo en un lactante con falla respiratoria."],
["Administrar un sedante para disminuir la agitación","f3",0,"La agitación es por hipoxia; sedar deprime la respiración."]]},
d:{x:"Sin O₂ aparecen pausas respiratorias y desaturación.",v:"Sat 86% · FR 40 con pausas",q:"¿Qué haces?",o:[
["Reinstalar O₂, estimular, aspirar, monitorizar de forma continua y avisar por riesgo de apnea","f2",1,"Se corrige el error y se vigila apnea."],
["Mantener sin O₂ y observar unos minutos más","f3",0,"El lactante pequeño puede evolucionar a apnea."],
["Dar de alta con indicación de control si empeora","f3",0,"Hay desaturación y pausas: no es seguro el alta."]]},
f1:{e:"g",x:"Evoluciona bien y se da de alta con educación a los padres y control programado."},
f2:{e:"m",x:"Requiere oxígeno prolongado o UCI pediátrica, con recuperación."},
f3:{e:"b",x:"Evoluciona a insuficiencia respiratoria con paro. Requiere reanimación avanzada y queda con evolución grave."}}},

{t:"Niño con diarrea y vómitos",l:"Extrahospitalario · SAPU pediátrico",g:"Pediatría / deshidratación",n:{
a:{x:"Niño de 18 meses (11 kg) con diarrea acuosa y vómitos hace 2 días. Irritable, ojos hundidos, mucosas secas, llene capilar de 3 segundos y bebe con avidez.",v:"FC 150 · FR 32 · T 37,9 °C · Sat 98%",q:"¿Qué haces?",o:[
["Evaluar el grado de deshidratación, iniciar SRO fraccionada en pequeñas cantidades según el plan indicado y reevaluar hidratación y tolerancia oral","b",2,"La rehidratación oral fraccionada es la primera línea en deshidratación leve a moderada."],
["Ofrecer jugo de fruta y bebida isotónica deportiva a libre demanda y suspender la leche","c",0,"Los líquidos hiperosmolares empeoran la diarrea; no reponen adecuadamente electrolitos."],
["Pedir un antidiarreico para disminuir las deposiciones y así evitar más pérdidas","c",0,"No se recomiendan antidiarreicos en niños pequeños; pueden causar efectos graves."]]},
b:{x:"Tras 2 horas tolera parte de la SRO, pero vomita dos veces y sigue con deposiciones. Está más decaído.",v:"FC 158 · llene capilar 3 s · diuresis escasa",q:"¿Cómo continúas?",o:[
["Avisar, ofrecer SRO en volúmenes aún más pequeños y frecuentes, y si no tolera preparar vía para hidratación EV según indicación, manteniendo la alimentación habitual cuando sea posible","f1",2,"Se ajusta la vía de rehidratación según tolerancia sin dejar de alimentar."],
["Suspender la SRO y mantener ayuno de 12 horas para que descanse el intestino","d",0,"El ayuno prolongado favorece hipoglucemia y deshidratación."],
["Indicar alta con SRO y control en una semana","f2",1,"Persiste deshidratación y vómitos: el seguimiento a una semana es tardío."]]},
c:{x:"Empeora: letárgico, extremidades frías, llene capilar de 5 segundos y pulso débil.",v:"FC 178 · PA 70/40 · FR 40",q:"¿Qué haces?",o:[
["Activar equipo, canalizar y administrar bolo de suero fisiológico según indicación, reevaluar, dar O₂ y avisar para traslado a UCI","f2",1,"Shock hipovolémico: reposición EV inmediata."],
["Continuar SRO por boca y observar","f3",0,"El shock no se trata por vía oral."],
["Administrar suero glucosado al 5% rápido por ser más fácil de tolerar","f3",0,"No repone volumen intravascular de forma adecuada."]]},
d:{x:"Tras el ayuno está flácido y poco reactivo.",v:"Glicemia 42 mg/dL · FC 160",q:"¿Qué haces?",o:[
["Medir glicemia capilar, administrar glucosa EV según indicación, reiniciar la hidratación y avisar","f2",1,"Hipoglucemia por ayuno: se corrige y se retoma el manejo."],
["Esperar que acepte la SRO por boca","f3",0,"Con alteración de conciencia no se asegura la vía oral."],
["Darle jugo a la fuerza mientras duerme","f3",0,"Riesgo de aspiración."]]},
f1:{e:"g",x:"Se rehidrata por vía oral y se da de alta con educación sobre signos de alarma."},
f2:{e:"m",x:"Requiere hidratación EV y observación; se recupera."},
f3:{e:"b",x:"Evoluciona a shock hipovolémico refractario y requiere UCI con mal pronóstico."}}},

{t:"Colisión de bus con varias víctimas",l:"Extrahospitalario · SAMU",g:"Triage / múltiples víctimas",n:{
a:{x:"Eres el primer profesional en el lugar de una colisión de bus. Paciente 1: camina con fractura expuesta de antebrazo. Paciente 2: inconsciente, respira 8/min tras abrir la vía aérea. Paciente 3: consciente, atrapado, FR 24, pulso radial presente, obedece órdenes. Paciente 4: sin pulso ni respiración tras abrir la vía aérea.",v:"4 víctimas · método START",q:"¿Cómo priorizas?",o:[
["Paciente 1 verde, paciente 2 rojo, paciente 3 amarillo, paciente 4 negro","b",2,"START: camina = verde; respira tras abrir vía = rojo; FR <30, pulso y obedece = amarillo; sin respiración tras vía = negro."],
["Iniciar RCP prolongada en el paciente 4 por ser el más grave","c",0,"En múltiples víctimas no se consumen recursos en pacientes sin posibilidad inmediata."],
["Atender primero al paciente 1 por su lesión visible y su dolor","c",0,"Una lesión llamativa distrae: la prioridad la define la fisiología."]]},
b:{x:"Llegan dos dotaciones más. El paciente 3 ahora tiene pulso radial ausente y FR 32. El paciente 1 pregunta si puede irse.",v:"Reevaluación en curso",q:"¿Qué haces?",o:[
["Reclasificar al paciente 3 como rojo, controlar hemorragias, asignarle traslado prioritario y mantener al paciente 1 en la zona verde con registro","f1",2,"La reevaluación continua es parte del triage; se registran todos los pacientes."],
["Mantener la clasificación inicial sin reevaluar para no perder tiempo","d",0,"Un paciente amarillo puede pasar a rojo."],
["Dejar que el paciente 1 se retire por su cuenta sin registrarlo","f2",1,"Se pierde el seguimiento y se pueden omitir lesiones asociadas."]]},
c:{x:"Pasan 20 minutos dedicados a RCP en el paciente 4 sin respuesta. El paciente 2 ya no respira efectivamente y el 3 pierde la conciencia.",v:"Recursos agotados",q:"¿Qué haces?",o:[
["Reclasificar, suspender las maniobras en el paciente 4 según el protocolo y reasignar recursos a pacientes rojos recuperables","f2",1,"Se corrige la asignación; hubo demora evitable."],
["Continuar la RCP hasta que lleguen más equipos","f3",0,"Se sigue sin priorizar a los recuperables."],
["Repartir los recursos por igual entre los cuatro pacientes","f3",0,"El triage prioriza, no reparte por igual."]]},
d:{x:"Por no reevaluar, el paciente 3 llega a shock descompensado sin traslado asignado.",v:"PA 70/40 · FC 140",q:"¿Qué haces?",o:[
["Reclasificar a rojo, controlar la hemorragia, asignar traslado prioritario e informar a la regulación el cambio","f2",1,"Se corrige la clasificación tardía."],
["Esperar la próxima reevaluación programada","f3",0,"El deterioro exige acción inmediata."],
["Dar analgesia y mantener la clasificación","f3",0,"No se resuelve el shock."]]},
f1:{e:"g",x:"Priorización correcta: los pacientes rojos son trasladados a tiempo y se evita mortalidad evitable."},
f2:{e:"m",x:"Sobrevive la mayoría, pero hay una muerte potencialmente evitable por la demora."},
f3:{e:"b",x:"La mala priorización provoca varias muertes evitables."}}},

{t:"Poca orina tras diarrea",l:"Intrahospitalario · Urgencia",g:"Renal / IRA prerrenal",n:{
a:{x:"Hombre de 76 años con 3 días de vómitos y diarrea. Toma enalapril, furosemida e ibuprofeno por dolor de rodilla. Mucosas secas, sed y poca orina.",v:"PA 92/54 · FC 112 · diuresis 15 mL/h · creatinina 2,8 mg/dL (basal 1,0) · K⁺ 5,6",q:"¿Qué haces?",o:[
["Canalizar, monitorizar, iniciar reposición con cristaloide según indicación, instalar sonda para diuresis horaria y avisar para suspender fármacos nefrotóxicos y controlar el potasio con ECG","b",2,"Es probable una IRA prerrenal: se repone volumen y se retiran los factores agravantes."],
["Restringir los líquidos por la oliguria para no sobrecargarlo y esperar mejoría","c",0,"La oliguria por hipovolemia empeora al restringir líquidos."],
["Administrar furosemida EV para aumentar la diuresis y reducir el potasio","c",0,"Un diurético en hipovolemia agrava la hipoperfusión renal."]]},
b:{x:"Tras 1,5 L: PA 112/68, diuresis 60 mL/h, creatinina 2,2 y K⁺ 5,1. Pide su ibuprofeno por el dolor de rodilla.",v:"PA 112/68 · FC 92",q:"¿Qué haces?",o:[
["Informar al médico del dolor para analgesia alternativa, mantener suspendidos los AINE, controlar creatinina, K⁺ y balance, y educar sobre automedicación","f1",2,"Se evita la nefrotoxicidad y se educa."],
["Administrar el ibuprofeno que trae de su casa porque le funciona bien","d",0,"Los AINE dañan el riñón en hipovolemia."],
["Reiniciar de inmediato enalapril y furosemida para continuar su esquema habitual","d",0,"Se reintroducen fármacos que contribuyeron al cuadro."]]},
c:{x:"Tras la restricción de líquidos empeora: oliguria severa y alteraciones en el ECG.",v:"PA 80/46 · FC 124 · diuresis 5 mL/h · K⁺ 6,4 con T altas",q:"¿Qué haces?",o:[
["Monitorizar el ECG, avisar urgente, reponer volumen según indicación y tratar la hiperkalemia con gluconato de calcio según protocolo","f2",1,"Se trata la hiperkalemia y se corrige el error."],
["Seguir restringiendo líquidos y esperar","f3",0,"Persisten hipovolemia e hiperkalemia."],
["Administrar más furosemida","f3",0,"Agrava la hipotensión y no corrige el potasio de forma segura."]]},
d:{x:"Tras reiniciar el ibuprofeno o el esquema habitual, la diuresis vuelve a caer y la creatinina sube a 3,0.",v:"PA 98/58 · diuresis 18 mL/h",q:"¿Qué haces?",o:[
["Suspender AINE, IECA y diurético según indicación, volver a hidratar y vigilar K⁺ y diuresis","f2",1,"Se retiran los agravantes."],
["Continuar el esquema porque es el habitual","f3",0,"Se mantiene el daño renal."],
["Aumentar la dosis del diurético","f3",0,"Empeora la hipovolemia."]]},
f1:{e:"g",x:"Recupera la función renal en 72 horas; se ajusta la medicación y se educa sobre automedicación."},
f2:{e:"m",x:"Se recupera con estancia prolongada o diálisis breve."},
f3:{e:"b",x:"Evoluciona a falla renal con hiperkalemia grave y arritmia fatal."}}},

{t:"Disnea súbita tras una cirugía",l:"Intrahospitalario · Traumatología",g:"Pulmonar / TEP",n:{
a:{x:"Mujer de 38 años, 5 días después de cirugía de rodilla, con movilidad reducida. Disnea súbita, dolor torácico al inspirar y tos. Pantorrilla derecha edematosa.",v:"PA 108/70 · FC 118 · FR 28 · Sat 89% · T 37,2 °C",q:"¿Qué haces?",o:[
["Dar O₂, monitorizar, canalizar, evitar masajear la pierna y avisar de inmediato por sospecha de embolia pulmonar para estudio y anticoagulación según indicación","b",2,"Cuadro compatible con TEP: se estabiliza, se evita movilizar el trombo y se escala."],
["Administrar un antiinflamatorio para el dolor pleurítico, indicar reposo y esperar una radiografía de tórax","c",0,"Se retrasa el diagnóstico y la anticoagulación en una causa potencialmente mortal."],
["Masajear la pantorrilla edematosa para mejorar el retorno venoso y pedirle que camine","c",0,"Puede desprender el trombo y agravar la embolia."]]},
b:{x:"El angioTAC confirma TEP bilateral y se inicia anticoagulación. Tras 6 horas estable, baja la PA.",v:"PA 98/62 · FC 112 · Sat 93%",q:"¿Qué haces?",o:[
["Vigilar PA, saturación y signos de sangrado, evitar cargas rápidas de volumen, avisar de inmediato si cae la PA y controlar la anticoagulación según protocolo","f1",2,"El ventrículo derecho es sensible a la sobrecarga; hay que vigilar sangrado y perfusión."],
["Administrar un bolo de 2 L de suero para subir la PA","d",0,"La sobrecarga de volumen puede dilatar el ventrículo derecho y empeorar el shock."],
["Suspender los controles frecuentes porque ya está anticoagulada","f2",1,"Puede deteriorarse sin que se detecte."]]},
c:{x:"Pierde la conciencia brevemente. Ahora está hipotensa y con las yugulares ingurgitadas.",v:"PA 70/40 · FC 140 · Sat 82%",q:"¿Qué haces?",o:[
["Activar equipo, O₂ alto flujo, monitor, avisar por inestabilidad para terapia de reperfusión según indicación, con vasopresor y cuidado con el volumen","f2",1,"TEP de alto riesgo: se reperfunde y se evita la sobrecarga."],
["Administrar un bolo grande de volumen y observar","d",0,"Puede agravar la falla del ventrículo derecho."],
["Sentarla para que respire mejor sin avisar al equipo","f3",0,"Con shock obstructivo no hay tiempo que perder."]]},
d:{x:"Tras el bolo grande la presión empeora y las yugulares se distienden más.",v:"PA 66/38 · FC 148 · Sat 80%",q:"¿Qué haces?",o:[
["Suspender el volumen, avisar urgente y preparar vasopresor y terapia de reperfusión según indicación","f2",1,"Se corrige la sobrecarga y se escala."],
["Repetir el bolo de volumen","f3",0,"Agrava la falla del ventrículo derecho."],
["Administrar furosemida EV y observar","f3",0,"No resuelve el shock obstructivo."]]},
f1:{e:"g",x:"Se estabiliza con anticoagulación y se programa seguimiento y profilaxis."},
f2:{e:"m",x:"Sobrevive con terapia de reperfusión y estancia en UCI."},
f3:{e:"b",x:"Paro por insuficiencia ventricular derecha aguda. No se recupera."}}},

{t:"Joven con asma que no puede hablar",l:"Intrahospitalario · Urgencia",g:"Pulmonar / asma grave",n:{
a:{x:"Mujer de 22 años con asma. Tres días de tos y sibilancias; hoy no logra completar frases y usa los músculos accesorios.",v:"PA 128/78 · FC 130 · FR 32 · Sat 89% · flujo espiratorio muy bajo",q:"¿Qué haces?",o:[
["Sentarla, dar O₂ titulado, administrar salbutamol con ipratropio según indicación, avisar para corticoide sistémico precoz y monitorizar","b",2,"Crisis grave: broncodilatador repetido, O₂ y corticoide sistémico precoz."],
["Administrar un sedante suave para su ansiedad y observar","c",0,"La ansiedad es por hipoxia y los sedantes deprimen la respiración."],
["Indicar un antibiótico y tratamiento oral ambulatorio por la tos","c",0,"Una crisis grave no se maneja de forma ambulatoria ni con antibióticos de rutina."]]},
b:{x:"Tras 3 nebulizaciones y corticoide: habla frases cortas y mejora la ventilación.",v:"Sat 94% · FR 24 · FC 110",q:"¿Cómo continúas?",o:[
["Reevaluar FR, saturación, esfuerzo y flujo espiratorio, mantener monitorización y educar en aerocámara, desencadenantes y plan de acción","f1",2,"La mejoría debe confirmarse antes del alta y se refuerza la educación."],
["Suspender los broncodilatadores y dar el alta porque mejoró la saturación","d",0,"Una mejoría parcial no basta: el riesgo de recaída es alto."],
["Repetir salbutamol cada 5 minutos sin controles hasta que se sienta bien","f2",1,"Puede causar taquicardia e hipokalemia sin vigilancia."]]},
c:{x:"Tras el sedante está somnolienta, con silencio torácico y respiración lenta.",v:"Sat 82% · FC 140 · FR 12",q:"¿Qué haces?",o:[
["Reconocer un asma casi fatal: O₂ alto flujo, avisar urgente para UCI y tratamiento adicional según indicación, y preparar vía aérea","f2",1,"El silencio torácico con somnolencia es un signo de gravedad extrema."],
["Esperar a ver si mejora con el sueño","f3",0,"Es un signo de agotamiento respiratorio."],
["Repetir el sedante para que descanse","f3",0,"Agrava la hipoventilación."]]},
d:{x:"Tras el alta precoz regresa a las 6 horas con disnea severa.",v:"Sat 88% · FR 30 · FC 125",q:"¿Qué haces?",o:[
["Reiniciar tratamiento, dar O₂, avisar para hospitalización y reforzar la educación","f2",1,"Se corrige la decisión previa."],
["Indicar espaciador y repetir el alta con control en 24 horas","f3",0,"La recaída temprana exige hospitalización."],
["Administrar antihistamínico y observar","f3",0,"No trata la obstrucción bronquial."]]},
f1:{e:"g",x:"Mejora con tratamiento y sale con plan de acción por escrito y control médico."},
f2:{e:"m",x:"Requiere UCI y ventilación, con recuperación."},
f3:{e:"b",x:"Insuficiencia respiratoria con paro. No se recupera."}}},

{t:"Reposición de potasio",l:"Intrahospitalario · Medicina",g:"Procedimientos / medicación",n:{
a:{x:"Mujer de 70 años con debilidad y calambres por diarrea prolongada. K⁺ 2,8 mEq/L. La orden médica dice: KCl 40 mEq en 100 mL por vía periférica, a pasar en 30 minutos.",v:"PA 118/70 · FC 96 · K⁺ 2,8 · monitor disponible",q:"¿Qué haces?",o:[
["Consultar al médico la concentración y la velocidad antes de administrar, y preparar la reposición según el protocolo de potasio, con monitorización","b",2,"La velocidad indicada supera el límite habitual por vía periférica; se verifica antes de administrar."],
["Administrar según la orden escrita, ya que la indicación proviene del médico","c",0,"Ante una orden insegura la enfermera verifica; el potasio rápido puede causar arritmias fatales."],
["Diluir en 50 mL y pasarlo en 15 minutos para acortar el tiempo de la paciente","c",0,"Aumenta aún más la concentración y la velocidad."]]},
b:{x:"El médico corrige la indicación: dilución menor y pasar en 2 horas. A la hora, la paciente refiere dolor y quemazón en el sitio de venopunción, con enrojecimiento.",v:"PA 120/72 · FC 88",q:"¿Qué haces?",o:[
["Detener la infusión, revisar el sitio, retirar o rotar la vía, evaluar flebitis o extravasación, avisar y registrar el evento","f1",2,"El potasio es irritante vascular; se maneja el sitio y se notifica."],
["Continuar la infusión porque el dolor es esperable con potasio y avisar al terminar","f2",1,"El dolor es un signo de alarma; seguir puede dañar el tejido."],
["Aplicar calor local y enlentecer la infusión sin revisar la vía","f2",1,"No se verifica si hay extravasación."]]},
c:{x:"A los 10 minutos la paciente refiere dolor intenso en el brazo y palpitaciones. El monitor muestra bradicardia con alteraciones del ST-T.",v:"PA 94/56 · FC 44",q:"¿Qué haces?",o:[
["Detener la infusión de inmediato, avisar, realizar ECG, mantener monitor y actuar según indicación médica y protocolo de hiperkalemia iatrogénica","f2",1,"Se interrumpe la causa y se trata la arritmia."],
["Disminuir la velocidad a la mitad y observar","f3",0,"Una arritmia exige detener la infusión."],
["Administrar un antiemético por el malestar y reevaluar en 30 minutos","f3",0,"No se aborda la causa."]]},
f1:{e:"g",x:"Se corrige el potasio sin eventos. Se registra el incidente de la vía y se refuerza la verificación de concentraciones."},
f2:{e:"m",x:"Se produce flebitis o daño local; se corrige el potasio con retraso."},
f3:{e:"b",x:"Evoluciona a arritmia grave y paro. Se notifica el evento adverso."}}},

{t:"Escalofríos durante una transfusión",l:"Intrahospitalario · Medicina",g:"Procedimientos / transfusión",n:{
a:{x:"Hombre de 64 años recibe un concentrado de glóbulos rojos por anemia. A los 15 minutos presenta escalofríos, dolor lumbar y sensación de angustia.",v:"PA 92/54 · FC 118 · T 38,6 °C · Sat 95%",q:"¿Qué haces?",o:[
["Detener la transfusión, mantener la vía con suero fisiológico, verificar identidad del paciente y de la unidad y avisar de inmediato","b",2,"Es una posible reacción transfusional aguda; se detiene y se verifica."],
["Disminuir la velocidad de la transfusión y administrar paracetamol","c",0,"Seguir transfundiendo ante una reacción puede ser mortal."],
["Continuar la transfusión mientras se espera que el médico llegue a evaluar","c",0,"El retraso agrava el cuadro."]]},
b:{x:"Se confirma sospecha de reacción hemolítica. Se detiene la transfusión. El paciente sigue hipotenso.",v:"PA 88/50 · FC 124 · orina oscura",q:"¿Qué sigue?",o:[
["Tomar muestras para estudio, devolver la unidad con los equipos al banco de sangre, vigilar diuresis y hemodinamia, y notificar a medicina transfusional","f1",2,"Se estudia la reacción y se protege el riñón."],
["Descartar la bolsa y registrar solo como fiebre","f2",1,"Se pierde la información para investigar la reacción."],
["Reiniciar la transfusión con otra unidad sin estudio previo","d",0,"Puede repetir la reacción."]]},
c:{x:"Pasan 20 minutos más: PA 70/40, dolor lumbar intenso y hematuria.",v:"PA 70/40 · FC 134 · T 39,2 °C",q:"¿Qué haces?",o:[
["Detener la transfusión, activar equipo, reposición de volumen y control de diuresis según indicación, y notificar a medicina transfusional","f2",1,"Se rescata el cuadro, con daño por la demora."],
["Aumentar la velocidad para completar la unidad","f3",0,"Agrava la hemólisis."],
["Esperar el término de la unidad antes de avisar","f3",0,"El retraso eleva el riesgo de falla renal y shock."]]},
d:{x:"En la segunda unidad reaparece la reacción con shock.",v:"PA 68/38 · FC 140",q:"¿Qué haces?",o:[
["Detener la transfusión, activar equipo, soporte hemodinámico y notificación inmediata","f2",1,"Se corrige tardíamente."],
["Continuar para no perder la unidad","f3",0,"No corresponde."],
["Dar antihistamínico y seguir observando","f3",0,"No trata una reacción hemolítica."]]},
f1:{e:"g",x:"Se contiene la reacción, se estudia y se evita daño renal. Se notifica y se documenta el evento."},
f2:{e:"m",x:"Se estabiliza con soporte y vigilancia renal estrecha."},
f3:{e:"b",x:"Evoluciona a shock y falla renal aguda con evolución grave."}}},

{t:"Control del adulto mayor en el CESFAM",l:"Extrahospitalario · APS",g:"Adulto mayor / EMPAM",n:{
a:{x:"Mujer de 75 años que vive sola llega a su control preventivo. Dejó de salir por miedo a caerse, olvida a veces sus medicamentos y refiere cansancio.",v:"PA 132/76 · IMC 21 · Timed Up and Go 16 s",q:"¿Cómo orientas el control?",o:[
["Aplicar la pauta de medicina preventiva del adulto mayor (funcionalidad, caídas, nutrición, cognición y ánimo), revisar medicamentos y definir un plan con derivaciones según resultados","b",2,"Valoración geriátrica integral con plan individual."],
["Explicarle que es normal por la edad y citarla en un año","c",0,"Se normaliza un riesgo de caída y de deterioro."],
["Medir solo presión y peso, y entregar los medicamentos del mes","c",0,"No se evalúan los riesgos."]]},
b:{x:"El equipo define plan de ejercicio, revisión de medicamentos y apoyo vecinal. A los 3 meses mejora; su hija pregunta cómo organizar los remedios.",v:"TUG 12 s · sin caídas",q:"¿Qué orientas?",o:[
["Pastillero o pauta escrita, revisar polifarmacia con el médico o químico farmacéutico y coordinar apoyo y seguimiento","f1",2,"Se mejora la adherencia y se reduce el riesgo."],
["Entregar todos los medicamentos juntos y que decida cuándo tomarlos","f2",1,"Aumenta el riesgo de errores."],
["Indicar que suspenda lo que le produce cansancio sin consultar","f3",0,"Puede descompensar enfermedades."]]},
c:{x:"Dos meses después sufre una caída en casa y consulta con dolor intenso en la cadera.",v:"PA 128/74 · FC 96",q:"¿Qué haces?",o:[
["Inmovilizar, analgesia indicada, avisar para radiografía y evaluación y coordinar con la red para su manejo posterior","f2",1,"Probable fractura de cadera; se maneja y se coordina."],
["Pedirle que camine para comprobar si puede apoyar","f3",0,"Puede agravar la fractura."],
["Indicar reposo y analgésico oral en su casa","f3",0,"No se descarta una fractura."]]},
f1:{e:"g",x:"Mantiene su autonomía y evita nuevas caídas con un plan de seguimiento."},
f2:{e:"m",x:"Se maneja con complicaciones y mayor dependencia."},
f3:{e:"b",x:"Sufre fractura grave y pierde autonomía de forma importante."}}},
