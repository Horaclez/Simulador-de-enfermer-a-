{t:"Paciente sin respuesta y sin pulso",l:"Intrahospitalario · Medicina",g:"Paro cardiorrespiratorio",n:{
a:{x:"Hombre de 72 años con insuficiencia renal encontrado sin respuesta en su cama. No respira y no hay pulso carotídeo. Los parches del monitor muestran una línea plana.",v:"Sin pulso · monitor: línea plana",q:"¿Qué haces?",o:[
["Pedir ayuda y el carro de paro, iniciar RCP de alta calidad, confirmar la línea plana en otra derivación y canalizar para adrenalina","b",2,"En ritmo no desfibrilable se comprime, se da adrenalina precoz y se buscan causas reversibles."],
["Desfibrilar de inmediato porque no hay actividad eléctrica","c",0,"La asistolia no es un ritmo desfibrilable."],
["Esperar al médico para confirmar el paro antes de comprimir","c",0,"La RCP no espera confirmación médica."]]},
b:{x:"Tras 2 minutos de RCP el monitor muestra actividad eléctrica organizada sin pulso. El potasio de ayer era 6,9 mEq/L.",v:"Actividad eléctrica sin pulso · K⁺ 6,9",q:"¿Cómo continúas?",o:[
["Continuar compresiones con pocas interrupciones, adrenalina cada 3-5 minutos y avisar de la posible hiperkalemia para calcio y otras medidas","f1",2,"Se mantiene la RCP y se tratan las causas reversibles."],
["Interrumpir 20 segundos cada minuto para palpar el pulso y reevaluar el ritmo","f2",1,"Las pausas largas reducen la perfusión coronaria y cerebral."],
["Desfibrilar porque el ritmo ahora es organizado","c",0,"Un ritmo organizado sin pulso no se desfibrila."]]},
c:{x:"Pasan 5 minutos sin compresiones efectivas. El paciente sigue sin pulso.",v:"Sin pulso",q:"¿Qué haces?",o:[
["Iniciar RCP inmediata, adrenalina según indicación, vía aérea y búsqueda de causas reversibles con el equipo","f2",1,"Se retoma el manejo, con pérdida de tiempo crítica."],
["Continuar esperando al equipo médico","f3",0,"Cada minuto sin RCP reduce la supervivencia."],
["Desfibrilar y observar","f3",0,"No hay indicación de descarga en este ritmo."]]},
f1:{e:"g",x:"Recupera la circulación espontánea tras corregir la hiperkalemia y pasa a UCI con soporte."},
f2:{e:"m",x:"Recupera circulación con demora y secuelas neurológicas posibles."},
f3:{e:"b",x:"No se logra recuperar la circulación. Fallece."}}},

{t:"Cólico lumbar con fiebre",l:"Intrahospitalario · Urgencia",g:"Renal / sepsis urinaria",n:{
a:{x:"Hombre de 45 años con dolor lumbar cólico derecho desde ayer, fiebre y escalofríos. Antecedente de litiasis renal.",v:"PA 100/60 · FC 118 · T 39,2 °C · Sat 96%",q:"¿Qué haces primero?",o:[
["Monitorizar, canalizar, tomar hemocultivos y urocultivo, iniciar volumen y antibiótico precoz según indicación y avisar para imagen y urología","b",2,"Cólico con fiebre es una obstrucción infectada: sepsis y urgencia urológica."],
["Administrar un AINE EV para el dolor y dar el alta si cede","c",0,"No se trata la infección ni la obstrucción, y el AINE puede dañar el riñón."],
["Indicar analgesia y esperar el resultado del urocultivo antes de iniciar el antibiótico","c",0,"Se retrasa el antibiótico en un paciente con sepsis."]]},
b:{x:"La ecografía muestra hidronefrosis con un cálculo. Se indica drenaje urgente de la vía urinaria.",v:"PA 104/62 · FC 108 · T 38,6 °C",q:"¿Cómo preparas al paciente?",o:[
["Mantener la monitorización, ayuno, antibiótico y volumen, controlar la diuresis, y completar la información y el consentimiento informado","f1",2,"Se prepara de forma segura, con consentimiento según la Ley 20.584."],
["Retirar la vía y suspender el antibiótico hasta llegar a pabellón","f2",1,"Pierde el acceso y la cobertura antibiótica."],
["Darle el alta con analgesia y control en urología la próxima semana","d",0,"La obstrucción infectada requiere drenaje urgente."]]},
c:{x:"Horas después: PA 78/44, oliguria y confusión.",v:"PA 78/44 · FC 136 · diuresis 8 mL/h",q:"¿Qué haces?",o:[
["Activar equipo, volumen y vasopresor según indicación, antibiótico inmediato y gestionar el drenaje urgente","f2",1,"Shock séptico de foco urinario: se estabiliza y se drena."],
["Administrar más AINE por el dolor lumbar","f3",0,"Empeora la función renal."],
["Esperar el urocultivo antes de nuevas medidas","f3",0,"El shock exige actuar ya."]]},
d:{x:"Vuelve a las 12 horas con hipotensión y fiebre alta.",v:"PA 82/48 · T 39,5 °C",q:"¿Qué haces?",o:[
["Reingresar, tomar cultivos, iniciar volumen y antibiótico y avisar a urología para drenaje urgente","f2",1,"Se corrige la decisión inicial."],
["Entregar antipiréticos y volver a darlo de alta","f3",0,"Se repite el error."],
["Indicar hidratación oral y control ambulatorio","f3",0,"No se resuelve la obstrucción."]]},
f1:{e:"g",x:"Se drena la vía urinaria a tiempo y la sepsis cede. Se programa tratamiento definitivo de la litiasis."},
f2:{e:"m",x:"Se estabiliza con drenaje tardío y estancia en UCI."},
f3:{e:"b",x:"Evoluciona a shock séptico refractario y falla renal. Fallece."}}},

{t:"Cefalea y confusión con presión muy alta",l:"Intrahospitalario · Urgencia",g:"Hipertensión / emergencia hipertensiva",n:{
a:{x:"Mujer de 59 años hipertensa que abandonó sus medicamentos. Cefalea intensa, confusión, vómitos y visión borrosa.",v:"PA 232/130 · FC 92 · Sat 97% · Glasgow 13",q:"¿Qué haces?",o:[
["Monitorizar, canalizar, reposo con cabecera elevada y avisar de inmediato para un antihipertensivo EV titulable con descenso gradual y vigilancia neurológica","b",2,"Es una emergencia hipertensiva con daño cerebral: el descenso es controlado y gradual."],
["Administrar nifedipino sublingual para bajar la presión en pocos minutos","d",0,"Un descenso rápido e incontrolado puede causar isquemia cerebral o coronaria."],
["Indicar reposo y retomar su medicamento oral habitual con control en 24 horas","c",0,"Hay daño neurológico agudo: requiere tratamiento EV y monitorización."]]},
b:{x:"Con la infusión indicada, a la hora la PA es 190/108 y la cefalea disminuye.",v:"PA 190/108 · FC 84 · Glasgow 14",q:"¿Qué priorizas?",o:[
["Descenso gradual según la meta indicada, neurovigilancia, monitor, control de diuresis y búsqueda de daño en otros órganos","f1",2,"El control gradual protege la perfusión cerebral y detecta daño asociado."],
["Aumentar la infusión para llegar a 120/80 en 30 minutos","d",0,"Un descenso brusco reduce la perfusión cerebral."],
["Suspender el monitor porque ya está mejor","f2",1,"Persiste riesgo de deterioro y de daño de órgano blanco."]]},
c:{x:"A las pocas horas presenta una convulsión y queda somnolienta.",v:"PA 224/128 · FC 110 · Glasgow 9",q:"¿Qué haces?",o:[
["Proteger la vía aérea en posición lateral, dar O₂, avisar de inmediato, tratar la convulsión según indicación y controlar la PA de forma gradual","f2",1,"Se maneja la convulsión y se retoma el control de la PA."],
["Contenerla físicamente hasta que termine","f3",0,"Puede causar lesiones y no soluciona la causa."],
["Esperar sin intervenir porque las convulsiones suelen ceder solas","f3",0,"El cuadro grave requiere tratamiento inmediato."]]},
d:{x:"Tras el descenso brusco de la presión, queda somnolienta y con debilidad en un lado del cuerpo.",v:"PA 110/58 · FC 70 · Glasgow 10",q:"¿Qué haces?",o:[
["Suspender el antihipertensivo, avisar de inmediato, mantener decúbito, y ajustar la presión con el médico con neurovigilancia","f2",1,"Se corrige el descenso excesivo."],
["Seguir bajando la presión para completar el esquema","f3",0,"Agrava la isquemia."],
["Observar sin avisar para no alarmar","f3",0,"Es un déficit neurológico agudo."]]},
f1:{e:"g",x:"La PA desciende en 24 horas sin daño neurológico. Se reinicia el tratamiento oral y se reincorpora al Programa de Salud Cardiovascular."},
f2:{e:"m",x:"Se estabiliza con secuelas neurológicas leves y mayor tiempo de hospitalización."},
f3:{e:"b",x:"Evoluciona a un ACV o edema cerebral grave con mal pronóstico."}}},

{t:"Caída en bicicleta sin casco",l:"Intrahospitalario · Urgencia",g:"Traumatismo / TEC",n:{
a:{x:"Hombre de 24 años que cae de su bicicleta sin casco. Perdió el conocimiento por un minuto y ahora está confuso, con vómitos.",v:"PA 134/78 · FC 62 · FR 16 · Sat 97% · Glasgow 13",q:"¿Qué haces?",o:[
["Mantener la inmovilización cervical, evaluar ABCDE, Glasgow y pupilas, monitorizar y avisar para TAC urgente","b",2,"Hay riesgo de lesión cervical y de sangrado intracraneal."],
["Retirar el collar para que esté cómodo y mandarlo a casa con un familiar","c",0,"Se descarta de forma prematura una lesión grave."],
["Sedarlo suavemente por la agitación y observarlo en sala","c",0,"La sedación oculta la evolución neurológica."]]},

{t:"Piel fría y poca orina tras un infarto",l:"Intrahospitalario · UCI",x:"Hombre de 66 años, 3 días después de un infarto anterior. Está pálido, sudoroso y con respiración agitada. Orina muy poco.",

c:[["Monitorizar, O₂ o soporte respiratorio según indicación, evitar cargas de volumen, avisar urgente por inotrópico o vasopresor y evaluación en UCI",2,"En shock cardiogénico el volumen empeora la congestión."],["Administrar un bolo de 2 L de cristaloides para subir la presión",0,"Agrava el edema pulmonar y la falla del corazón."],["Administrar nitroglicerina y furosemida en dosis altas sin avisar de la presión",1,"La hipotensión contraindica los vasodilatadores y diuréticos en dosis altas."]]},

{t:"Sangrado vaginal en el tercer trimestre",l:"Intrahospitalario · Urgencia obstétrica",x:"Embarazada de 34 semanas con sangrado vaginal rojo vivo y abundante, sin dolor, que comenzó hace una hora.",
a:[["Signos vitales","PA 112/70 · FC 98 · FR 18 · Sat 98%"],["Anamnesis","Sin traumatismo; cesárea previa; sin contracciones; movimientos fetales presentes"],["Palpación uterina","Útero blando y relajado, sin dolor ni hipertonía"],["Latidos cardiofetales","148 por minuto, sin desaceleraciones"],["Ecografía obstétrica","Placenta que cubre el orificio cervical interno"],["Tacto vaginal","Tras el tacto el sangrado aumenta de forma importante y baja la presión"],["Glicemia capilar","92 mg/dL"]],

w:"Sangrado indoloro y rojo vivo, con útero blando, latidos fetales normales y una placenta que cubre el orificio cervical, confirman una placenta previa. El desprendimiento suele ser doloroso con útero hipertónico; el tacto vaginal puede causar una hemorragia masiva.",
c:[["Reposo, monitoreo materno-fetal, dos vías, pruebas cruzadas, evitar el tacto vaginal y avisar de inmediato para evaluación obstétrica y traslado a un centro con neonatología",2,"Se protege a la madre y al feto sin provocar más sangrado."],["Indicar reposo y observar en sala común con controles cada 4 horas",1,"El monitoreo es insuficiente para un sangrado activo."],["Realizar un tacto vaginal para evaluar la dilatación antes de la ecografía",0,"Puede provocar una hemorragia masiva."]]},

{t:"Tos perruna y ruido al respirar",l:"Intrahospitalario · Urgencia pediátrica",x:"Niño de 2 años con 2 días de coriza. Esta noche despierta con tos perruna y un ruido al respirar.",
a:[["Signos vitales","T 38,2 °C · FC 140 · FR 36 · Sat 94%"],["Anamnesis","Tos perruna, voz ronca, estridor al llorar; sin babeo ni dificultad para tragar; vacunas al día"],["Examen respiratorio","Estridor inspiratorio al llorar, retracción leve; sin sibilancias"],["Aspecto general","Alerta, juega, sin aspecto tóxico, tolera su saliva"],["Radiografía de cuello","Estrechamiento subglótico (signo de la aguja)"],["Examen de la garganta con bajalenguas","Se agita, aumenta el estridor y aparece cianosis"],["Glicemia capilar","96 mg/dL"]],

w:"Tos perruna, voz ronca y estridor tras un cuadro viral, con aspecto no tóxico, sin babeo y con estrechamiento subglótico, indican crup. Examinar la garganta con bajalenguas puede desencadenar una obstrucción, por eso no se hace.",
c:[["Mantenerlo tranquilo en brazos de sus padres, dar O₂ si desatura, avisar al médico para corticoide o adrenalina nebulizada según gravedad y vigilar el estridor y la saturación",2,"El llanto empeora el estridor; se trata la inflamación."],["Nebulizar salbutamol cada 20 minutos y observar",1,"No trata la obstrucción subglótica."],["Examinar la garganta con bajalenguas y separarlo de sus padres para evaluarlo",0,"Agita al niño y puede obstruir la vía aérea."]]},

{t:"Dolor lumbar súbito e hipotensión",l:"Intrahospitalario · Urgencia",x:"Hombre de 72 años, hipertenso y fumador, con dolor abdominal y lumbar súbito e intenso. Está pálido y mareado.",
a:[["Signos vitales","PA 80/50 · FC 120 · FR 24 · Sat 95% · T 36,4 °C"],["Examen abdominal","Dolor abdominal difuso y una masa pulsátil por encima del ombligo"],["Anamnesis","Dolor de inicio brusco hace 1 hora, hipertensión y tabaquismo; sin traumatismo ni vómitos con sangre"],["Ecografía abdominal","Aneurisma de aorta de 7 cm con líquido retroperitoneal"],["ECG","Taquicardia sinusal sin supradesnivel"],["Examen de orina","Sin hallazgos"],["Glicemia capilar","110 mg/dL"]],

{t:"Dolor que se mueve hacia el lado derecho",l:"Intrahospitalario · Urgencia",x:"Joven de 19 años con dolor abdominal que comenzó alrededor del ombligo y hoy se localiza en el lado derecho, con náuseas y falta de apetito.",
a:[["Signos vitales","PA 118/72 · FC 100 · FR 18 · T 38,1 °C · Sat 98%"],["Anamnesis","Dolor desde ayer, migró al lado derecho; sin diarrea, sin síntomas urinarios"],["Examen abdominal","Dolor en el punto de McBurney, rebote positivo, defensa localizada"],["Laboratorio","Leucocitos 15.500 con neutrofilia y PCR elevada"],["Ecografía abdominal","Apéndice de 10 mm no compresible con líquido periapendicular"],["Examen de orina","Sin hallazgos"],["Glicemia capilar","96 mg/dL"]],

var PC=["IAM con SDST, patología GES. ECG en menos de 10 min, activar la red de reperfusión (angioplastia o trombolisis según la garantía de oportunidad), traslado con SAMU 131, registro de tiempos y derivación posterior a rehabilitación cardiaca y Programa de Salud Cardiovascular.", "Sepsis y shock séptico, emergencia tiempo-dependiente (lineamientos Surviving Sepsis adoptados en protocolos locales). Paquete de la primera hora: cultivos, lactato, antibiótico y volumen; reevaluación de perfusión y registro en ficha.", "ACV isquémico, patología GES en personas de 15 años y más. Código ACV, TAC urgente, trombolisis dentro de la ventana según criterios, evaluación de la deglución, rehabilitación y control en el Programa de Salud Cardiovascular.", "Exacerbación de EPOC; GES EPOC de tratamiento ambulatorio y Programa ERA en APS. O₂ con meta de 88–92%, ventilación no invasiva según gasometría, vacunación contra influenza y neumococo, educación en inhaladores y control en sala ERA.", "Hiperkalemia en ERC; GES insuficiencia renal crónica terminal. Monitorización ECG, tratamiento escalonado, diálisis urgente, coordinación con el centro de diálisis y educación sobre adherencia y dieta.", "Hemorragia digestiva variceal en cirrosis, emergencia. Seguir el protocolo local de hemorragia digestiva, endoscopía precoz, profilaxis antibiótica, hemoderivados con meta restrictiva y derivación a hepatología y a apoyo por consumo problemático de alcohol.", "Reacción adversa grave a medicamento (anafilaxia). Adrenalina IM precoz, observación prolongada, registro de la alergia en la ficha y notificación de la reacción adversa al Instituto de Salud Pública (farmacovigilancia).", "Insuficiencia cardiaca aguda con edema pulmonar. Monitorización, balance hídrico, búsqueda de la causa, educación (peso diario, sal, adherencia) y control posterior en el Programa de Salud Cardiovascular.", "Descompensación hiperglicémica en DM2; GES diabetes mellitus tipo 2. Hidratación, potasio e insulina según protocolo, búsqueda de infección, educación y control en el Programa de Salud Cardiovascular.", "ACV hemorrágico, emergencia neuroquirúrgica. TAC urgente, control gradual de la PA, neurovigilancia y evaluación por neurocirugía y UCI. La hemorragia subaracnoidea por aneurisma tiene cobertura GES.", "Trauma torácico con neumotórax a tensión. Secuencia XABCDE (PHTLS/ATLS), coordinación con SAMU 131, descompresión y drenaje pleural, registro de tiempos y traslado a centro de trauma.", "Caída intrahospitalaria con hipotensión ortostática. Registro y notificación del evento adverso (estándares de acreditación de la Superintendencia de Salud), evaluación del riesgo de caídas, revisión de fármacos e información a la paciente y su familia según la Ley 20.584.", "Hipertensión arterial y dislipidemia; GES hipertensión arterial primaria. Programa de Salud Cardiovascular, estratificación del riesgo cardiovascular, meta de PA según la guía MINSAL, controles periódicos, educación y cesación tabáquica.", "Cetoacidosis diabética en DM1; GES diabetes mellitus tipo 1. Protocolo de CAD (volumen, insulina en infusión, potasio), control horario de glicemia, educación sobre días de enfermedad y control en policlínico de diabetes.", "Úlcera de pie diabético. Valoración y curación avanzada según la guía MINSAL de prevención de amputación en diabetes, descarga de presión, podología y control glicémico en el Programa de Salud Cardiovascular.", "Trauma raquimedular con shock neurogénico. Inmovilización espinal, SAMU 131, traslado a centro con neurocirugía, control neurológico seriado y registro de tiempos; rehabilitación posterior.", "Encefalopatía hepática por descompensación de cirrosis. Lactulosa, búsqueda del desencadenante, evitar sedantes, control en hepatología y apoyo por consumo problemático de alcohol.", "Preeclampsia con criterios de gravedad (Guía Perinatal MINSAL). Sulfato de magnesio con vigilancia de toxicidad, control de PA, derivación a centro de mayor complejidad, decisión de interrupción del embarazo y control puerperal.", "Infección respiratoria aguda baja del lactante; Programa IRA y GES IRA baja en menores de 5 años. Criterios de hospitalización, kinesioterapia respiratoria, educación a la familia, vacunación al día y control en sala IRA.", "Enfermedad diarreica aguda con deshidratación. Planes de hidratación A, B y C, signos de alarma, educación (SRO, lavado de manos), control pediátrico en APS y notificación si hay brote.", "Incidente con múltiples víctimas. Método START, coordinación con SAMU 131 y la red, mando del incidente, categorización ESI (C1–C5) al ingreso a urgencia y reevaluación continua.", "Lesión renal aguda prerrenal. Reposición de volumen, suspensión de nefrotóxicos, control de creatinina y potasio, educación sobre AINE y reevaluación de fármacos en APS.", "Tromboembolismo pulmonar postquirúrgico. Estratificación de riesgo, anticoagulación, vigilancia de sangrado, profilaxis tromboembólica según protocolo del servicio y seguimiento ambulatorio.", "Crisis asmática grave; Programa ERA. Tratamiento escalonado, plan de acción escrito, educación en aerocámara y control de desencadenantes, con seguimiento en sala ERA.", "Error de medicación evitable (potasio EV). Verificar concentración y velocidad máximas según protocolo, notificar eventos adversos y los cuasi incidentes en el sistema de seguridad del paciente, y registrar en ficha.", "Reacción transfusional aguda. Detener la transfusión, mantener la vía, verificar identidad, devolver la unidad al banco de sangre, notificar a medicina transfusional y registrar el evento adverso.", "Control preventivo del adulto mayor (EMPAM) en APS. Pauta de funcionalidad, riesgo de caídas, nutrición, cognición y ánimo; plan individual, revisión de polifarmacia y derivación según resultados."],PD=["Insuficiencia cardiaca aguda descompensada. Monitorización, diurético y vasodilatador según indicación, búsqueda de la causa, educación sobre adherencia y control en el Programa de Salud Cardiovascular.", "Síndrome aórtico agudo (disección). Control de PA y FC bajo indicación, estudio por imagen urgente, traslado a centro con cirugía cardiovascular mediante SAMU 131 y registro de tiempos.", "Hipoglucemia severa en diabetes; GES diabetes. Glucosa EV, observación por el efecto de la sulfonilurea, revisión del esquema, educación al paciente y la familia y control en el Programa de Salud Cardiovascular.", "Hemorragia posparto (Guía Perinatal MINSAL). Manejo activo del alumbramiento, masaje uterino, uterotónicos, hemoderivados, registro de pérdidas y vigilancia en el puerperio inmediato.", "Colangitis aguda con sepsis. Antibiótico, volumen y drenaje biliar urgente, hemocultivos, derivación a cirugía y gastroenterología y seguimiento para colecistectomía diferida.", "Hematoma subdural en paciente anticoagulado. Neurovigilancia, reversión de la anticoagulación según indicación, neurocirugía, revisión del control de anticoagulación oral y educación sobre prevención de caídas.", "Embarazo ectópico roto. Atención urgente según protocolos de ginecología y obstetricia y la Guía Perinatal MINSAL, pabellón de urgencia, reposición, pruebas cruzadas y seguimiento posterior.", "Sepsis meningocócica, enfermedad de notificación obligatoria inmediata. Aislamiento de gotitas, antibiótico precoz, notificación a la autoridad sanitaria y quimioprofilaxis de contactos según norma.", "Neumonía adquirida en la comunidad grave (GES NAC ambulatoria en mayores de 65 años solo para los casos leves). Evaluar gravedad, O₂, hemocultivos, antibiótico precoz, hospitalización, vacunación y seguimiento."];
var DC=[["Obstrucción aguda de una arteria coronaria por un trombo sobre una placa, con necrosis del miocardio; el ECG muestra supradesnivel del ST.", "La reperfusión precoz (angioplastia o trombolisis) salva músculo: cada minuto de demora aumenta el daño. El AAS reduce la agregación plaquetaria; los nitratos se evitan con hipotensión o infarto del ventrículo derecho."], ["Disfunción orgánica causada por una respuesta desregulada a una infección; el shock séptico es sepsis con hipotensión persistente y lactato elevado pese al volumen.", "El antibiótico y el volumen precoces mejoran la supervivencia; el vasopresor se usa cuando la presión no responde al volumen, y el exceso de líquidos puede causar edema pulmonar."], ["Interrupción del flujo sanguíneo a una zona del cerebro por obstrucción arterial, con déficit neurológico súbito.", "El tiempo define el tejido salvable: por eso se registra la hora de inicio y se hace TAC. La PA se tolera alta para mantener la perfusión de la zona en riesgo y se deja en ayunas por riesgo de aspiración."], ["Enfermedad pulmonar con obstrucción crónica al flujo aéreo; la exacerbación es un empeoramiento agudo de la tos, la disnea o la expectoración.", "En pacientes que retienen CO₂ el exceso de oxígeno puede empeorar la hipercapnia, por eso se titula la meta de 88–92%. Broncodilatadores, corticoide y VNI tratan la obstrucción y la fatiga."], ["Potasio sérico elevado (sobre unos 5,5 mEq/L), frecuente en insuficiencia renal, que puede causar arritmias fatales.", "El calcio estabiliza la membrana del miocardio de inmediato; la insulina con glucosa y el salbutamol llevan el potasio al interior de la célula, y la diálisis lo elimina."], ["Sangrado de várices esofágicas por hipertensión portal en la cirrosis.", "El exceso de volumen o de sangre eleva la presión portal y favorece el resangrado, por eso la meta de transfusión es restrictiva. El vasoactivo y la endoscopía controlan el sangrado y el antibiótico previene infecciones."], ["Reacción de hipersensibilidad sistémica grave, de inicio rápido, con compromiso de vía aérea, respiración o circulación.", "La adrenalina IM revierte la vasodilatación y el broncoespasmo; antihistamínicos y corticoides no salvan la vida. Se acuesta con piernas elevadas por la hipotensión y se observa por riesgo de reacción bifásica."], ["Acumulación de líquido en los alvéolos por falla del corazón izquierdo, con disnea intensa e hipoxemia.", "Sentarlo reduce el retorno venoso y mejora la mecánica respiratoria; el diurético y el vasodilatador descargan al corazón. El volumen o el decúbito empeoran el cuadro."], ["Complicación de la DM2 con hiperglicemia extrema, deshidratación y aumento de la osmolaridad, sin cetoacidosis importante.", "La deshidratación es el problema central, por eso se parte con volumen. La insulina con potasio bajo puede causar arritmias, por lo que se repone el potasio antes."], ["Sangrado dentro del cerebro por rotura de un vaso, habitualmente por hipertensión.", "A diferencia del isquémico, la PA alta puede ampliar el hematoma, por eso se baja de forma gradual; un descenso brusco causa isquemia. Los antiagregantes están contraindicados."], ["Aire en el espacio pleural que, a tensión, comprime pulmón y corazón y produce shock obstructivo.", "Es un diagnóstico clínico y mortal si se espera una radiografía: la descompresión inmediata devuelve el retorno venoso. La ventilación a presión positiva sin descompresión lo agrava."], ["Descenso de la presión al ponerse de pie (hipotensión ortostática), frecuente con antihipertensivos en adultos mayores, que causa mareo y caídas.", "Tras una caída se evalúa antes de movilizar por riesgo de fractura o lesión cervical; se corrige la causa (fármaco, hidratación) y se previenen nuevas caídas."], ["La HTA es una presión sostenida sobre 140/90 mmHg y la dislipidemia un aumento de lípidos en sangre; ambas elevan el riesgo cardiovascular.", "El riesgo se maneja con adherencia, estilo de vida y tratamiento; la tos por IECA es un efecto adverso frecuente que, si no se detecta, provoca abandono del fármaco."], ["Complicación de la DM1 por déficit de insulina: hiperglicemia, cetosis y acidosis metabólica.", "Se repone volumen primero y la insulina se da en infusión con potasio controlado; el bolo de insulina o el bicarbonato rutinario pueden empeorar la hipokalemia y la hipotensión."], ["Lesión de la piel del pie en una persona con diabetes, por neuropatía y mala circulación, con alto riesgo de infección y amputación.", "La descarga de presión es lo que permite cicatrizar; el remojo macera la piel y los antisépticos irritantes dañan el tejido. La infección con signos sistémicos requiere derivación urgente."], ["Hipotensión con bradicardia por lesión de la médula alta, que pierde el tono simpático (vasodilatación).", "Se inmoviliza la columna para no agravar la lesión; el exceso de cristaloides no corrige la vasoplejía y causa edema pulmonar, por lo que se usa vasopresor y volumen limitado."], ["Alteración neuropsiquiátrica de la cirrosis por acumulación de toxinas (amoníaco) que el hígado no depura.", "La lactulosa disminuye la absorción de amoníaco; los sedantes y las benzodiacepinas empeoran la encefalopatía. Siempre se busca el desencadenante (infección, sangrado, estreñimiento)."], ["Hipertensión del embarazo con daño de órganos (proteinuria, cefalea, alteraciones visuales o hepáticas); la eclampsia agrega convulsiones.", "El sulfato de magnesio previene y trata las convulsiones, pero puede intoxicar, por eso se vigilan reflejos, frecuencia respiratoria y diuresis. El antihipertensivo protege del accidente cerebrovascular."], ["Infección viral de las vías aéreas pequeñas del lactante (frecuente por VRS), con sibilancias y dificultad respiratoria.", "El manejo es de soporte: desobstruir la nariz, dar oxígeno y alimentar en fracciones. Broncodilatadores y corticoides no tienen beneficio claro y los sedantes deprimen la respiración."], ["Pérdida de agua y electrolitos por diarrea y vómitos, que en niños puede progresar a shock.", "La rehidratación oral fraccionada es la primera línea; los jugos y bebidas isotónicas empeoran la diarrea y el ayuno prolongado causa hipoglucemia. El shock requiere volumen EV inmediato."], ["Clasificación de víctimas según prioridad cuando los recursos son menores que la demanda (rojo, amarillo, verde y negro).", "Se prioriza por fisiología y no por lo llamativo de la lesión; no se gastan recursos en pacientes sin posibilidad inmediata y se reevalúa porque el estado cambia."], ["Descenso agudo de la función renal; el tipo prerrenal se debe a hipoperfusión, por ejemplo por deshidratación o fármacos.", "Restringir líquidos o dar diuréticos en hipovolemia empeora el daño; se repone volumen y se suspenden los AINE, IECA y diuréticos que reducen la perfusión renal."], ["Obstrucción de arterias pulmonares por un trombo, generalmente de las venas de las piernas, común tras cirugías o inmovilización.", "La anticoagulación evita que el coágulo crezca; masajear la pierna puede liberar el trombo y el exceso de volumen sobrecarga el ventrículo derecho."], ["Enfermedad inflamatoria de las vías aéreas con crisis de obstrucción reversible y sibilancias.", "El salbutamol repetido y el ipratropio dilatan los bronquios y el corticoide sistémico controla la inflamación; los sedantes deprimen la respiración y un tórax silente es un signo de gravedad extrema."], ["El potasio EV concentrado es un medicamento de alto riesgo que puede provocar arritmias y paro si se administra rápido.", "Existen límites de concentración y velocidad por vía periférica; la enfermera verifica una orden insegura antes de administrarla, y el dolor en la vena puede indicar flebitis o extravasación."], ["Reacción inmune del receptor frente a glóbulos rojos incompatibles, con hemólisis, fiebre, dolor lumbar y shock.", "Detener la transfusión limita el daño; se mantiene la vía, se verifica la identidad y se devuelve la unidad al banco de sangre para investigar. Seguir transfundiendo puede ser mortal."], ["Evaluación preventiva del adulto mayor (funcionalidad, riesgo de caídas, nutrición, cognición y ánimo) para detectar fragilidad.", "Normalizar el cansancio o el miedo a caer retrasa intervenciones que previenen fracturas y dependencia; la polifarmacia es una causa frecuente de caídas y confusión."]],DD=[["Incapacidad del corazón para bombear con congestión pulmonar y sistémica (disnea, ortopnea, edema).", "La suspensión del diurético, la ortopnea y los crépitos bilaterales orientan a congestión; por eso se sienta al paciente y se descarga el corazón en vez de tratar como infección o asma."], ["Desgarro de la capa interna de la aorta que crea un falso lumen, con dolor desgarrante y diferencia de presión entre los brazos.", "Un tratamiento de infarto (AAS, heparina, trombolisis) puede ser letal; se controla la presión y la frecuencia cardiaca y se deriva a cirugía cardiovascular."], ["Glicemia baja (bajo unos 70 mg/dL) que puede causar confusión, déficit neurológico y convulsiones; es frecuente con insulina y sulfonilureas.", "Se mide la glicemia ante cualquier déficit neurológico, porque la hipoglucemia lo imita y es reversible; la sulfonilurea exige observación por riesgo de recaída."], ["Pérdida excesiva de sangre tras el parto, más frecuente por falta de contracción del útero (atonía).", "Se trata la causa con masaje uterino y uterotónicos mientras se repone volumen y sangre; esperar los exámenes antes de actuar sobre el útero aumenta la mortalidad."], ["Infección de la vía biliar por obstrucción (cálculo) que puede evolucionar a sepsis.", "El antibiótico y el volumen estabilizan, pero el tratamiento definitivo es drenar la vía biliar; el retraso aumenta la mortalidad."], ["Colección de sangre entre la duramadre y el cerebro, favorecida por caídas y anticoagulantes, que comprime el cerebro.", "El deterioro neurológico puede ser rápido: se mantiene neurovigilancia, se suspende la anticoagulación y se prepara su reversión; el hematoma puede requerir cirugía."], ["Implantación del embarazo fuera del útero (habitualmente en la trompa) que, al romperse, causa hemorragia interna.", "Retraso menstrual, dolor súbito y shock obligan a descartarlo: el tratamiento es quirúrgico y urgente, y la analgesia con alta puede costar la vida."], ["Infección grave por Neisseria meningitidis que causa sepsis y meningitis, con púrpura que no desaparece al presionar.", "El antibiótico precoz salva vidas; se aísla por gotitas y se notifica de inmediato para dar quimioprofilaxis a los contactos."], ["Infección del pulmón adquirida fuera del hospital, grave si hay confusión, frecuencia respiratoria alta, hipotensión o hipoxemia.", "La gravedad se evalúa con puntajes (por ejemplo CURB-65) para decidir hospitalización; el antibiótico precoz y el oxígeno mejoran el pronóstico."]],DP=[["Inserción de un catéter en una vena periférica para administrar líquidos o fármacos.", "Se evita el brazo con fístula para no dañarla; el antiséptico seco y la técnica aséptica previenen flebitis y bacteriemia; el torniquete prolongado causa hemoconcentración y no se reencapucha la aguja para evitar accidentes."], ["Cultivo de sangre para detectar bacterias en el torrente sanguíneo ante sospecha de sepsis.", "Se toman antes del antibiótico y de dos sitios distintos para distinguir infección de contaminación; la piel debe secar sin volver a palparla y los frascos no se refrigeran."], ["Retiro de secreciones de la vía aérea con una sonda y presión negativa cuando el paciente no puede eliminarlas.", "Se introduce sin aspirar para no dañar la mucosa y se aspira pocos segundos porque quita oxígeno; se reevalúa entre pasadas y se usa técnica estéril para evitar neumonía."], ["Administración de oxígeno suplementario para corregir la hipoxemia.", "Cada dispositivo tiene un rango de flujo; en pacientes que retienen CO₂ se busca una meta de saturación y no el 100%; el oxígeno favorece la combustión, por eso se prohíbe el fuego."], ["Limpieza y cobertura de una herida para favorecer la cicatrización y prevenir infección.", "Se limpia del centro a la periferia y con gasa nueva por pasada para no arrastrar gérmenes hacia la herida; los antisépticos irritantes dañan el tejido y el suero abierto se contamina."], ["Punción arterial para medir oxígeno, CO₂ y pH de la sangre.", "El test de Allen comprueba la circulación colateral antes de puncionar; la sangre sube por la presión arterial y las burbujas alteran el resultado; se comprime varios minutos para evitar hematoma."], ["Instalación de una sonda en la vejiga para drenar orina, con un balón de retención.", "El balón se infla solo cuando sale orina para no lesionar la uretra y con agua estéril; el circuito cerrado y la bolsa bajo la vejiga previenen la infección urinaria asociada a catéter."], ["Administración de un fármaco por vía venosa, de acción rápida y alto riesgo si hay errores.", "Los correctos (paciente, fármaco, dosis, vía, hora, alergias, registro) previenen errores; no se administra lo que no está rotulado, la velocidad es parte de la indicación y el registro es inmediato."]];
function pb(t,x,pr){return t?"<div class='card'>"+(x?"<b>"+(pr?"¿Qué es y cuándo se indica?":"Definición de la patología")+"</b><p>"+x[0]+"</p><b>"+(pr?"Por qué se hace así":"Por qué se actúa así")+"</b><p>"+x[1]+"</p>":"")+"<b>📋 Guías, normas y seguimiento (Chile)</b><p>"+t+"</p><p class='mu'>Referencia general basada en GES, guías y programas MINSAL a la fecha del diseño. Verifica la versión vigente del documento y el protocolo de tu establecimiento.</p></div>":""}
var P=[
{t:"Instalación de vía venosa periférica",l:"Procedimiento · Medicina",x:"Hombre de 58 años hospitalizado con indicación de hidratación EV. Tiene una fístula arteriovenosa en el brazo izquierdo.",
s:["Verificar la indicación e identificar al paciente con dos identificadores","Realizar higiene de manos, reunir el material y explicar el procedimiento","Elegir el sitio de punción en el brazo derecho y colocar el torniquete sobre la zona","Desinfectar la piel con antiséptico y dejar secar completamente","Puncionar con el bisel hacia arriba, observar el reflujo, avanzar el catéter y retirar el mandril","Soltar el torniquete, conectar el sistema, fijar con apósito transparente y rotular con fecha","Eliminar el corto-punzante en su contenedor, higiene de manos y registrar"],
e:[["Elegir el brazo con la fístula porque tiene las venas más visibles","La extremidad con fístula, mastectomía o lesión se protege; se evita puncionar."],["Palpar de nuevo la vena con el dedo sin guante después de desinfectar","Se contamina el sitio ya desinfectado; hay que mantener la asepsia."],["Reencapuchar la aguja con las dos manos tras retirarla","Es una causa frecuente de accidentes corto-punzantes; se elimina sin reencapuchar."],["Dejar el torniquete puesto varios minutos mientras se prepara el resto","El torniquete prolongado causa hemoconcentración y daño; se usa pocos instantes."]],
n:"Precauciones estándar y prevención de IAAS (Programa de Control de IAAS, MINSAL), identificación segura del paciente (estándares de acreditación), manejo de residuos corto-punzantes según el reglamento REAS (DS 6/2009) y registro en ficha clínica."},
{t:"Toma de hemocultivos",l:"Procedimiento · Urgencia",x:"Mujer de 74 años con fiebre y escalofríos, sospecha de sepsis. El médico indica dos sets de hemocultivos y antibiótico.",
s:["Verificar la orden, identificar a la paciente y preparar los frascos y el material","Realizar higiene de manos y desinfectar la tapa de cada frasco, dejándola secar","Desinfectar la piel del primer sitio y esperar el secado completo sin volver a palpar","Puncionar una vena periférica y obtener el volumen indicado para cada frasco","Repetir con un segundo sitio de punción distinto y otro set de frascos","Rotular cada frasco con datos de la paciente, sitio y hora, y enviarlo al laboratorio sin demora","Informar que ya se puede administrar el antibiótico indicado y registrar"],
e:[["Tomar los hemocultivos después de iniciar el antibiótico para no retrasar el tratamiento","Los cultivos se toman antes del antibiótico, sin retrasar el tratamiento más de lo necesario."],["Tomar ambos sets desde el mismo sitio de punción","Dos sitios distintos mejoran la distinción entre contaminación e infección verdadera."],["Refrigerar los frascos y enviarlos al día siguiente","Los frascos no se refrigeran; deben ir pronto al laboratorio a temperatura ambiente."],["Volver a palpar la vena con guante no estéril después de desinfectar","Se contamina el sitio y aumenta el riesgo de falso positivo."]],
n:"Programa de IAAS del MINSAL (asepsia y vigilancia de bacteriemia), protocolos de sepsis del establecimiento, norma de identificación y rotulado de muestras del laboratorio y registro en ficha."},
{t:"Aspiración de secreciones",l:"Procedimiento · Medicina",x:"Hombre de 80 años con secreciones audibles, tos débil y saturación en descenso. Se indica aspiración traqueobronquial.",
s:["Evaluar la necesidad (ruidos, saturación, esfuerzo), informar e identificar al paciente","Realizar higiene de manos, colocar mascarilla, protección ocular y guantes, y preparar el aspirador con presión adecuada","Hiperoxigenar brevemente al paciente según indicación","Introducir la sonda estéril sin aspirar hasta la profundidad necesaria","Aspirar con movimientos rotatorios al retirar, en pasadas breves","Reoxigenar, reevaluar saturación, frecuencia cardiaca y ruidos antes de repetir","Eliminar el material, higiene de manos y registrar las características de las secreciones"],
e:[["Aspirar de forma continua mientras se introduce la sonda","Aspirar al introducir daña la mucosa y extrae oxígeno."],["Mantener la aspiración 30 segundos para sacar todo de una vez","Las pasadas deben ser breves (unos 10-15 segundos) por el riesgo de hipoxia."],["Usar la misma sonda en la boca y luego volver a introducirla en la tráquea","Se contamina la vía aérea inferior; se usa material estéril."],["Aspirar a todos los pacientes cada hora de forma rutinaria","Se aspira según necesidad evaluada, no por horario."]],
n:"Precauciones estándar y prevención de neumonía asociada a ventilación mecánica (Programa de IAAS, MINSAL), técnica aséptica, monitorización de saturación y registro en ficha."},
{t:"Oxigenoterapia",l:"Procedimiento · Urgencia",x:"Paciente con EPOC y saturación de 84%. El médico indica oxígeno con meta de saturación entre 88% y 92%.",
s:["Verificar la indicación (dispositivo, flujo o FiO₂ y meta de saturación) e identificar al paciente","Realizar higiene de manos, reunir fuente de O₂, flujómetro y dispositivo, y explicar el procedimiento","Informar la prohibición de fuego y cigarrillo en el entorno por el riesgo de incendio","Conectar el flujómetro y ajustar el flujo indicado","Colocar el dispositivo, comprobar el ajuste y la comodidad del paciente","Monitorizar saturación y signos respiratorios y avisar si no alcanza la meta","Registrar dispositivo, flujo, saturación y hora"],
e:[["Iniciar con 15 L/min por cánula nasal para asegurar una saturación alta","La cánula nasal admite flujos bajos; en EPOC la hiperoxia puede causar hipercapnia."],["Ajustar el flujo hasta llegar a 100% de saturación","La meta es la indicada; saturar al máximo puede ser dañino."],["Permitir que un familiar fume en el pasillo si el paciente usa pocos litros","El oxígeno favorece la combustión: el riesgo existe con cualquier flujo."],["Omitir el registro del flujo y del dispositivo porque ya están en la indicación","Se registra lo realmente administrado y la respuesta del paciente."]],
n:"Programa ERA y GES EPOC (MINSAL), indicación de O₂ con metas de saturación, normas de seguridad de gases medicinales del establecimiento y registro en ficha."},
{t:"Curación de herida",l:"Procedimiento · APS",x:"Mujer de 52 años con herida quirúrgica abdominal con exudado moderado. Se indica curación diaria con suero fisiológico y apósito.",
s:["Verificar la indicación, valorar el dolor e identificar a la paciente","Realizar higiene de manos y preparar el campo con material estéril","Retirar el apósito previo con guantes limpios, observar el exudado y eliminarlo","Cambiar a guantes estériles tras higiene de manos","Limpiar con suero fisiológico desde el centro hacia la periferia con un solo movimiento por gasa","Valorar la herida y aplicar el apósito indicado","Fechar el apósito, eliminar residuos, higiene de manos y registrar"],
e:[["Limpiar desde los bordes hacia el centro de la herida","Se arrastran contaminantes hacia la zona más limpia; se limpia del centro a la periferia."],["Usar la misma gasa para pasar varias veces por la herida","Cada pasada exige una gasa nueva para no contaminar."],["Aplicar agua oxigenada de forma rutinaria en toda herida limpia","Los antisépticos irritantes dañan el tejido en cicatrización."],["Reutilizar el suero fisiológico del día anterior","El suero abierto se contamina; se usa uno nuevo o de dosis única."]],
n:"Prevención de infección del sitio operatorio e IAAS (Programa de IAAS, MINSAL), técnica aséptica, curación avanzada según el protocolo del establecimiento y registro en ficha."},
{t:"Gasometría arterial radial",l:"Procedimiento · UCI",x:"Hombre de 66 años con disnea y sospecha de insuficiencia respiratoria. Se indica gasometría arterial. Usa oxígeno por mascarilla.",
s:["Verificar la indicación, identificar al paciente y registrar la FiO₂ y el dispositivo","Realizar higiene de manos y preparar la jeringa heparinizada y el material","Realizar el test de Allen modificado para comprobar circulación colateral","Localizar el pulso radial, desinfectar la piel y puncionar a 30-45°","Dejar que la sangre llene la jeringa por la presión arterial","Retirar la aguja, comprimir el sitio varios minutos y expulsar las burbujas de aire","Sellar, rotular y enviar inmediatamente al laboratorio, y registrar"],
e:[["Aspirar con fuerza el émbolo para llenar rápido la jeringa","La sangre arterial sube por su propia presión; aspirar con fuerza altera la muestra."],["Dejar burbujas de aire en la jeringa para no perder tiempo","Las burbujas alteran los gases; se eliminan."],["Comprimir solo 30 segundos aunque el paciente esté anticoagulado","Se comprime varios minutos, más tiempo si hay anticoagulación."],["Puncionar sin comprobar la circulación colateral","Sin Allen se puede comprometer la perfusión de la mano."]],
n:"Técnica aséptica y precauciones estándar (Programa de IAAS, MINSAL), reglamento de residuos REAS (DS 6/2009), normas de laboratorio para transporte de muestras y registro en ficha."},
{t:"Instalación de sonda Foley",l:"Procedimiento · Medicina",x:"Mujer de 78 años con retención urinaria. Se indica sonda vesical a permanencia con bolsa colectora.",
s:["Verificar la indicación, informar, resguardar la privacidad e identificar a la paciente","Realizar higiene de manos y preparar material estéril, sonda, bolsa y agua estéril para el balón","Realizar el aseo genital","Colocar guantes estériles, campo estéril y lubricar la sonda","Introducir la sonda hasta la salida de orina, avanzar un poco más e inflar el balón con agua estéril","Conectar a la bolsa colectora en circuito cerrado y fijar la sonda","Mantener la bolsa bajo el nivel de la vejiga, eliminar residuos y registrar"],
e:[["Inflar el balón apenas entra la sonda sin esperar la salida de orina","Si el balón se infla en la uretra, se lesiona; se infla cuando hay orina."],["Inflar el balón con suero fisiológico","Se usa agua estéril según indicación del fabricante; el suero puede cristalizar."],["Colgar la bolsa sobre el nivel de la vejiga","El reflujo de orina favorece la infección; la bolsa va bajo la vejiga."],["Desconectar la bolsa cada día para lavarla","Se mantiene el circuito cerrado para prevenir infección urinaria."]],
n:"Prevención de infecciones urinarias asociadas a catéter (Programa de IAAS, MINSAL), indicación justificada y registro de fecha de instalación, y registro en ficha."},
{t:"Administración de medicamento por vía EV",l:"Procedimiento · Medicina",x:"Paciente hospitalizado con indicación de antibiótico EV en 30 minutos, con vía venosa periférica instalada.",
s:["Revisar la indicación y verificar paciente, medicamento, dosis, vía, hora y alergias","Realizar higiene de manos y preparar el medicamento con técnica aséptica, rotulándolo","Identificar al paciente con dos identificadores y preguntar por alergias","Comprobar la permeabilidad de la vía y valorar el sitio","Administrar a la velocidad indicada y observar la respuesta del paciente","Lavar la vía al finalizar y eliminar los residuos","Registrar de inmediato la administración y cualquier evento"],
e:[["Preparar varios medicamentos por adelantado sin rotular para ahorrar tiempo","Un medicamento sin rotular es una causa frecuente de errores graves."],["Administrar un medicamento preparado por otra persona sin rotular","Solo se administra lo que uno prepara o lo que está correctamente identificado."],["Pasar en bolo rápido un medicamento indicado en 30 minutos","La velocidad forma parte de la indicación; el bolo puede causar reacciones graves."],["Registrar la administración al final del turno","El registro es inmediato para evitar duplicaciones."]],
n:"Seguridad del paciente y prevención de errores de medicación (estándares de acreditación, Superintendencia de Salud), higiene de manos y asepsia (Programa de IAAS, MINSAL), Ley 20.584 y notificación de eventos adversos."},
{t:"Instalación de sonda nasogástrica",l:"Procedimiento · Medicina",x:"Hombre de 70 años con disfagia tras un ACV. Se indica sonda nasogástrica para alimentación enteral.",
s:["Verificar la indicación, informar y obtener el consentimiento del paciente","Realizar higiene de manos y reunir el material (sonda, lubricante, jeringa, fijación)","Sentar al paciente en posición semisentada alta","Medir la longitud desde la nariz al lóbulo de la oreja y de ahí al apéndice xifoides, y marcarla","Lubricar e introducir por la fosa nasal pidiendo que trague, flexionando levemente el cuello","Confirmar la posición con el método del protocolo (aspirado gástrico, pH o radiografía)","Fijar la sonda, registrar la marca y el procedimiento, y recién entonces iniciar la alimentación"],
e:[["Confirmar la posición solo auscultando el aire que se insufla por la sonda","Ese método no es confiable y puede pasar por alto una ubicación en el pulmón."],["Seguir empujando con fuerza si encuentra resistencia","La resistencia o la tos obligan a retirar y reintentar; se puede perforar."],["Iniciar la alimentación apenas se introduce la sonda, sin confirmar la posición","Si está en el pulmón, la alimentación puede causar una neumonía grave."],["Colocar al paciente acostado completamente plano","Aumenta el riesgo de aspiración; se usa posición semisentada."]],
n:"Seguridad del paciente y prevención de eventos adversos graves (estándares de acreditación, Superintendencia de Salud), higiene de manos y precauciones estándar (Programa de IAAS, MINSAL), Ley 20.584 y registro en ficha."},
{t:"ECG de 12 derivaciones",l:"Procedimiento · Urgencia",x:"Hombre de 55 años con dolor torácico opresivo hace 30 minutos. Se indica ECG de 12 derivaciones urgente.",
s:["Verificar la indicación e identificar al paciente, y resguardar su privacidad","Realizar higiene de manos y preparar el electrocardiógrafo y los electrodos","Posicionar al paciente en decúbito supino, relajado, y preparar la piel de los puntos de contacto","Colocar los electrodos de las extremidades y los precordiales V1 a V6 en sus posiciones correctas","Pedir al paciente que permanezca quieto y sin hablar, y registrar el trazado","Verificar la calidad del trazado, rotular con datos y hora y mostrarlo de inmediato al médico","Registrar el procedimiento y mantener la monitorización del paciente"],
e:[["Colocar V1 y V2 en el segundo espacio intercostal para ver mejor","V1 y V2 van en el cuarto espacio intercostal, a cada lado del esternón."],["Tomar el registro mientras el paciente habla o se mueve","El movimiento genera artefactos que dificultan la interpretación."],["Colocar los electrodos sobre piel sudorosa sin secarla","Sin preparar la piel el contacto es malo y el trazado es de mala calidad."],["Dejar el ECG sin interpretar hasta la ronda médica pese al dolor de pecho","En dolor torácico el ECG se interpreta en menos de 10 minutos."]],
n:"Programa GES de infarto agudo del miocardio con SDST (MINSAL): ECG precoz y activación de la red de reperfusión; identificación del paciente, precauciones estándar y registro en ficha."},
{t:"RCP con desfibrilador (DEA)",l:"Procedimiento · Urgencia",x:"En el pasillo del hospital un visitante de 60 años se desploma. No responde. Hay un DEA cerca.",
s:["Verificar que la escena sea segura y comprobar la respuesta del paciente","Pedir ayuda, solicitar el DEA y activar la alerta de paro","Comprobar si respira y si tiene pulso carotídeo en no más de 10 segundos","Iniciar compresiones de 100-120 por minuto y 5-6 cm de profundidad, permitiendo que el tórax se reexpanda","Encender el DEA y colocar los parches en el tórax desnudo y seco","Pedir que nadie toque al paciente durante el análisis y, si el DEA lo indica, descargar","Reiniciar las compresiones de inmediato por 2 minutos y repetir el ciclo hasta que llegue el equipo"],
e:[["Tomar el pulso durante un minuto antes de decidir si comprimir","Se evalúa a lo más 10 segundos; el tiempo sin compresiones reduce la supervivencia."],["Comprimir lento y superficial para no fracturar costillas","Las compresiones deben ser rápidas y profundas; las costillas fracturadas son esperables."],["Seguir comprimiendo mientras el DEA analiza el ritmo","El contacto altera el análisis y puede lesionar a quien toque al paciente durante la descarga."],["Detener las compresiones más de 10 segundos para ventilar","Las pausas prolongadas reducen la perfusión del cerebro y del corazón."]],
n:"Guías AHA de RCP, Ley 21.156 sobre desfibriladores externos automáticos en lugares de acceso público, SAMU 131, cadena de supervivencia y registro del evento."},
{t:"Administración de insulina subcutánea",l:"Procedimiento · Medicina",x:"Paciente diabético hospitalizado con indicación de insulina subcutánea antes del almuerzo.",
s:["Verificar la indicación, medir la glicemia y confirmar el tipo y la dosis de insulina","Realizar higiene de manos e identificar al paciente","Revisar la insulina (tipo, vencimiento y aspecto), homogenizarla suavemente si es turbia y cargar la dosis","Elegir el sitio de inyección (abdomen o muslo), rotando respecto de la vez anterior","Limpiar la piel, dejar secar y formar un pliegue con los dedos","Insertar la aguja con el ángulo adecuado, inyectar lentamente y esperar unos segundos antes de retirarla","Eliminar la aguja en el contenedor de corto-punzantes sin reencapuchar y registrar la dosis y el sitio"],
e:[["Inyectar siempre en el mismo sitio donde duele menos","Se rota el sitio para evitar lipodistrofias y una absorción irregular."],["Agitar con fuerza la insulina turbia para mezclarla bien","Se homogeniza girando suavemente; agitar forma burbujas y altera la dosis."],["Masajear con fuerza la zona después de inyectar","El masaje acelera la absorción y puede provocar hipoglucemia."],["Reutilizar la aguja en la siguiente inyección","Se usa una aguja nueva en cada inyección."]],
n:"Programa de Salud Cardiovascular y GES diabetes mellitus tipo 1 y tipo 2 (MINSAL), educación terapéutica, manejo de residuos REAS (DS 6/2009), verificación de dosis de medicamentos de alto riesgo y registro en ficha."},
{t:"Inyección intramuscular",l:"Procedimiento · Medicina",x:"Paciente adulto hospitalizado con indicación de un antibiótico intramuscular de 2 mL.",
s:["Verificar la indicación, los correctos del medicamento y las alergias","Realizar higiene de manos, preparar el medicamento con técnica aséptica e identificar al paciente","Elegir el sitio según el volumen y la zona (ventroglúteo, vasto lateral o deltoides), evaluando la piel","Desinfectar la piel y dejar secar","Insertar la aguja a 90° con un movimiento firme y rápido","Inyectar el medicamento lentamente","Retirar la aguja, presionar sin masajear y eliminarla sin reencapuchar, y registrar el sitio y la hora"],
e:[["Elegir siempre el glúteo dorsal sin evaluar la zona","El cuadrante equivocado puede lesionar el nervio ciático; se prefiere el ventroglúteo."],["Inyectar 8 mL de una vez en el deltoides","El deltoides tolera volúmenes pequeños (alrededor de 1-2 mL)."],["Insertar la aguja lentamente a 45°","La técnica intramuscular es a 90° y con movimiento rápido para reducir el dolor y llegar al músculo."],["Reencapuchar la aguja con las dos manos","Es una causa frecuente de accidentes corto-punzantes."]],
n:"Precauciones estándar y manejo de residuos corto-punzantes (REAS, DS 6/2009), Programa de IAAS del MINSAL, verificación de los correctos del medicamento y registro en ficha."},
{t:"Toma de glicemia capilar",l:"Procedimiento · Medicina",x:"Paciente diabético con sudoración y temblor. Se indica una glicemia capilar urgente.",
s:["Verificar la indicación, identificar al paciente e informar el procedimiento","Realizar higiene de manos, colocar guantes y preparar el glucómetro con una tira vigente","Limpiar el dedo y dejarlo secar","Puncionar el lateral de la yema con una lanceta nueva","Aplicar la gota de sangre en la tira, sin exprimir el dedo en exceso","Leer el resultado y actuar según el protocolo, informando de inmediato si es muy bajo o muy alto","Eliminar la lanceta en el contenedor de corto-punzantes y registrar el valor y la hora"],
e:[["Puncionar con el alcohol aún húmedo en el centro de la yema","El alcohol húmedo altera el resultado y el centro de la yema es más doloroso."],["Exprimir el dedo con fuerza para obtener más sangre","El líquido tisular diluye la muestra y altera el valor."],["Reutilizar la lanceta entre pacientes después de limpiarla con alcohol","Las lancetas son de un solo uso; el reuso transmite infecciones."],["Usar una tira vencida si el glucómetro no muestra error","Las tiras vencidas pueden dar resultados falsos."]],
n:"Programa de Salud Cardiovascular y GES diabetes (MINSAL), control de calidad del glucómetro según el establecimiento, manejo de residuos REAS (DS 6/2009) y registro en ficha."},
{t:"Nebulización",l:"Procedimiento · Urgencia",x:"Paciente adulto con crisis obstructiva. Se indica salbutamol e ipratropio en nebulización.",
s:["Verificar la indicación, el fármaco, la dosis y las alergias, e identificar al paciente","Realizar higiene de manos y preparar el medicamento con el diluyente en el nebulizador","Sentar al paciente o ponerlo en posición semisentada","Conectar el nebulizador a la fuente de aire u oxígeno según la indicación, con el flujo recomendado","Colocar la mascarilla o la boquilla ajustada e indicar respiraciones tranquilas","Monitorizar frecuencia cardiaca, saturación, tos y efectos adversos hasta el final de la nebulización","Lavar y secar el equipo según protocolo, higiene de manos y registrar"],
e:[["Nebulizar con el paciente acostado completamente plano","La posición plana empeora la mecánica respiratoria y la distribución del fármaco."],["Conectar a 1 L/min para no incomodar al paciente","El flujo bajo no produce partículas de tamaño adecuado."],["Compartir el nebulizador entre pacientes solo enjuagándolo","Cada paciente usa su propio equipo para evitar infecciones."],["Retirar la mascarilla a los 2 minutos aunque quede medicamento","La dosis no se completa y el efecto es insuficiente."]],
n:"Programas ERA e IRA (MINSAL), control de infecciones (equipo individual, higiene de manos y desinfección del nebulizador), indicación médica y registro en ficha."},
{t:"Control de signos vitales",l:"Procedimiento · Medicina",x:"Paciente adulto hospitalizado que ingresa a la sala. Se indica el control completo de signos vitales.",
s:["Realizar higiene de manos, identificar al paciente e informar el procedimiento","Asegurar el reposo de al menos 5 minutos y la posición adecuada","Medir la presión arterial con el manguito del tamaño correcto, a la altura del corazón","Tomar el pulso por un minuto, evaluando ritmo y amplitud","Contar la frecuencia respiratoria sin avisar al paciente","Medir la temperatura y la saturación de oxígeno","Registrar de inmediato los valores y avisar si alguno está fuera de los rangos de alerta"],
e:[["Medir la presión inmediatamente después de que el paciente caminó hasta la cama","El esfuerzo previo eleva falsamente la presión; se espera el reposo."],["Usar un manguito pequeño en un brazo de mayor diámetro","El manguito inadecuado sobreestima la presión."],["Avisar al paciente que se contará su respiración","Si lo sabe, cambia su patrón respiratorio."],["Anotar los valores de memoria al final del turno","El registro es inmediato para evitar errores y retrasos en las alertas."]],
n:"Programa de Salud Cardiovascular (medición de PA con técnica estandarizada), sistemas de alerta temprana del establecimiento y registro en ficha."},
{t:"Toma de muestra de orina para urocultivo",l:"Procedimiento · Medicina",x:"Mujer de 68 años con fiebre y ardor al orinar. Se indica urocultivo de chorro medio.",
s:["Verificar la indicación, identificar a la paciente y explicarle el procedimiento","Realizar higiene de manos y preparar el frasco estéril y el material","Realizar el aseo genital según la técnica indicada","Indicar que descarte el primer chorro y recolecte el chorro medio sin tocar el borde del frasco","Cerrar el frasco, rotularlo con los datos de la paciente y la hora","Enviarlo de inmediato al laboratorio o conservarlo refrigerado si hay demora","Registrar el procedimiento y la hora del envío"],
e:[["Recolectar el primer chorro para obtener más volumen","El primer chorro arrastra flora de la uretra y contamina la muestra."],["Dejar la muestra a temperatura ambiente durante varias horas","Las bacterias se multiplican y alteran el resultado."],["Usar un frasco limpio de la casa en lugar de uno estéril","La muestra se contamina."],["Tocar el borde interior del frasco para cerrarlo con más firmeza","Contamina la muestra."]],
n:"Programa de IAAS (MINSAL), normas de toma y transporte de muestras del laboratorio y registro en ficha."},
{t:"Curación del catéter venoso central",l:"Procedimiento · UCI",x:"Paciente con catéter venoso central yugular hace 4 días. El apósito está despegado en un borde.",
s:["Verificar la indicación y la fecha del último cambio, e identificar al paciente","Realizar higiene de manos y colocar mascarilla (también al paciente) y guantes limpios","Retirar el apósito previo y observar el sitio de inserción (enrojecimiento, secreción, dolor)","Realizar higiene de manos y colocar guantes estériles","Desinfectar el sitio con clorhexidina alcohólica con movimientos de fricción y dejar secar","Colocar un apósito transparente estéril, fijar y rotular con la fecha","Eliminar los residuos, higiene de manos y registrar el estado del sitio"],
e:[["Palpar de nuevo el sitio con la mano sin guante estéril después de desinfectar","Se contamina el sitio ya desinfectado."],["Aplicar una pomada antibiótica de rutina en el punto de inserción","No se recomienda de rutina: favorece resistencia y hongos."],["Dejar el apósito húmedo o despegado hasta el día siguiente","Un apósito comprometido se cambia de inmediato."],["Retirar el catéter por cuenta propia si el sitio está enrojecido","Se avisa al médico; no es una decisión de enfermería."]],
n:"Prevención de infecciones asociadas a catéter venoso central (Programa de IAAS, MINSAL), técnica aséptica, registro de la fecha de instalación y de los cuidados en la ficha."}

PC.push(...["Paro cardiorrespiratorio. Guías AHA de RCP y soporte vital avanzado; activar el código de paro del establecimiento, registro de la hora y los intervalos, cuidados posparo y notificación; en espacios públicos, la Ley 21.156 sobre desfibriladores externos automáticos.", "Sepsis de foco urinario y obstrucción infectada de la vía urinaria. Protocolo de sepsis, Programa de IAAS (infecciones urinarias), derivación a urología, consentimiento informado (Ley 20.584) y seguimiento de la litiasis."]);DC.push(...[["Cese de la actividad mecánica del corazón con pérdida de conciencia, respiración y pulso; en ritmos no desfibrilables (asistolia o actividad eléctrica sin pulso) no hay descarga eficaz.", "La RCP de alta calidad mantiene el flujo al cerebro y al corazón; la adrenalina precoz y la búsqueda de causas reversibles (como la hiperkalemia) son lo que cambia el pronóstico. Desfibrilar un ritmo no desfibrilable no ayuda."], ["Infección del tracto urinario alto con obstrucción por un cálculo, que puede evolucionar rápido a sepsis.", "El antibiótico y el volumen estabilizan, pero sin drenar la vía urinaria la infección persiste. Los AINE pueden dañar el riñón en un paciente con riesgo de sepsis."]]);PD.push(...["Pancreatitis aguda. Hidratación, analgesia, vigilancia de gravedad, tratamiento de la causa (colecistectomía diferida si es biliar) y consejería sobre el consumo de alcohol; derivación a cirugía y gastroenterología.", "Neumotórax espontáneo. Vigilancia, drenaje pleural según tamaño y síntomas, indicaciones de cese del tabaco y consejería sobre viajes aéreos; control con médico o broncopulmonar."]);DD.push(...[["Inflamación aguda del páncreas, frecuente por cálculos biliares o alcohol, con dolor epigástrico, vómitos y enzimas elevadas.", "La hidratación es la base porque hay pérdidas al tercer espacio, y la analgesia es necesaria; se vigila el deterioro porque puede evolucionar a pancreatitis grave."], ["Aire en el espacio pleural sin trauma, frecuente en jóvenes altos y fumadores, que colapsa parcialmente el pulmón.", "Se vigila porque puede progresar a neumotórax a tensión; el aire se expande con la altura, por eso se desaconseja viajar en avión hasta resolverse."]]);DP.push(...[["Introducción de una sonda por la nariz hasta el estómago para alimentar, administrar medicamentos o descomprimir.", "Se mide para llegar al estómago y no al esófago; la posición semisentada y la confirmación objetiva previenen la aspiración y la colocación en el pulmón, que es una complicación grave."], ["Registro de la actividad eléctrica del corazón con electrodos en el pecho y las extremidades.", "La posición exacta de los electrodos define las derivaciones; el movimiento y la mala preparación de la piel generan artefactos, y en dolor torácico el tiempo hasta la lectura es crítico."]]);
PC.push(...["Emergencia hipertensiva con encefalopatía. Guía MINSAL de hipertensión arterial y GES hipertensión: descenso gradual de la PA con monitorización, estudio del daño de órgano blanco, reincorporación al Programa de Salud Cardiovascular y educación sobre adherencia.", "Traumatismo craneoencefálico. Secuencia XABCDE (PHTLS/ATLS), inmovilización cervical, neurovigilancia seriada con Glasgow y pupilas, derivación a centro con neurocirugía mediante SAMU 131, y revisar si corresponde cobertura GES según edad y gravedad."]);DC.push(...[["Aumento severo de la presión arterial con daño agudo de órganos (cerebro, corazón, riñón); la encefalopatía hipertensiva causa cefalea, confusión y convulsiones.", "El descenso debe ser gradual y con fármacos titulables, porque la autorregulación cerebral está alterada: un descenso brusco causa isquemia. Por eso se desaconseja el nifedipino sublingual."], ["Lesión del cerebro por un golpe en la cabeza, que puede causar sangrados que comprimen el cerebro de forma tardía.", "Se protege la columna cervical hasta descartar lesión y se hace neurovigilancia seriada: un hematoma puede crecer horas después, y la hipertensión con bradicardia y pupila dilatada indica hipertensión intracraneal."]]);PD.push(...["Infarto agudo con supradesnivel del ST, patología GES. ECG en menos de 10 minutos, activar la red de reperfusión, traslado con SAMU 131 y derivación posterior a rehabilitación cardiaca y Programa de Salud Cardiovascular.", "Cetoacidosis diabética en DM1; GES diabetes mellitus tipo 1. Protocolo de CAD (volumen, insulina en infusión, potasio), control horario, educación sobre días de enfermedad y control en policlínico de diabetes."]);DD.push(...[["Obstrucción de una arteria coronaria con necrosis del miocardio; en mujeres y diabéticos puede presentarse con dolor epigástrico, náuseas y sudoración.", "El ECG precoz distingue el infarto de causas digestivas; el infarto inferior puede comprometer el ventrículo derecho, por eso se evitan los nitratos con hipotensión, y la reperfusión rápida salva músculo."], ["Complicación de la DM1 por falta de insulina: hiperglicemia, cetosis y acidosis metabólica, frecuente con infecciones o por omisión de insulina.", "Se repone volumen antes de la insulina y se controla el potasio; el bolo de insulina o el bicarbonato rutinario pueden empeorar la hipotensión y la hipokalemia."]]);DP.push(...[["Maniobras de compresiones torácicas y desfibrilación precoz ante un paro cardiorrespiratorio.", "Las compresiones mantienen el flujo al cerebro y al corazón, por eso se inician sin demora y con pocas interrupciones; el DEA detecta y trata los ritmos desfibrilables, y nadie debe tocar al paciente durante el análisis y la descarga."], ["Administración de insulina en el tejido subcutáneo para controlar la glicemia, con riesgo de hipoglucemia si hay errores.", "Se rota el sitio para evitar la lipodistrofia, que altera la absorción; la insulina turbia se homogeniza suavemente; no se masajea para no acelerar la absorción y la aguja se elimina sin reencapuchar."]]);
PC.push(...["Hemorragia digestiva alta en paciente anticoagulado. Protocolo local de hemorragia digestiva, reversión de anticoagulación según indicación, endoscopía precoz, hemoderivados, notificación de reacciones adversas y seguimiento en el programa de anticoagulación oral."]);DC.push(...[["Sangrado del tubo digestivo alto (por ejemplo, úlcera) agravado por AINE y anticoagulantes, con riesgo de shock hemorrágico.", "Se repone con sangre y no solo con cristaloides, que diluyen y empeoran la coagulopatía; se revierte el anticoagulante y se controla el sangrado con endoscopía; se suspenden los AINE."]]);
